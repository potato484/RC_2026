openapi: 3.1.0
info:
  title: RC26 R2 ROS2 Interface Index
  version: 0.4.0-modular
  summary: 按模块拆分的 R2 ROS2 接口目录
  description: |
    本目录按“ROS2 的 topic / service 本身就是后端接口”来组织。

    这里的 openapi.yaml 不再承载全部 schema，而是作为模块索引。
    具体模块接口请查看 docs/middle/modules 下的独立 YAML。
paths: {}
x-contract-rules:
  backend_interface_is_ros2: true
  keep_ros_field_names: true
  keep_ros_enum_values: true
  keep_ros_time_shape: true
  project_scope: R2 only
x-modules:
  - name: localization
    file: docs/middle/modules/localization.yaml
    description: 开局一次 SAC-IA+GICP 重定位、连续 GICP 跟踪和 initialpose 接管；对外只暴露 pose 与 diagnostics。
    topics:
      - /localization/pose_with_cov
      - /localization/diagnostics
    services: []
  - name: navigation
    file: docs/middle/modules/navigation.yaml
    description: Nav2 导航接口；/cmd_vel 是工作区速度输出契约，默认由 rc26_mcu_transport 消费并下发 POSE_TARGET。
    topics:
      - /cmd_vel
      - /plan
      - /local_costmap/costmap
      - /global_costmap/costmap
    services: []
    actions:
      - /navigate_to_pose
  - name: vision
    file: docs/middle/modules/vision.yaml
    topics:
      - /vision/tip_detections
    services: []
  - name: mechanism
    file: docs/middle/modules/mechanism.yaml
    description: 机构 raw transport 契约；/mechanism/send_command 和 /mechanism/command_feedback 的 provider 由 rc26_mcu_transport 提供。
    topics:
      - /mechanism/command_feedback
    services:
      - /mechanism/send_command
  - name: stream
    file: docs/middle/modules/stream.yaml
    topics: []
    services: []
