openapi: 3.1.0
info:
  title: RC26 R2 Localization ROS2 Contract
  version: 0.5.0
  description: 定位模块最小比赛链路接口；模块内部包含开局一次 SAC-IA+GICP 重定位、连续 GICP 跟踪、initialpose 接管，以及默认关闭的实验性在线重定位，但对外仍只暴露 pose 与 diagnostics。
servers:
  - url: http://localhost:8080
tags:
  - name: Topic
paths:
  /ros2/topics/localization/pose_with_cov:
    get:
      tags: [Topic]
      summary: 读取 topic /localization/pose_with_cov 的最新消息
      x-ros:
        interface_kind: topic
        name: /localization/pose_with_cov
        message_type: geometry_msgs/msg/PoseWithCovarianceStamped
      responses:
        '200':
          description: geometry_msgs/msg/PoseWithCovarianceStamped
  /ros2/topics/localization/diagnostics:
    get:
      tags: [Topic]
      summary: 读取 topic /localization/diagnostics 的最新消息，包含配准质量、开局重定位状态和实验性在线重定位状态
      x-ros:
        interface_kind: topic
        name: /localization/diagnostics
        message_type: diagnostic_msgs/msg/DiagnosticArray
        key_value_fields:
          - accepted
          - converged
          - human_message
          - inliers
          - min_inliers
          - source_points
          - max_normalized_error
          - normalized_error
          - map_loaded
          - target_ready
          - startup_relocalization
          - online_relocalization_state
          - online_relocalization_attempts
          - online_relocalization_reason
          - last_relocalization_source
          - input_cloud_topic
          - current_scan_frame_id
      responses:
        '200':
          description: diagnostic_msgs/msg/DiagnosticArray
