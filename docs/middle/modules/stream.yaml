openapi: 3.1.0
info:
  title: RC26 R2 Unified Stream Contract
  version: 0.3.0
  description: |
    统一实时订阅流。

    用于外部只读消费者一次性订阅多个 ROS2 topic。
    payload 必须保持与原始 ROS2 .msg 同构。
servers:
  - url: http://localhost:8080
tags:
  - name: Stream
paths:
  /ros2/stream/sse:
    get:
      tags: [Stream]
      summary: 统一 SSE 订阅流
      parameters:
        - name: topics
          in: query
          required: false
          schema:
            type: string
          description: 逗号分隔的 topic 列表
      responses:
        '200':
          description: SSE 实时流
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                default:
                  value: |
                    event: ros2.topic
                    data: {"topic":"/mechanism/command_feedback","message_type":"rc26_interfaces/msg/MechanismTransportFeedback","payload":{"seq":42,"feedback_id":6,"payload":[]}}
components:
  schemas:
    Ros2SseEnvelope:
      type: object
      required: [topic, message_type, payload]
      properties:
        topic:
          type: string
        message_type:
          type: string
        payload:
          type: object
          additionalProperties: true
