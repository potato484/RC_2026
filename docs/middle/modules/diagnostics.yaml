openapi: 3.1.0
info:
  title: RC26 R2 Diagnostics ROS2 Contract
  version: 0.4.0
  description: 运维聚合诊断接口
servers:
  - url: http://localhost:8080
tags:
  - name: Topic
  - name: Service
paths:
  /ros2/topics/r2/diag/operator_status:
    get:
      tags: [Topic]
      summary: 读取 topic r2/diag/operator_status 的最新消息
      x-ros:
        interface_kind: topic
        name: r2/diag/operator_status
        message_type: rc26_interfaces/msg/OperatorStatus
      responses:
        '200':
          description: rc26_interfaces/msg/OperatorStatus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorStatus'
  /ros2/topics/r2/diag/events:
    get:
      tags: [Topic]
      summary: 读取 topic r2/diag/events 的最新消息
      x-ros:
        interface_kind: topic
        name: r2/diag/events
        message_type: rc26_interfaces/msg/VisualizationEventArray
      responses:
        '200':
          description: rc26_interfaces/msg/VisualizationEventArray
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisualizationEventArray'
  /ros2/services/r2/diag/reset_topic_timeout_count:
    post:
      tags: [Service]
      summary: 调用 service r2/diag/reset_topic_timeout_count
      x-ros:
        interface_kind: service
        name: r2/diag/reset_topic_timeout_count
        service_type: std_srvs/srv/Trigger
      responses:
        '200':
          description: std_srvs/srv/Trigger response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponse'
components:
  schemas:
    Time:
      type: object
      required: [sec, nanosec]
      properties:
        sec:
          type: integer
        nanosec:
          type: integer
    Header:
      type: object
      required: [stamp, frame_id]
      properties:
        stamp:
          $ref: '#/components/schemas/Time'
        frame_id:
          type: string
    OperatorStatus:
      type: object
      required:
        - header
        - overall_level
        - overall_reason
        - localization_level
        - localization_reason
        - localization_state
        - controller_level
        - controller_mode
        - control_degraded
        - control_degenerate_score
        - compute_time_ms
        - pose_age_ms
        - collision_d_min
        - keepout_level
        - keepout_ready
        - keepout_reason
        - terrain_level
        - terrain_online
        - terrain_obstacle_active
        - terrain_drop_active
        - terrain_traversability_min
        - terrain_climbable_active
        - terrain_step_edge_active
        - nav_safety_level
        - nav_profile
        - nav_stop_required
        - nav_timed_out
        - mechanism_level
        - mechanism_comm_health
        - topic_timeout_count
        - active_event_codes
      properties:
        header:
          $ref: '#/components/schemas/Header'
        overall_level:
          type: integer
          enum: [0, 1, 2, 3]
        overall_reason:
          type: string
        localization_level:
          type: integer
          enum: [0, 1, 2, 3]
        localization_reason:
          type: string
        localization_state:
          type: string
        controller_level:
          type: integer
          enum: [0, 1, 2, 3]
        controller_mode:
          type: string
        control_degraded:
          type: boolean
        control_degenerate_score:
          type: number
          format: double
        compute_time_ms:
          type: number
          format: double
        pose_age_ms:
          type: number
          format: double
        collision_d_min:
          type: number
          format: double
        keepout_level:
          type: integer
          enum: [0, 1, 2, 3]
        keepout_ready:
          type: boolean
        keepout_reason:
          type: string
        terrain_level:
          type: integer
          enum: [0, 1, 2, 3]
        terrain_online:
          type: boolean
        terrain_obstacle_active:
          type: boolean
        terrain_drop_active:
          type: boolean
        terrain_traversability_min:
          type: number
          format: float
        terrain_climbable_active:
          type: boolean
        terrain_step_edge_active:
          type: boolean
        nav_safety_level:
          type: integer
          enum: [0, 1, 2, 3]
        nav_profile:
          type: string
        nav_stop_required:
          type: boolean
        nav_timed_out:
          type: boolean
        mechanism_level:
          type: integer
          enum: [0, 1, 2, 3]
        mechanism_comm_health:
          type: integer
        topic_timeout_count:
          type: integer
        active_event_codes:
          type: array
          items:
            type: string
    VisualizationEvent:
      type: object
      required: [code, severity, title, detail, source_signal, recommendation, active, latched]
      properties:
        code:
          type: string
        severity:
          type: integer
          enum: [0, 1, 2, 3]
        title:
          type: string
        detail:
          type: string
        source_signal:
          type: string
        recommendation:
          type: string
        active:
          type: boolean
        latched:
          type: boolean
    VisualizationEventArray:
      type: object
      required: [header, events]
      properties:
        header:
          $ref: '#/components/schemas/Header'
        events:
          type: array
          items:
            $ref: '#/components/schemas/VisualizationEvent'
    TriggerResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string
