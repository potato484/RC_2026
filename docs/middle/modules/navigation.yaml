openapi: 3.1.0
info:
  title: RC26 R2 Navigation ROS2 Contract
  version: 0.9.0
  description: 当前导航契约只暴露底盘速度输出。速度命令来自 rc26_decision 内部 odom 单轴分段闭环导航或同包内串行动作，默认由 rc26_mcu_transport 消费并下发 POSE_TARGET。旧 MF keepout / terrain 兼容接口已删除，不属于当前公开契约。
servers:
  - url: http://localhost:8080
tags:
  - name: Topic
paths:
  /ros2/topics/cmd_vel:
    get:
      tags: [Topic]
      summary: 读取底盘速度命令；默认硬件执行由 rc26_mcu_transport 负责
      x-ros:
        interface_kind: topic
        name: /cmd_vel
        message_type: geometry_msgs/msg/Twist
      responses:
        '200':
          description: geometry_msgs/msg/Twist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Twist'
components:
  schemas:
    Vector3:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number
    Twist:
      type: object
      properties:
        linear:
          $ref: '#/components/schemas/Vector3'
        angular:
          $ref: '#/components/schemas/Vector3'
