openapi: 3.1.0
info:
  title: RC26 R2 Navigation ROS2 Contract
  version: 0.8.0
  description: Nav2 基础导航与当前决策侧导航接口契约；/cmd_vel 是工作区输出契约，默认由 rc26_mcu_transport 消费并下发 POSE_TARGET。MF keepout 相关接口仅作为归档兼容定义保留，不属于当前运行时路径。
servers:
  - url: http://localhost:8080
tags:
  - name: Topic
  - name: Service
  - name: Action
paths:
  /ros2/actions/navigate_to_pose:
    post:
      tags: [Action]
      summary: Nav2 单目标位姿导航 action
      x-ros:
        interface_kind: action
        name: /navigate_to_pose
        action_type: nav2_msgs/action/NavigateToPose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigateToPoseGoal'
      responses:
        '200':
          description: nav2_msgs/action/NavigateToPose result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NavigateToPoseResult'
  /ros2/topics/cmd_vel:
    get:
      tags: [Topic]
      summary: 读取 Nav2 velocity_smoother 输出的底盘速度命令；默认硬件执行由 rc26_mcu_transport 负责
      x-ros:
        interface_kind: topic
        name: /cmd_vel
        message_type: geometry_msgs/msg/Twist
      responses:
        '200':
          description: geometry_msgs/msg/Twist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Twist'
  /ros2/topics/plan:
    get:
      tags: [Topic]
      summary: 读取 Nav2 planner 输出的全局路径
      x-ros:
        interface_kind: topic
        name: /plan
        message_type: nav_msgs/msg/Path
      responses:
        '200':
          description: nav_msgs/msg/Path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Path'
  /ros2/topics/local_costmap_costmap:
    get:
      tags: [Topic]
      summary: 读取 Nav2 local costmap
      x-ros:
        interface_kind: topic
        name: /local_costmap/costmap
        message_type: nav_msgs/msg/OccupancyGrid
      responses:
        '200':
          description: nav_msgs/msg/OccupancyGrid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupancyGrid'
  /ros2/topics/global_costmap_costmap:
    get:
      tags: [Topic]
      summary: 读取 Nav2 global costmap
      x-ros:
        interface_kind: topic
        name: /global_costmap/costmap
        message_type: nav_msgs/msg/OccupancyGrid
      responses:
        '200':
          description: nav_msgs/msg/OccupancyGrid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupancyGrid'
components:
  schemas:
    Time:
      type: object
      properties:
        sec:
          type: integer
        nanosec:
          type: integer
    Header:
      type: object
      properties:
        stamp:
          $ref: '#/components/schemas/Time'
        frame_id:
          type: string
    Point:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number
    Quaternion:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number
        w:
          type: number
    Pose:
      type: object
      properties:
        position:
          $ref: '#/components/schemas/Point'
        orientation:
          $ref: '#/components/schemas/Quaternion'
    PoseStamped:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/Header'
        pose:
          $ref: '#/components/schemas/Pose'
    Vector3:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number
    Twist:
      type: object
      properties:
        linear:
          $ref: '#/components/schemas/Vector3'
        angular:
          $ref: '#/components/schemas/Vector3'
    Path:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/Header'
        poses:
          type: array
          items:
            $ref: '#/components/schemas/PoseStamped'
    MapMetaData:
      type: object
      properties:
        map_load_time:
          $ref: '#/components/schemas/Time'
        resolution:
          type: number
        width:
          type: integer
        height:
          type: integer
        origin:
          $ref: '#/components/schemas/Pose'
    OccupancyGrid:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/Header'
        info:
          $ref: '#/components/schemas/MapMetaData'
        data:
          type: array
          items:
            type: integer
    NavigateToPoseGoal:
      type: object
      required: [pose]
      properties:
        pose:
          $ref: '#/components/schemas/PoseStamped'
        behavior_tree:
          type: string
          description: 可选 Nav2 BT XML 路径；空字符串表示使用 Nav2 默认树。
    NavigateToPoseResult:
      type: object
      description: Humble 中 nav2_msgs/action/NavigateToPose result 为空消息。
      properties:
        result:
          type: object
          additionalProperties: false
    NavigateToPoseFeedback:
      type: object
      properties:
        current_pose:
          $ref: '#/components/schemas/PoseStamped'
        navigation_time:
          $ref: '#/components/schemas/Time'
        estimated_time_remaining:
          $ref: '#/components/schemas/Time'
        number_of_recoveries:
          type: integer
        distance_remaining:
          type: number
    MfBlockOverlayCell:
      type: object
      description: 归档兼容的 MF keepout overlay 单元；当前主链不发布、不订阅，也不接入 Nav2 costmap。
      properties:
        grid_id:
          type: integer
        state:
          type: integer
          enum: [0, 1, 2, 3]
          description: FREE=0, BLOCKED=1, UNKNOWN=2, SLOW=3
        confidence:
          type: number
        keepout_active:
          type: boolean
    MfBlockOverlay:
      type: object
      description: 归档兼容消息；当前主链不发布 `/mf_block_overlay`。
      properties:
        header:
          $ref: '#/components/schemas/Header'
        team:
          type: string
        cells:
          type: array
          items:
            $ref: '#/components/schemas/MfBlockOverlayCell'
    SetKeepoutRuntimeRequest:
      type: object
      description: 归档兼容请求；当前主链不提供 `/kfs_keepout/set_runtime` 服务。
      properties:
        activate:
          type: boolean
        reason:
          type: string
    SetKeepoutRuntimeResponse:
      type: object
      description: 归档兼容响应；当前主链不调用 `/kfs_keepout/set_runtime` 服务。
      properties:
        ok:
          type: boolean
        active:
          type: boolean
        outputs_cleared:
          type: boolean
        component_loaded:
          type: boolean
        status:
          type: string
        message:
          type: string
x-archived-runtime-contracts:
  topics:
    - /mf_block_overlay
    - /kfs_filter_mask
    - /kfs_keepout_heartbeat
  services:
    - /kfs_keepout/set_runtime
  schemas:
    - MfBlockOverlay
    - MfBlockOverlayCell
    - SetKeepoutRuntimeRequest
    - SetKeepoutRuntimeResponse
  note: 这些接口文件可继续生成用于历史兼容，但 rc26_bringup、rc26_decision 和默认运行时不再启动、发布、订阅或调用对应链路。
