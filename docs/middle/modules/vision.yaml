openapi: 3.1.0
info:
  title: RC26 R2 Vision ROS2 Contract
  version: 0.3.0
  description: 视觉检测结果接口
servers:
  - url: http://localhost:8080
tags:
  - name: Topic
paths:
  /ros2/topics/vision/tip_detections:
    get:
      tags: [Topic]
      summary: 读取 topic /vision/tip_detections 的最新消息
      x-ros:
        interface_kind: topic
        name: /vision/tip_detections
        message_type: rc26_interfaces/msg/TipDetectionArray
      responses:
        '200':
          description: rc26_interfaces/msg/TipDetectionArray
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipDetectionArray'
components:
  schemas:
    Time:
      type: object
      required: [sec, nanosec]
      properties:
        sec:
          type: integer
        nanosec:
          type: integer
    Header:
      type: object
      required: [stamp, frame_id]
      properties:
        stamp:
          $ref: '#/components/schemas/Time'
        frame_id:
          type: string
    Point:
      type: object
      required: [x, y, z]
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        z:
          type: number
          format: double
    PointStamped:
      type: object
      required: [header, point]
      properties:
        header:
          $ref: '#/components/schemas/Header'
        point:
          $ref: '#/components/schemas/Point'
    TipDetection:
      type: object
      required: [tip_index, position_map, confidence, depth_m, spacing_valid]
      properties:
        tip_index:
          type: integer
        position_map:
          $ref: '#/components/schemas/PointStamped'
        confidence:
          type: number
          format: float
        depth_m:
          type: number
          format: float
        spacing_valid:
          type: boolean
    TipDetectionArray:
      type: object
      required: [header, detections]
      properties:
        header:
          $ref: '#/components/schemas/Header'
        detections:
          type: array
          items:
            $ref: '#/components/schemas/TipDetection'
