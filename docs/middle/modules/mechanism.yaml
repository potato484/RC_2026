openapi: 3.1.0
info:
  title: RC26 R2 Mechanism ROS2 Contract
  version: 0.5.0
  description: |
    机构 raw transport 契约。

    当前公开接口只保留：
    - `/mechanism/send_command`
    - `/mechanism/command_feedback`

    这两个接口由 `rc26_mcu_transport` 提供；`rc26_mechanism` 当前只是轻量 lifecycle 占位，不再创建旧高层 action，也不再发布 `/mechanism/status`。

    `/mechanism/send_command` 请求字段 `wait_ack=true` 时，`accepted=true` 只表示目标 MCU 已返回通用 `ACK(0x00)`，不表示动作已经完成。ACK 等待窗口内若持续收到 transport 级 `MCU_ERROR(0xFE)` 或超时，service 返回 `accepted=false`，原因通过 `rc26_mcu_transport` 日志和 diagnostics `last_error` 说明。

    `wait_ack=false` 只用于明确 no-ack 的单次通知命令，例如启动就绪 `STARTUP_READY_WAITING_LIMIT(0x20)`；provider 写入串口帧成功即返回 `accepted=true` 和 `seq`，不等待通用 ACK、不进入 retry，也不等待业务反馈。

    动作完成、限位、激光突变等业务事件经 `/mechanism/command_feedback` 透传，由消费方按自身状态机解释。`feedback_id=0xFE` 且 payload 长度为 2 时也属于机械臂业务状态/失败反馈：`payload[0]` 是 `failed_cmd`，`payload[1]` 是 `error_code`；`error_code=0x01` 表示命令仍在处理中，消费方应继续等待最终业务反馈，不应直接判定失败。其它长度的 `0xFE` 仍按 transport 异常处理，不作为业务反馈交给决策层。
servers:
  - url: http://localhost:8080
tags:
  - name: Topic
  - name: Service
paths:
  /ros2/topics/mechanism/command_feedback:
    get:
      tags: [Topic]
      summary: 读取 topic /mechanism/command_feedback 的最新消息
      x-ros:
        interface_kind: topic
        name: /mechanism/command_feedback
        message_type: rc26_interfaces/msg/MechanismTransportFeedback
      responses:
        '200':
          description: rc26_interfaces/msg/MechanismTransportFeedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MechanismTransportFeedback'
  /ros2/services/mechanism/send_command:
    post:
      tags: [Service]
      summary: 调用 service /mechanism/send_command 下发原始目标 MCU 命令
      x-ros:
        interface_kind: service
        name: /mechanism/send_command
        service_type: rc26_interfaces/srv/SendMechanismTransportCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMechanismTransportCommandRequest'
      responses:
        '200':
          description: rc26_interfaces/srv/SendMechanismTransportCommand.Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMechanismTransportCommandResponse'
components:
  schemas:
    MechanismTransportFeedback:
      type: object
      required: [seq, feedback_id, payload]
      properties:
        seq:
          type: integer
          minimum: 0
          maximum: 255
          description: MCU 上行帧序号。需要匹配命令完成反馈的消费方应按自身状态机使用 seq。
        feedback_id:
          type: integer
          minimum: 0
          maximum: 255
          description: >
            MCU 上行业务反馈 ID。当前透传的主要反馈包括 0x02/0x03
            机械臂升降预调完成、0x04/0x05/0x07 台阶激光高度突变、
            0x06 武馆前方限位触发、0x09 梅林预选赛高抬升完成、
            0x0A KFS 向下夹取前第二节机械臂放下完成、
            0x0B 梅林预选赛入口高侧 KFS 夹取完成、0x0C 比赛开始完成、
            0x0D 第二预选赛开始完成、0x0F 第二预选赛机械臂高抬升完成、
            0x10 MF 预选独立树外部触发、0x11 第二预选赛 KFS 夹取完成，
            以及 payload 长度为 2 的 0xFE 机械臂业务状态/失败反馈。
            除 0xFE 外，payload v1 为空或由消费方忽略；
            其它长度的 0xFE 仍视为 transport 异常，不作为业务反馈透传。
        payload:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
          description: >
            对 feedback_id=0xFE，payload 固定为 2 字节：
            payload[0]=failed_cmd，payload[1]=error_code。error_code 取值：
            0x01 PLANAR_ARM_FAIL_BUSY，命令仍在处理中，应继续等待最终反馈；
            0x02 PLANAR_ARM_FAIL_INVALID_PAYLOAD，停止重发并检查发送帧格式；
            0x03 PLANAR_ARM_FAIL_NOT_INIT，等待下位机初始化完成；
            0x04 PLANAR_ARM_FAIL_HAL_ERROR，停止自动重发并进入异常保护；
            0x05 PLANAR_ARM_FAIL_INVALID_STATE，检查动作流程顺序。
    SendMechanismTransportCommandRequest:
      type: object
      required: [command_id, payload, wait_ack]
      properties:
        command_id:
          type: integer
          minimum: 0
          maximum: 255
          description: >
            原始下行 CommandID。当前常用值包括 GRAB_TIP=0x01、
            GRAB_KFS_DOWN=0x02、GRAB_KFS_UP=0x03、ARM_RAISE=0x04、
            ARM_LOWER=0x05、PLACE_KFS_GRID=0x06、FRONT_PUSHROD_EXTEND=0x08、
            FRONT_PUSHROD_RETRACT=0x09、REAR_PUSHROD_EXTEND=0x0A、
            REAR_PUSHROD_RETRACT=0x0B、POSE_TARGET=0x0C、
            ARM_HIGH_RAISE=0x0D、ARM_SECOND_LOWER=0x0E、
            ENTRY_GRAB_KFS_UP=0x0F、COMPETITION_START=0x10、
            SECOND_PRESELECTION_START=0x11、
            SECOND_PRESELECTION_ARM_HIGH_RAISE=0x12、
            SECOND_PRESELECTION_PLACE_KFS=0x13、
            SECOND_PRESELECTION_ARM_LOWER=0x14、
            SECOND_PRESELECTION_PRELOAD_KFS_PICKUP=0x15、
            STARTUP_READY_WAITING_LIMIT=0x20。
        payload:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
        wait_ack:
          type: boolean
          description: >
            true 表示可靠机构命令，provider 调用 sendCommand() 并等待目标 MCU 通用 ACK；
            false 表示 no-ack 通知，provider 调用 sendCommandNoAck()，仅确认串口写入成功。
            现有机构动作、推杆、视觉测试和决策握手命令应使用 true；
            启动就绪 0x20 通知使用 false。
    SendMechanismTransportCommandResponse:
      type: object
      required: [accepted, seq]
      properties:
        accepted:
          type: boolean
          description: >
            wait_ack=true 时，true 表示目标 MCU 已返回通用 ACK(0x00)；
            wait_ack=false 时，true 表示串口帧已成功写入。false 表示 transport 拒绝、
            超时、断链或 MCU 持续返回 0xFE 下位机原因。
        seq:
          type: integer
          minimum: 0
          maximum: 255
          description: 已发送串口帧序号；调用方可用它与后续业务反馈做状态机级匹配。
