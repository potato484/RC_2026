openapi: 3.1.0
info:
  title: RC26 R2 Mechanism ROS2 Contract
  version: 0.3.0
  description: 机构状态接口
servers:
  - url: http://localhost:8080
tags:
  - name: Topic
paths:
  /ros2/topics/mechanism/state:
    get:
      tags: [Topic]
      summary: 读取 topic /mechanism/state 的最新消息
      x-ros:
        interface_kind: topic
        name: /mechanism/state
        message_type: rc26_interfaces/msg/MechanismState
      responses:
        '200':
          description: rc26_interfaces/msg/MechanismState
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MechanismState'
components:
  schemas:
    Time:
      type: object
      required: [sec, nanosec]
      properties:
        sec:
          type: integer
        nanosec:
          type: integer
    Header:
      type: object
      required: [stamp, frame_id]
      properties:
        stamp:
          $ref: '#/components/schemas/Time'
        frame_id:
          type: string
    MechanismState:
      type: object
      required:
        - header
        - tip_state
        - hal_open
        - locked_tip_slot
        - assembled_count
        - last_error_code
        - current_cmd_id
        - cmd_elapsed_ms
        - ack_timeout_count
        - reconnect_count
        - parse_error_count
        - avg_rtt_ms
        - comm_health_level
      properties:
        header:
          $ref: '#/components/schemas/Header'
        tip_state:
          type: integer
        hal_open:
          type: boolean
        locked_tip_slot:
          type: integer
        assembled_count:
          type: integer
        last_error_code:
          type: integer
        current_cmd_id:
          type: integer
        cmd_elapsed_ms:
          type: integer
        ack_timeout_count:
          type: integer
        reconnect_count:
          type: integer
        parse_error_count:
          type: integer
        avg_rtt_ms:
          type: number
          format: float
        comm_health_level:
          type: integer
