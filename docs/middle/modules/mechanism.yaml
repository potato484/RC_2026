openapi: 3.1.0
info:
  title: RC26 R2 Mechanism ROS2 Contract
  version: 0.4.0
  description: |
    机构状态与共享串口桥接接口。

    注意：
    - 当前保留的机构动作入口是 action `/mechanism/grab_tip`、`/mechanism/assemble_weapon` 与 `/mechanism/run_command`
    - `PlaceKFSGrid.action` 已移除；KFS 放置改为通过 `/mechanism/run_command` 下发 `PLACE_KFS_GRID + payload{grid_position, layer}`
    - 本文档额外覆盖 mechanism 与 `rc26_mcu_transport` 之间的 topic/service 契约
    - `/mechanism/send_command` 与 `/mechanism/command_feedback` 当前由 `rc26_mcu_transport` 提供；涉及机构动作的运行链必须启动该目标 MCU 串口 owner
    - `rc26_mechanism`、决策、遥控 sidecar 与视觉 tip test 都只是这些接口的消费者
    - `/mechanism/command_feedback` 会透传双推杆业务 ACK `0x13~0x16`、当前台阶 BT 消费的激光测距高度突变事件 `FRONT_LASER_HEIGHT_JUMP(0x17)` / `REAR_LASER_HEIGHT_JUMP(0x18)`、历史保留的 `FRONT_SECOND_LASER_HEIGHT_JUMP(0x1A)`，以及武馆前方限位开关触发事件 `FRONT_LIMIT_SWITCH_TRIGGERED(0x19)`；这些事件 v1 payload 为空或忽略
servers:
  - url: http://localhost:8080
tags:
  - name: Topic
  - name: Service
paths:
  /ros2/topics/mechanism/status:
    get:
      tags: [Topic]
      summary: 读取 topic /mechanism/status 的最新消息
      x-ros:
        interface_kind: topic
        name: /mechanism/status
        message_type: rc26_interfaces/msg/MechanismState
      responses:
        '200':
          description: rc26_interfaces/msg/MechanismState
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MechanismState'
  /ros2/topics/mechanism/command_feedback:
    get:
      tags: [Topic]
      summary: 读取 topic /mechanism/command_feedback 的最新消息
      x-ros:
        interface_kind: topic
        name: /mechanism/command_feedback
        message_type: rc26_interfaces/msg/MechanismTransportFeedback
      responses:
        '200':
          description: rc26_interfaces/msg/MechanismTransportFeedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MechanismTransportFeedback'
  /ros2/services/mechanism/send_command:
    post:
      tags: [Service]
      summary: 调用 service /mechanism/send_command 下发共享串口机构命令
      x-ros:
        interface_kind: service
        name: /mechanism/send_command
        service_type: rc26_interfaces/srv/SendMechanismTransportCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMechanismTransportCommandRequest'
      responses:
        '200':
          description: rc26_interfaces/srv/SendMechanismTransportCommand.Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMechanismTransportCommandResponse'
components:
  schemas:
    Time:
      type: object
      required: [sec, nanosec]
      properties:
        sec:
          type: integer
        nanosec:
          type: integer
    Header:
      type: object
      required: [stamp, frame_id]
      properties:
        stamp:
          $ref: '#/components/schemas/Time'
        frame_id:
          type: string
    MechanismState:
      type: object
      required:
        - hal_open
        - last_error_code
        - current_cmd_id
      properties:
        hal_open:
          type: boolean
        last_error_code:
          type: integer
        current_cmd_id:
          type: integer
    MechanismTransportFeedback:
      type: object
      required: [seq, feedback_id, payload]
      properties:
        seq:
          type: integer
          minimum: 0
          maximum: 255
        feedback_id:
          type: integer
          minimum: 0
          maximum: 255
          description: MCU 上行业务反馈 ID；当前台阶 BT 消费的激光测距事件使用 0x17/0x18，历史 0x1A 仍可透传但不再作为当前台阶阶段推进条件，武馆前方限位开关触发使用 0x19，payload v1 为空或忽略。
        payload:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
    SendMechanismTransportCommandRequest:
      type: object
      required: [command_id, payload]
      properties:
        command_id:
          type: integer
          minimum: 0
          maximum: 255
        payload:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255
    SendMechanismTransportCommandResponse:
      type: object
      required: [accepted, seq]
      properties:
        accepted:
          type: boolean
        seq:
          type: integer
          minimum: 0
          maximum: 255
  # --- M3 新增 ---
  /ros2/topics/mechanism/action_history:
    get:
      tags: [Topic]
      summary: 机构动作历史环缓冲
      x-ros:
        interface_kind: topic
        name: /mechanism/action_history
        message_type: rc26_interfaces/msg/MechanismActionHistory
      responses:
        '200':
          description: rc26_interfaces/msg/MechanismActionHistory
