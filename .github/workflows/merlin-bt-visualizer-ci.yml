name: merlin-bt-visualizer-ci

on:
  push:
    paths:
      - '.github/workflows/merlin-bt-visualizer-ci.yml'
      - '.github/workflows/merlin-bt-visualizer-cd.yml'
      - 'docs/test/README.md'
      - 'docs/test/merlin_bt_visualizer/**'
      - 'docs/frontend/**'
      - 'package.json'
      - 'merlin-bt-visualizer/**'
      - 'src/rc26_decision/behavior_trees/*.xml'
  pull_request:
    paths:
      - '.github/workflows/merlin-bt-visualizer-ci.yml'
      - '.github/workflows/merlin-bt-visualizer-cd.yml'
      - 'docs/test/README.md'
      - 'docs/test/merlin_bt_visualizer/**'
      - 'docs/frontend/**'
      - 'package.json'
      - 'merlin-bt-visualizer/**'
      - 'src/rc26_decision/behavior_trees/*.xml'

jobs:
  preflight:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: merlin-bt-visualizer/package-lock.json

      - name: Install merlin dependencies
        run: npm --prefix merlin-bt-visualizer ci

      - name: Prepare Playwright Chromium
        run: bash docs/test/merlin_bt_visualizer/ensure-playwright-ready.sh

      - name: Run merlin strict preflight
        run: npm run merlin:preflight:strict

      - name: Upload merlin artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merlin-bt-visualizer-artifacts
          path: |
            artifacts/merlin-bt-visualizer/
            release/merlin_bt_visualizer
            release/merlin_bt_visualizer.tgz
          if-no-files-found: ignore
