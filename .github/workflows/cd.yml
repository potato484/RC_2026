name: rc26-visualization-viewer-cd

on:
  workflow_dispatch:
  push:
    tags:
      - 'rc26-visualization-viewer-v*'

jobs:
  package-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install visualization viewer dependencies
        run: npm --prefix src/rc26_visualization/viewer ci

      - name: Build release package
        run: npm run cd:package

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rc26-visualization-viewer-release
          path: release/

  deploy-via-ssh:
    needs: package-release
    if: ${{ github.event_name == 'workflow_dispatch' && secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_PATH != '' && secrets.DEPLOY_SSH_KEY != '' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: rc26-visualization-viewer-release
          path: release/

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Prepare SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > "$HOME/.ssh/rc26_visualization_deploy"
          chmod 600 "$HOME/.ssh/rc26_visualization_deploy"

      - name: Deploy release via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          export DEPLOY_SSH_KEY_PATH="$HOME/.ssh/rc26_visualization_deploy"
          bash docs/test/release/deploy-via-ssh.sh
