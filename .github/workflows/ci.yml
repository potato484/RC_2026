name: rc26-visualization-viewer-ci

on:
  push:
    paths:
      - '.github/workflows/ci.yml'
      - 'docs/test/**'
      - 'docs/frontend/**'
      - 'docs/backend/archive/rc26_topo_nav/README.md'
      - 'docs/backend/archive/rc26_visualization/README.md'
      - 'package.json'
      - 'src/rc26_visualization/viewer/**'
      - 'src/rc26_visualization/scripts/visualization_server.py'
      - 'src/rc26_visualization/scripts/visualization_algorithms.py'
      - 'src/rc26_visualization/scripts/render_graph_sim_html.py'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'docs/test/**'
      - 'docs/frontend/**'
      - 'docs/backend/archive/rc26_topo_nav/README.md'
      - 'docs/backend/archive/rc26_visualization/README.md'
      - 'package.json'
      - 'src/rc26_visualization/viewer/**'
      - 'src/rc26_visualization/scripts/visualization_server.py'
      - 'src/rc26_visualization/scripts/visualization_algorithms.py'
      - 'src/rc26_visualization/scripts/render_graph_sim_html.py'

jobs:
  preflight:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install visualization viewer dependencies
        run: npm --prefix src/rc26_visualization/viewer ci

      - name: Install Python E2E dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn playwright

      - name: Run strict preflight
        run: npm run preflight:strict

      - name: Upload preflight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc26-visualization-viewer-preflight-artifacts
          path: artifacts/
          if-no-files-found: ignore
