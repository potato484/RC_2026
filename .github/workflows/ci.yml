name: ROS 2 CI

on:
  workflow_dispatch:

concurrency:
  group: ros2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test ROS 2 workspace
    runs-on: ubuntu-22.04
    env:
      ROS_DISTRO: humble
      MAKEFLAGS: -j2 -l2
      GTSAM_VERSION: 4.2.0
      GTSAM_CACHE_VERSION: v1
      GTSAM_INSTALL_PREFIX: ${{ github.workspace }}/.cache/gtsam-4.2.0
      CI_TEST_PACKAGES: >-
        rc26_bringup
        rc26_decision
        rc26_mcu_transport
        rc26_point_lio
        rc26_serial
        rc26_telecontrol
        rc26_vision

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-pytest \
            python3-yaml \
            cmake \
            libboost-all-dev \
            libeigen3-dev \
            libgoogle-glog-dev \
            libunwind-dev \
            libpcl-dev \
            libomp-dev \
            libopencv-dev \
            libyaml-cpp-dev

      - name: Restore GTSAM cache
        id: cache-gtsam
        uses: actions/cache@v4
        with:
          path: ${{ env.GTSAM_INSTALL_PREFIX }}
          key: gtsam-${{ runner.os }}-${{ runner.arch }}-${{ env.GTSAM_VERSION }}-${{ env.GTSAM_CACHE_VERSION }}

      - name: Install GTSAM from source
        if: steps.cache-gtsam.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GTSAM_VERSION" https://github.com/borglab/gtsam.git /tmp/gtsam
          cmake -S /tmp/gtsam -B /tmp/gtsam/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GTSAM_INSTALL_PREFIX" \
            -DGTSAM_BUILD_EXAMPLES_ALWAYS=OFF \
            -DGTSAM_BUILD_TESTS=OFF \
            -DGTSAM_BUILD_UNSTABLE=OFF \
            -DGTSAM_BUILD_WRAP=OFF \
            -DGTSAM_USE_SYSTEM_EIGEN=ON \
            -DGTSAM_WITH_TBB=OFF \
            -DGTSAM_BUILD_WITH_MARCH_NATIVE=OFF
          cmake --build /tmp/gtsam/build --parallel 2
          cmake --install /tmp/gtsam/build

      - name: Configure GTSAM environment
        run: |
          set -euo pipefail
          test -f "$GTSAM_INSTALL_PREFIX/lib/cmake/GTSAM/GTSAMConfig.cmake"
          echo "CMAKE_PREFIX_PATH=$GTSAM_INSTALL_PREFIX:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GTSAM_INSTALL_PREFIX/lib:$GTSAM_INSTALL_PREFIX/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Resolve ROS dependencies
        run: |
          set -euo pipefail
          sudo rosdep init || true
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro "$ROS_DISTRO" -y \
            --skip-keys "GTSAM opencv4 libpcl-all-dev onnxruntime aidlite"

      - name: Build workspace
        run: |
          set -euo pipefail
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          colcon build \
            --symlink-install \
            --executor sequential \
            --parallel-workers 1 \
            --event-handlers console_direct+

      - name: Run registered tests
        run: |
          set -euo pipefail
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          source install/setup.bash
          colcon test \
            --packages-select $CI_TEST_PACKAGES \
            --event-handlers console_direct+ \
            --return-code-on-test-failure
          colcon test-result --verbose

      - name: Upload colcon logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: log
