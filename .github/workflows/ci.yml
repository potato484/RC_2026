name: topo-sim-viewer-ci

on:
  push:
    paths:
      - '.github/workflows/ci.yml'
      - 'docs/test/**'
      - 'docs/frontend/**'
      - 'docs/backend/archive/rc26_topo_nav/README.md'
      - 'package.json'
      - 'src/rc26_topo_nav/sim_viewer/**'
      - 'src/rc26_topo_nav/scripts/topo_sim_server.py'
      - 'src/rc26_topo_nav/scripts/topo_sim_algorithms.py'
      - 'src/rc26_topo_nav/scripts/render_graph_sim_html.py'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'docs/test/**'
      - 'docs/frontend/**'
      - 'docs/backend/archive/rc26_topo_nav/README.md'
      - 'package.json'
      - 'src/rc26_topo_nav/sim_viewer/**'
      - 'src/rc26_topo_nav/scripts/topo_sim_server.py'
      - 'src/rc26_topo_nav/scripts/topo_sim_algorithms.py'
      - 'src/rc26_topo_nav/scripts/render_graph_sim_html.py'

jobs:
  preflight:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install sim_viewer dependencies
        run: npm --prefix src/rc26_topo_nav/sim_viewer ci

      - name: Install Python E2E dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn playwright

      - name: Run strict preflight
        run: npm run preflight:strict
