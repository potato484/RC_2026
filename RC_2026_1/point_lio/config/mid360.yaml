/**:
    ros__parameters:
        use_imu_as_input: False                             # 是否使用IMU作为Point-LIO的输入（True=使用）
        prop_at_freq_of_imu: True                           # 是否按IMU频率进行状态传播
        check_satu: True                                    # 是否检查IMU饱和
        init_map_size: 10                                   # 初始地图大小
        point_filter_num: 1                                 # 点云降采样比例：4/3/2/1（1=不降采样，保留所有点）
        space_down_sample: True                             # 是否启用空间降采样
        filter_size_surf: 0.1                               # 表面特征体素滤波尺寸(米)：0.5/0.3/0.2/0.15/0.1，越小越精细
        filter_size_map: 0.1                                # 地图体素滤波尺寸(米)：0.5/0.3/0.15/0.1，越小越精细
        ivox_nearby_type: 6                                 # iVox邻近搜索类型：0/6/18/26（数字越大搜索邻居越多）
        runtime_pos_log_enable: False                       # 是否启用运行时位置日志

        common:
            lid_topic: "/livox/lidar"                       # 激光雷达话题名（由Mid-360驱动决定）
            imu_topic: "/livox/imu"                         # IMU话题名（由Mid-360驱动决定）
            con_frame: False                                # 是否合并多帧激光雷达数据
            con_frame_num: 1                                # 合并的帧数
            cut_frame: False                                # 是否将单帧切分为多个子帧
            cut_frame_time_interval: 0.1                    # 切帧时间间隔，应为(1/激光雷达频率)的整数分之一
            time_diff_lidar_to_imu: 0.0                     # LiDAR与IMU的时间偏移（由标定算法如LI-Init获得）

        prior_pcd:
            enable: False                                   # 是否启用先验点云地图
            prior_pcd_map_path: ""                          # 先验点云地图路径
            init_pose: [ 0.0, 0.0, 0.0 ]                    # 初始位姿 [x, y, yaw]

        preprocess:
            lidar_type: 5                                   # 激光雷达类型：1-AVIA(已弃用) 2-Velodyne 3-Ouster 4-Hesai 5-MID360
            scan_line: 4                                    # 扫描线数（Mid-360固定为4线）
            timestamp_unit: 0                               # 点云时间戳单位：0-秒 1-毫秒 2-微秒 3-纳秒 (MID360驱动输出秒)
            blind: 0.5                                      # 盲区半径(米)，忽略此范围内的点

        mapping:
            imu_en: True                                    # 是否启用IMU
            extrinsic_est_en: False                         # 是否在线估计外参（剧烈运动时设为False）
            imu_time_inte: 0.005                            # IMU采样周期(秒) = 1/IMU频率，Mid-360的IMU为200Hz
            lidar_time_inte: 0.1                            # LiDAR采样周期(秒)，Mid-360为10Hz
            satu_acc: 3.0                                   # 加速度饱和阈值（超过此值视为异常）
            satu_gyro: 35.0                                 # 角速度饱和阈值（超过此值视为异常）
            acc_norm: 1.0                                   # 加速度单位：1.0表示以g为单位，9.81表示以m/s²为单位
            lidar_meas_cov: 0.01                            # LiDAR测量协方差（越小越信任LiDAR）
            acc_cov_output: 500.0                           # 加速度输出协方差
            gyr_cov_output: 1000.0                          # 角速度输出协方差
            b_acc_cov: 0.0001                               # 加速度偏置协方差
            b_gyr_cov: 0.0001                               # 角速度偏置协方差
            imu_meas_acc_cov: 0.01                          # IMU加速度测量协方差
            imu_meas_omg_cov: 0.01                          # IMU角速度测量协方差
            gyr_cov_input: 0.01                             # 角速度输入协方差（IMU作为输入模式时使用）
            acc_cov_input: 0.1                              # 加速度输入协方差（IMU作为输入模式时使用）
            plane_thr: 0.1                                  # 平面判定阈值，越小要求平面越平整
            match_s: 81.0                                   # 点云匹配搜索范围参数
            ivox_grid_resolution: 2.0                       # iVox网格分辨率(米)
            gravity: [ 0.0, 0.0, -9.810 ]                   # 重力向量(m/s²)，Z轴向下为负
            gravity_init: [ 0.0, 0.0, -9.810 ]              # 初始重力向量（IMU禁用或非静止启动时使用）
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]      # LiDAR到IMU的平移外参 [x, y, z](米)，由标定获得
            extrinsic_R: [ 1.0, 0.0, 0.0,                   # LiDAR到IMU的旋转外参(3x3矩阵)，由标定获得
                           0.0, 1.0, 0.0,                   # 当前为单位阵，表示两者坐标系对齐
                           0.0, 0.0, 1.0 ]

        frame:
            odom_frame: "odom"                              # 里程计坐标系名称
            body_frame: "base_link"                         # 机器人本体坐标系名称

        odometry:
            publish_odometry_without_downsample: False      # 是否发布未降采样的里程计

        publish:
            path_en: True                                   # 是否发布轨迹路径
            scan_publish_en: True                           # 是否发布点云
            scan_bodyframe_pub_en: False                    # 是否在IMU本体坐标系下发布点云
            tf_send_en: True                                # 是否发布TF变换

        pcd_save:
            pcd_save_en: False                              # 是否保存PCD点云文件
            interval: -1                                    # 每个PCD文件保存的帧数，-1表示全部保存到一个文件（帧数过多可能导致内存溢出）
