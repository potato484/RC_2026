# RC2026 融合里程计参数配置

# CAN里程计节点参数
can_odom_node:
  ros__parameters:
    can_interface: "can0"
    wheel_radius: 0.07625
    wheel_base: 0.62326
    track_width: 0.7
    gear_ratio: 19.2032  # 3591/187
    publish_rate_hz: 50
    odom_topic: "Can_Odom"
    odom_frame: "odom"
    base_frame: "base_link"

# 达妙IMU节点参数
dm_imu_node:
  ros__parameters:
    port: "/dev/ttyACM0"
    baudrate: 921600
    frame_id: "imu_link"
    verbose: false
    qos_reliable: true

# 速度发送节点参数 (独立模式)
pose_sender_node:
  ros__parameters:
    feedback_serial_port: "/dev/ttyUSB0"
    target_serial_port: "/dev/ttyUSB1"
    baudrate: 115200
    cmd_vel_topic: "cmd_vel"
    odom_topic: "merge_odom"
    send_rate_hz: 50

# 融合里程计主节点参数(整合模式)
merge_odom_node:
  ros__parameters:
    # 里程计源选择: "can_odom" 或 "wheel_odom"
    odom_source: "can_odom"
    # CAN参数
    can_interface: "can0"
    wheel_radius: 0.07625
    wheel_base: 0.62326
    track_width: 0.7
    gear_ratio: 19.2032
    can_publish_rate_hz: 50
    can_odom_topic: "Can_Odom"
    odom_frame: "odom"
    base_frame: "base_link"
    # 双串口参数 (MCU速度闭环)
    feedback_serial_port: "/dev/ttyUSB0"
    target_serial_port: "/dev/ttyUSB1"
    baudrate: 115200
    # 速度发送参数
    cmd_vel_topic: "cmd_vel"
    merge_odom_topic: "merge_odom"
    pose_send_rate_hz: 50
