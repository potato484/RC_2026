base_ground_estimator:
  ros__parameters:
    odom_topic: "odom"
    parent_frame: "odom"
    base_ground_frame: "base_ground"
    enable_tf_publish: true
    tf_timeout_sec: 0.05
    step_height_m: 0.20
    tol_level_m: 0.04
    tol_stable_z_std_m: 0.015
    tol_stable_lin_vel_mps: 0.05
    tol_stable_ang_vel_rps: 0.05
    T_confirm: 0.4
    window_size: 10
    h0_calibration_samples: 10
    h0_override_enable: false
    h0_override_m: 0.0
    lift_thresh_m: 0.15
    lift_time_s: 0.5
