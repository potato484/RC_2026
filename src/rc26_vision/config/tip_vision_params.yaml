tip_vision_test_node:
  ros__parameters:
    vision_config_file: "config/vision_models.yaml"
    model_id: "tip_default"

    camera_index: 2
    camera_device: ""
    auto_scan_camera: true
    width: 640
    height: 480
    fps: 30

    single_target_mode: false
    max_categories: 5          # 仅多类别模型生效；单类别模型下会忽略
    target_name: "JK"
    target_class_id: -1
    use_predicted_label: true

    # 距离估计/距离叠加已停用；保留旧参数名仅为了兼容旧配置
    show_center_distance: false

    show_window: true
    window_name: "Rhino X1 Vision - V2 Class Check"
    log_interval_sec: 2.0

    async_inference: true

    # 至少1个标签名，且必须能在 labels.txt 中找到
    target_labels: ["JK"]

    # 自动横移对线默认关闭；开启后会发布 cmd_vel.linear.y。
    alignment_control_enable: false
    alignment_cmd_vel_topic: "cmd_vel"
    alignment_tolerance_px: 20
    alignment_stable_frames: 3
    alignment_kp: 0.0015
    alignment_min_speed_mps: 0.04
    alignment_max_speed_mps: 0.15
    alignment_command_rate_hz: 20.0
    alignment_lost_stop_frames: 3
    alignment_publish_zero_on_disable: true
    alignment_invert_direction: false
    alignment_draw_guides: true

    # 对齐稳定后通过 /mechanism/send_command 下发 GRAB_TIP(0x01)，空 payload。
    alignment_grab_enable: true
    alignment_grab_command_id: 1
    alignment_grab_payload: []
    alignment_grab_once_per_target: true
    alignment_grab_cooldown_s: 2.0
    alignment_grab_service_name: "/mechanism/send_command"
    alignment_grab_service_timeout_ms: 200
