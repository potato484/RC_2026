tip_vision_test_node:
  ros__parameters:
    vision_config_file: "config/vision_models.yaml"
    model_id: "tip_test"

    camera_index: 2
    camera_device: ""
    auto_scan_camera: false
    width: 640
    height: 480
    fps: 30

    single_target_mode: false
    max_categories: 5          # 仅多类别模型生效；单类别模型下会忽略
    target_name: "JK"
    target_class_id: -1
    use_predicted_label: true

    # 距离估计/距离叠加已停用；保留旧参数名仅为了兼容旧配置
    show_center_distance: false

    show_window: true
    window_name: "Rhino X1 Vision - V2 Class Check"
    log_interval_sec: 2.0

    async_inference: true

    # 使用 rc26_serial 的 RC26 帧封装，业务 payload 为:
    # grab_ready | dir_code | amp_code | ts16_lo | ts16_hi
    serial_enable: false
    serial_device: "/dev/ttyUSB1"
    serial_baud: 115200
    serial_data_bits: 8      # rc26_serial 当前固定 8N1
    serial_stop_bits: 1
    serial_parity: "none"

    # 至少1个标签名，且必须能在 labels.txt 中找到
    target_labels: ["JK"]

    grab_min_width_ratio: 0.06
    ok_stable_frames: 3
    center_ratio: 0.08
    small_ratio: 0.20
    medium_ratio: 0.35
