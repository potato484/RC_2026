<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>事件日志</title>
<style>
body { font-family: "Noto Sans SC", sans-serif; margin: 0; padding: 10px; background: #1e1e1e; color: #ddd; }
h2 { margin: 0 0 10px 0; font-size: 14px; color: #4db6ac; }
.toolbar { display: flex; gap: 6px; margin-bottom: 8px; }
input, select { background: #2a2a2a; color: #ddd; border: 1px solid #444; padding: 4px 6px; font-size: 12px; }
input { flex: 1; }
#log { height: calc(100vh - 110px); overflow-y: auto; border: 1px solid #444; padding: 8px; font-size: 12px; box-sizing: border-box; }
.row { padding: 3px 6px; border-left: 3px solid #4db6ac; margin: 2px 0; background: #2a2a2a; }
.row.WARN { border-left-color: #ffb74d; }
.row.ERROR { border-left-color: #ef5350; }
.row .time { color: #888; margin-right: 8px; }
.row .src { color: #4db6ac; font-weight: bold; margin-right: 8px; }
.row .lvl { margin-right: 8px; font-weight: bold; }
.empty { text-align: center; color: #666; padding: 40px; }
</style>
</head>
<body>
<h2>诊断事件日志</h2>
<div class="toolbar">
  <input type="text" id="filter" placeholder="关键字过滤...">
  <select id="level">
    <option value="">全部级别</option>
    <option value="INFO">INFO</option>
    <option value="WARN">WARN</option>
    <option value="ERROR">ERROR</option>
  </select>
</div>
<div id="log"><div class="empty">等待数据...</div></div>
<script>
var events = [];
function render() {
  var f = document.getElementById("filter").value.toLowerCase();
  var lv = document.getElementById("level").value;
  var filtered = events.filter(function(e) {
    if (lv && e.level !== lv) return false;
    if (f && (e.source + " " + e.message).toLowerCase().indexOf(f) < 0) return false;
    return true;
  });
  var el = document.getElementById("log");
  if (!filtered.length) { el.innerHTML = '<div class="empty">无匹配结果</div>'; return; }
  el.innerHTML = filtered.map(function(e) {
    return '<div class="row ' + e.level + '"><span class="time">' + e.time + '</span><span class="src">' + e.source + '</span><span class="lvl">' + e.level + '</span>' + e.message + '</div>';
  }).join('');
}
document.getElementById("filter").addEventListener("input", render);
document.getElementById("level").addEventListener("change", render);
if (typeof qt !== 'undefined' && qt.webChannelTransport) {
  new QWebChannel(qt.webChannelTransport, function(channel) {
    var bridge = channel.objects.bridge;
    bridge.dataChanged.connect(function() {
      try { events = JSON.parse(bridge.lastData); render(); } catch (e) {}
    });
  });
}
</script>
</body>
</html>
