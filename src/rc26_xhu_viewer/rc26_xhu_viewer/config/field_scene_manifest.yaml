meta:
  schema_version: "1.0"
  viewer_title: "RC26 全局比赛场地闭环可视化平台"
  viewer_subtitle: "统一消费 live 运行态、离线路径回放、行为树阶段和机构状态，不再依赖外部 Foxglove。"

display_catalog:
  - id: scene
    label: "场地"
    short_label: "场"
    group: "primary"
    tone: "scene"
  - id: route
    label: "路线"
    short_label: "线"
    group: "primary"
    tone: "path"
  - id: corridor
    label: "走廊"
    short_label: "廊"
    group: "primary"
    tone: "path"
  - id: lookahead
    label: "预瞄"
    short_label: "瞄"
    group: "primary"
    tone: "path"
  - id: robotPose
    label: "机器人"
    short_label: "机"
    group: "primary"
    tone: "state"
  - id: phaseZones
    label: "阶段区"
    short_label: "区"
    group: "primary"
    tone: "risk"
  - id: blocked
    label: "Keepout"
    short_label: "禁"
    group: "primary"
    tone: "risk"
  - id: openSet
    label: "前沿"
    short_label: "前"
    group: "advanced"
    tone: "search"
  - id: expanded
    label: "已探查"
    short_label: "展"
    group: "advanced"
    tone: "search"
  - id: graph
    label: "图结构"
    short_label: "图"
    group: "advanced"
    tone: "search"
  - id: keyNodes
    label: "关键点"
    short_label: "点"
    group: "advanced"
    tone: "path"
  - id: tree
    label: "搜索树"
    short_label: "树"
    group: "advanced"
    tone: "search"
  - id: candidates
    label: "候选轨迹"
    short_label: "轨"
    group: "advanced"
    tone: "search"
  - id: shadows
    label: "阴影"
    short_label: "影"
    group: "advanced"
    tone: "appearance"

layout_presets:
  - id: operator
    label: "操作员"
    description: "优先看场地、机器人、路线、当前阶段和关键风险。"
    visible_displays:
      - scene
      - route
      - corridor
      - lookahead
      - robotPose
      - phaseZones
      - blocked
      - shadows
  - id: engineering
    label: "工程"
    description: "打开 graph、搜索回放和更多调试图层。"
    visible_displays:
      - scene
      - route
      - corridor
      - lookahead
      - robotPose
      - phaseZones
      - blocked
      - openSet
      - expanded
      - graph
      - keyNodes
      - tree
      - candidates
      - shadows
  - id: diagnostic
    label: "诊断"
    description: "保留场地主视图，但更关注诊断、定位和机构状态。"
    visible_displays:
      - scene
      - route
      - robotPose
      - phaseZones
      - blocked
      - shadows

semantic_zones:
  - id: combat_zone
    label: "对抗区"
    phase_key: "CombatAreaTree"
    color: "#e76f51"
    viewer_only: true
    source: "viewer semantic phase bands (world frame)"
    polygon:
      - {x: -3.90, y: 2.60, z: 0.03, yaw: 0.0}
      - {x: 3.90, y: 2.60, z: 0.03, yaw: 0.0}
      - {x: 3.90, y: 4.80, z: 0.03, yaw: 0.0}
      - {x: -3.90, y: 4.80, z: 0.03, yaw: 0.0}
  - id: mf_zone
    label: "梅林区"
    phase_key: "MFAreaTree"
    color: "#2a9d8f"
    viewer_only: true
    source: "viewer semantic phase bands (world frame)"
    polygon:
      - {x: -4.30, y: -3.60, z: 0.03, yaw: 0.0}
      - {x: 4.30, y: -3.60, z: 0.03, yaw: 0.0}
      - {x: 4.30, y: 2.60, z: 0.03, yaw: 0.0}
      - {x: -4.30, y: 2.60, z: 0.03, yaw: 0.0}
  - id: mc_zone
    label: "武馆区"
    phase_key: "MCAreaTree"
    color: "#457b9d"
    viewer_only: true
    source: "viewer semantic phase bands (world frame)"
    polygon:
      - {x: -4.95, y: -6.00, z: 0.03, yaw: 0.0}
      - {x: 4.95, y: -6.00, z: 0.03, yaw: 0.0}
      - {x: 4.95, y: -3.60, z: 0.03, yaw: 0.0}
      - {x: -4.95, y: -3.60, z: 0.03, yaw: 0.0}
