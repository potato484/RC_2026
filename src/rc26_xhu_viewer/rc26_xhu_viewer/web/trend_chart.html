<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>趋势图</title>
<style>
body { font-family: "Noto Sans SC", sans-serif; margin: 0; padding: 10px; background: #1e1e1e; color: #ddd; }
h2 { margin: 0 0 10px 0; font-size: 14px; color: #4db6ac; }
#canvas { width: 100%; height: calc(100vh - 80px); border: 1px solid #444; background: #2a2a2a; box-sizing: border-box; }
#meta { font-size: 11px; color: #888; margin-top: 4px; }
</style>
</head>
<body>
<h2 id="title">趋势图</h2>
<canvas id="canvas"></canvas>
<div id="meta">等待数据...</div>
<script>
var points = [];
var name = "";
function draw() {
  var c = document.getElementById("canvas");
  var ctx = c.getContext("2d");
  c.width = c.clientWidth; c.height = c.clientHeight;
  ctx.clearRect(0, 0, c.width, c.height);
  if (!points.length) return;
  var xs = points.map(function(p) { return p.t; });
  var ys = points.map(function(p) { return p.v; });
  var tmin = Math.min.apply(null, xs), tmax = Math.max.apply(null, xs);
  var vmin = Math.min.apply(null, ys), vmax = Math.max.apply(null, ys);
  var dv = (vmax - vmin) || 1, dt = (tmax - tmin) || 1;
  ctx.strokeStyle = "#4db6ac"; ctx.lineWidth = 1.5; ctx.beginPath();
  points.forEach(function(p, i) {
    var x = ((p.t - tmin) / dt) * (c.width - 40) + 30;
    var y = c.height - 20 - ((p.v - vmin) / dv) * (c.height - 40);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = "#888"; ctx.font = "10px sans-serif";
  ctx.fillText(vmin.toFixed(2), 4, c.height - 20);
  ctx.fillText(vmax.toFixed(2), 4, 12);
  document.getElementById("meta").innerText = name + " | " + points.length + " 点 | " + vmin.toFixed(2) + " ~ " + vmax.toFixed(2);
}
window.addEventListener("resize", draw);
if (typeof qt !== 'undefined' && qt.webChannelTransport) {
  new QWebChannel(qt.webChannelTransport, function(channel) {
    var bridge = channel.objects.bridge;
    bridge.dataChanged.connect(function() {
      try {
        var obj = JSON.parse(bridge.lastData);
        name = obj.name || "";
        points = obj.points || [];
        document.getElementById("title").innerText = "趋势图: " + name;
        draw();
      } catch (e) {}
    });
  });
}
</script>
</body>
</html>
