descriptions:
  "Displays data from a nav_msgs::Path message as lines. <a href=\"http://www.ros.org/wiki/rviz/DisplayTypes/Path\">More Information</a>.": "显示 nav_msgs::Path 路径消息，可按线段方式查看轨迹。"
  "Displays a visual representation of a robot in the correct pose (as defined by the current TF transforms).  <a href=\"http://www.ros.org/wiki/rviz/DisplayTypes/RobotModel\">More Information</a>.": "根据当前坐标变换显示机器人视觉模型。"
  "Displays the TF transform hierarchy.  <a href=\"http://www.ros.org/wiki/rviz/DisplayTypes/TF\">More Information</a>.": "显示整棵坐标变换关系树。"
  "Displays an occupancy grid on the ground plane from a nav_msgs::OccupancyGrid.  <a href=\"http://www.ros.org/wiki/rviz/DisplayTypes/Map\">More Information</a>.": "将占据栅格地图显示在地面平面上。"
  "The Point Cloud2 display shows data from a (recommended) sensor_msgs/PointCloud2 message.": "显示 PointCloud2 点云消息。"

