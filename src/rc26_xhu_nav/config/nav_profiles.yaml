profiles:
  plane_move:
    # 参数说明：fallback_profile - 运行 profile 或模式；用于在不同任务、风险等级或后端之间切换参数组。
    fallback_profile: hold
    watchdog:
      # 参数说明：timeout_sec - 超时时间；超过该值后会触发降级、停止或失败处理。
      timeout_sec: 0
      # 参数说明：stop_required_on_timeout - 超时时间；超过该值后会触发降级、停止或失败处理。
      stop_required_on_timeout: false
    precheck:
      # 参数说明：require_stopped - 布尔开关；控制对应能力是否启用。
      require_stopped: false
    controller:
      # 参数说明：v_linear_max - 运动速度相关参数；需要结合底盘能力和安全约束调节。
      v_linear_max: 0.8
      # 参数说明：v_angular_max - 运动速度相关参数；需要结合底盘能力和安全约束调节。
      v_angular_max: 1.0
      # 参数说明：acc_linear - 运动速度相关参数；需要结合底盘能力和安全约束调节。
      acc_linear: 0.6
      # 参数说明：acc_angular - 运动速度相关参数；需要结合底盘能力和安全约束调节。
      acc_angular: 0.8

  mf_traverse:
    # 参数说明：fallback_profile - 运行 profile 或模式；用于在不同任务、风险等级或后端之间切换参数组。
