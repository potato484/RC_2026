topo_nav_node:
  ros__parameters:
    # 参数说明：team - 当前阵营；通常使用 blue 或 red 选择对应图和任务口径。
    team: "blue"
    # 参数说明：graph_file - 文件或目录路径；相对路径通常按包 share 目录或启动目录解析。
    graph_file: ""
    # 参数说明：surface_graph_file - 文件或目录路径；相对路径通常按包 share 目录或启动目录解析。
    surface_graph_file: ""
    # 参数说明：robot_geometry_file - 文件或目录路径；相对路径通常按包 share 目录或启动目录解析。
    robot_geometry_file: ""
    # 参数说明：robot_geometry_profile - 机器人几何 profile 名；用于从几何配置中选择车体包络。
    robot_geometry_profile: "compact"
    # 参数说明：surface_start_match_xy_m - 几何距离参数，单位通常为米。
    surface_start_match_xy_m: 0.30
    # 参数说明：surface_start_match_z_m - 几何距离参数，单位通常为米。
    surface_start_match_z_m: 0.10
    # 参数说明：surface_start_match_yaw_deg - 角度参数；单位由字段名或上级配置约定。
    surface_start_match_yaw_deg: 25.0
    # 参数说明：surface_anchor_radius_m - 几何距离参数，单位通常为米。
    surface_anchor_radius_m: 0.30
    surface_planner_backend: "body_planner"
    body_planning:
      # 参数说明：enabled - 布尔开关；控制对应能力是否启用。
      enabled: true
      # 参数说明：require_annotated_surface_graph - 布尔开关；控制对应能力是否启用。
      require_annotated_surface_graph: true
      # 参数说明：clearance_margin_m - 安全余量；用于在几何或制动判断中预留缓冲。
      clearance_margin_m: 0.02
      # 参数说明：max_surface_pitch_deg - 角度参数；单位由字段名或上级配置约定。
      max_surface_pitch_deg: 35.0
      # 参数说明：max_edge_slope_deg - 角度参数；单位由字段名或上级配置约定。
      max_edge_slope_deg: 35.0
      # 参数说明：max_step_height_m - 几何距离参数，单位通常为米。
      max_step_height_m: 0.18
    surface_body_planner:
      heading_bin_count: 16
      # 参数说明：max_heading_change_deg - 角度参数；单位由字段名或上级配置约定。
      max_heading_change_deg: 85.0
      turn_cost_weight: 0.75
      # 参数说明：node_turn_clearance_gain - 控制增益；调大通常会增强响应但也可能放大振荡。
      node_turn_clearance_gain: 1.0
      # 参数说明：edge_turn_clearance_gain - 控制增益；调大通常会增强响应但也可能放大振荡。
      edge_turn_clearance_gain: 0.75
    xhu:
      # 参数说明：exec_timeout_sec - 超时时间；超过该值后会触发降级、停止或失败处理。
      exec_timeout_sec: 45.0
      # 参数说明：hold_replan_timeout_sec - 超时时间；超过该值后会触发降级、停止或失败处理。
      hold_replan_timeout_sec: 2.0
    # 分组说明：weights - 模型或推理引擎配置；用于视觉或算法后端加载。
    weights:
      time: 1.0
      # 参数说明：height_risk - 几何距离参数，单位通常为米。
      height_risk: 2.0
      drop_risk: 3.0
      localization_risk: 2.0
      dynamic_block: 1000.0
      confirm_required: 1.5
      slow_only: 2.0
