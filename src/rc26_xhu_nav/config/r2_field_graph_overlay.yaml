        yaw: 1.5708

# 分组说明：tasks - 任务语义列表；描述导航图中可被决策引用的动作或阶段。
tasks:
  - task_tag: "mf_grab"
    candidate_nodes:
      - "mf_b1"
      - "mf_b2"
      - "mf_b3"
      - "mf_b4"
      - "mf_b5"
      - "mf_b6"
      - "mf_b7"
      - "mf_b8"
      - "mf_b9"
      - "mf_b10"
      - "mf_b11"
      - "mf_b12"
    selection_policy: "min_total_cost"

  - task_tag: "mf_exit"
    candidate_nodes:
      - "mf_exit_staging"
    selection_policy: "min_total_cost"

  - task_tag: "mf_entry"
    candidate_nodes:
      - "mf_entry_staging"
    selection_policy: "min_total_cost"

# 分组说明：routes - 预定义路线列表；供任务或测试按名称复用一组路径。
routes:
  - route_tag: "mf_entry_default"
    # 分组说明：nodes - 节点列表；每个条目描述一个导航点、采样点或任务点。
    nodes:
      - "ramp_entry_south"
      - "mf_entry_staging"
      - "mf_b2"

  - route_tag: "mf_exit_default"
    # 分组说明：nodes - 节点列表；每个条目描述一个导航点、采样点或任务点。
    nodes:
      - "mf_exit_staging"
      - "ramp_exit_north"
