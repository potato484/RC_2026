# 分组说明：meta - 元信息分组；记录配置版本、来源、坐标系或生成方式。
meta:
  # 参数说明：schema_version - 配置 schema 版本；用于判断字段结构是否兼容当前加载器。
  schema_version: "1.0"
  # 参数说明：coordinate_frame - 坐标系名称；本文件中的位姿或几何数据默认按该 frame 解释。
  coordinate_frame: "map"

mf_block_node:
  # 参数说明：type - 条目类型；加载器会按类型决定解释方式或运行时语义。
  type: "mf_edge_pose"
  # 参数说明：level - 场地层级；用于区分不同高度或通行层。
  level: 1
  # 参数说明：phase_mask - 阶段掩码；用于限制节点或边在特定比赛阶段可用。
  phase_mask: 255
  # 参数说明：operation_tag - 操作标签；标记到达该点后可能执行的抓取、放置或等待动作。
  operation_tag: "grab"
  yaw: 1.5708
  # 参数说明：z_from_expected_height_scale - 几何距离参数，单位通常为米。
  z_from_expected_height_scale: 0.5
  base_cost_default: 1.0

node_overrides:
  # 列表项说明：id - 唯一标识；供其他配置、代码或路线引用该条目。
  - id: "mf_b2"
    # 参数说明：base_cost - 基础代价；规划器会在路径搜索时纳入该成本。
    base_cost: 0.5

  # 列表项说明：id - 唯一标识；供其他配置、代码或路线引用该条目。
  - id: "mf_b6"
    # 参数说明：base_cost - 基础代价；规划器会在路径搜索时纳入该成本。
    base_cost: 1.5

  # 列表项说明：id - 唯一标识；供其他配置、代码或路线引用该条目。
  - id: "mf_b8"
    # 参数说明：base_cost - 基础代价；规划器会在路径搜索时纳入该成本。
    base_cost: 1.5

mf_grid_edge:
  motion_type: "plane_move"
  # 参数说明：required_mode - 运行 profile 或模式；用于在不同任务、风险等级或后端之间切换参数组。
  required_mode: "mf_traverse"
  requires_confirmation: false
  can_block: true
  # 参数说明：phase_mask - 阶段掩码；用于限制节点或边在特定比赛阶段可用。
  phase_mask: 255
  # 参数说明：base_cost - 基础代价；规划器会在路径搜索时纳入该成本。
  base_cost: 1.0

nodes_prepend:
  # 列表项说明：id - 唯一标识；供其他配置、代码或路线引用该条目。
  - id: "mf_entry_staging"
    # 参数说明：type - 条目类型；加载器会按类型决定解释方式或运行时语义。
    type: "staging"
    # 参数说明：pose - 位姿分组；通常包含 x/y/z/yaw，并使用配置声明的坐标系。
