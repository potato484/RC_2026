# 分组说明：meta - 元信息分组；记录配置版本、来源、坐标系或生成方式。
meta:
  # 参数说明：team - 当前阵营；通常使用 blue 或 red 选择对应图和任务口径。
  team: "shared"
  layout_version: "r2_mf_world_v1"
  mirror_rule: "explicit_team_layout"
  validated: true
  # 参数说明：grid_spacing_m - 栅格或采样间距，单位米；影响生成图的节点密度。
  grid_spacing_m: 1.2
  # 参数说明：block_half_extent_m - 几何距离参数，单位通常为米。
  block_half_extent_m: 0.6
  # 参数说明：shared_edge_band_width_m - 几何距离参数，单位通常为米。
  shared_edge_band_width_m: 0.08
  safe_offset: 0.20
  # 参数说明：jump_margin - 安全余量；用于在几何或制动判断中预留缓冲。
  jump_margin: 0.20

