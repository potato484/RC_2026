# RC2026 robot_localization EKF参数配置
# 融合轮式里程计(wheel_odom)和达妙IMU(DM_IMU)，输出merge_odom

ekf_filter_node:
  ros__parameters:
    # 参数说明：frequency - 运行频率，单位 Hz；影响发布、控制或检测循环速度。
    frequency: 50.0
    # 参数说明：sensor_timeout - 超时时间；超过该值后会触发降级、停止或失败处理。
    sensor_timeout: 0.1
    # 参数说明：two_d_mode - 运行 profile 或模式；用于在不同任务、风险等级或后端之间切换参数组。
    two_d_mode: true
    transform_time_offset: 0.0
    # 参数说明：transform_timeout - 超时时间；超过该值后会触发降级、停止或失败处理。
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    # 只输出 /merge_odom Odometry，不发布 odom -> base_link TF，避免抢自动导航主链动态 TF 权威。
    publish_tf: false

    # 参数说明：map_frame - 坐标系 frame 名；需要与 TF 树和消息 header 保持一致。
    map_frame: map
    # 参数说明：odom_frame - 坐标系 frame 名；需要与 TF 树和消息 header 保持一致。
    odom_frame: odom
    # 参数说明：base_link_frame - 坐标系 frame 名；需要与 TF 树和消息 header 保持一致。
    base_link_frame: base_link
    # 参数说明：world_frame - 坐标系 frame 名；需要与 TF 树和消息 header 保持一致。
    world_frame: odom

    # 轮式里程计输入 (wheel_odom - 串口模式)
    odom0: wheel_odom
    odom0_config: [false, false, false,    # x, y, z
                   false, false, false,    # roll, pitch, yaw
                   true,  true,  false,    # vx, vy, vz
                   false, false, true,     # vroll, vpitch, vyaw
                   false, false, false]    # ax, ay, az
    # 参数说明：odom0_queue_size - wheel odom 输入队列长度；影响消息缓存和实时性。
    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false
    # 参数说明：odom0_pose_rejection_threshold - 阈值；用于判断状态切换、风险等级或过滤条件。
    odom0_pose_rejection_threshold: 5.0
    # 参数说明：odom0_twist_rejection_threshold - 阈值；用于判断状态切换、风险等级或过滤条件。
    odom0_twist_rejection_threshold: 2.0

    # IMU输入 (DM_IMU)
    imu0: DM_IMU
    imu0_config: [false, false, false,    # x, y, z
                  true,  true,  true,     # roll, pitch, yaw (使用IMU姿态)
                  false, false, false,    # vx, vy, vz
                  false, false, true,     # vroll, vpitch, vyaw
                  false, false, false]    # ax, ay, az
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: false
    # 参数说明：imu0_queue_size - IMU 输入队列长度；影响消息缓存和实时性。
    imu0_queue_size: 10
    # 参数说明：imu0_pose_rejection_threshold - 阈值；用于判断状态切换、风险等级或过滤条件。
    imu0_pose_rejection_threshold: 1.5
    # 参数说明：imu0_twist_rejection_threshold - 阈值；用于判断状态切换、风险等级或过滤条件。
    imu0_twist_rejection_threshold: 2.0
    # 参数说明：imu0_linear_acceleration_rejection_threshold - 阈值；用于判断状态切换、风险等级或过滤条件。
    imu0_linear_acceleration_rejection_threshold: 0.8
    # 参数说明：imu0_remove_gravitational_acceleration - 加速度限制；用于约束速度变化率并保护底盘。
    imu0_remove_gravitational_acceleration: true

    # 参数说明：use_control - 布尔开关；控制对应能力是否启用。
    use_control: false

