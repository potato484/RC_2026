    # 参数说明：target_serial_port - 硬件端口或串口标识；实机部署时需要匹配设备映射。
    target_serial_port: "/dev/ttyUSB1"
    # 参数说明：baudrate - 串口波特率；需要与下位机或传感器通信参数一致。
    baudrate: 1000000
    # 速度发送参数
    cmd_vel_topic: "cmd_vel"
    # 参数说明：merge_odom_topic - ROS2 话题名；必须与发布者或订阅者保持一致。
    merge_odom_topic: "merge_odom"
    # 参数说明：feedback_send_rate_hz - 运行频率，单位 Hz；影响发布、控制或检测循环速度。
    feedback_send_rate_hz: 50
    # 参数说明：target_send_rate_hz - 运行频率，单位 Hz；影响发布、控制或检测循环速度。
