mid360_driver:
    ros__parameters:
        lidar_topic: /livox/lidar
        lidar_frame: livox_frame
        imu_topic: /livox/imu
        imu_frame: livox_frame
        lidar_publish_time_interval: 0.1 # 当设备固件不更新 frame_cnt 时，按该时间窗口兜底分帧（默认 10Hz）
        host_ip: 192.168.1.50
        is_topic_name_with_lidar_ip: false # 是否在话题名后面加雷达ip，可以用于区分多个雷达
