# R2 机器人几何配置真源。
# 运行时通过 robot_geometry_file + robot_geometry_profile 引用这份配置。
robot_geometry:
  defaults:
    # 调用方未显式指定 robot_geometry_profile 时使用的默认 profile。
    active_profile: "compact"
  profiles:
    compact:
      body:
        # 车体前进方向的半长，单位米。
        half_length_m: 0.36
        # 车体横向的半宽，单位米。
        half_width_m: 0.22
        # 车体名义高度，单位米。当前消费方主要使用 XY 轮廓。
        height_m: 0.42
      safety:
        # 运行时停车安全包络的横向半宽，单位米。
        # 应保持大于等于 body.half_width_m，避免安全包络小于实体车宽。
        stop_envelope_half_width_m: 0.24
      planning:
        # 位姿投影到 surface graph 时使用的最小锚定半径，单位米。
        surface_projection_radius_m: 0.35
