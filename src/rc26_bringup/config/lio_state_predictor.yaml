lio_state_predictor:
  ros__parameters:
    # 参数说明：odometry_topic - ROS2 话题名；必须与发布者或订阅者保持一致。
    odometry_topic: "odom"
    # 参数说明：imu_topic - ROS2 话题名；必须与发布者或订阅者保持一致。
    imu_topic: "livox/imu"
    # 参数说明：degenerate_score_topic - ROS2 话题名；必须与发布者或订阅者保持一致。
    degenerate_score_topic: "degenerate_score"

    # 参数说明：control_state_topic - ROS2 话题名；必须与发布者或订阅者保持一致。
    control_state_topic: "control_state"
    # 参数说明：control_degenerate_score_topic - ROS2 话题名；必须与发布者或订阅者保持一致。
    control_degenerate_score_topic: "control_degenerate_score"
    # 参数说明：control_degraded_topic - ROS2 话题名；必须与发布者或订阅者保持一致。
    control_degraded_topic: "control_degraded"
    # 参数说明：publish_control_tf - 布尔开关；控制对应能力是否启用。
    publish_control_tf: true
    # 参数说明：control_tf_child_frame - 坐标系 frame 名；需要与 TF 树和消息 header 保持一致。
    control_tf_child_frame: "base_link_control"

    # 参数说明：publish_rate_hz - 运行频率，单位 Hz；影响发布、控制或检测循环速度。
    publish_rate_hz: 200.0
    # 参数说明：fixed_predict_ahead_sec - 时间参数，单位秒。
    fixed_predict_ahead_sec: 0.0
    pos_cov_increase_m2_per_s: 0.02
    # 参数说明：yaw_cov_increase_rad2_per_s - 角度参数；单位由字段名或上级配置约定。
    yaw_cov_increase_rad2_per_s: 0.01
    # 参数说明：degeneracy_ratio_threshold - 阈值；用于判断状态切换、风险等级或过滤条件。
    degeneracy_ratio_threshold: 0.02
    # 参数说明：imu_timeout_sec - 超时时间；超过该值后会触发降级、停止或失败处理。
    imu_timeout_sec: 0.15
    # 参数说明：degenerate_score_timeout_sec - 超时时间；超过该值后会触发降级、停止或失败处理。
    degenerate_score_timeout_sec: 0.2
    # 参数说明：max_prediction_horizon_sec - 时间参数，单位秒。
    max_prediction_horizon_sec: 0.35
    # 参数说明：startup_no_prediction_sec - 时间参数，单位秒。
    startup_no_prediction_sec: 1.0
    debug_pose_log: false  # 默认关闭高频预测/对比调试日志，避免持续刷屏
    # 参数说明：debug_pose_log_interval_sec - 周期或间隔；用于控制轮询、播放或发布节奏。
    debug_pose_log_interval_sec: 0.5
