# synthetic 验收 overlay（仅用于最小地图/最小点云链路验收）
# 不用于比赛默认参数
localization:
  ros__parameters:
    enable_graph_backend: true
    sc_max_radius: 15.0
    sc_submap_radius: 8.0
    sc_grid_resolution: 0.75
    sc_topk: 8
    sc_sim_threshold: 0.15
    sc_min_points_per_submap: 20
    min_points_for_relocalization: 20
