# R2 统一运行配置。
# 本文件是完整 bringup 的运行配置真源：点云、行为树入口与决策参数集中维护。
# paths 下的两个路径必须使用绝对路径；如需现场切换点云/行为树，优先修改这里。
r2_runtime:
  paths:
    prior_pcd_file: "/home/aidlux/RC_2026/src/rc26_point_lio/PCD/class_plus.pcd"
    behavior_tree_file: "/home/aidlux/RC_2026/src/rc26_decision/behavior_trees/mc_mf_preselection_tree.xml"

  # 目标 MCU 共享串口 transport。
  # 只要运行链会下发机构动作指令，就必须启动 rc26_mcu_transport。
  # 本服务提供 /mechanism/send_command、/mechanism/command_feedback，并默认消费 /cmd_vel 下发 POSE_TARGET。
  mcu_transport:
    enabled: true
    ros__parameters:
      target_serial_port: "/dev/ttyUSB0"
      target_baudrate: 1000000
      open_retry_period_ms: 1000
      diagnostics_period_ms: 1000
      enable_chassis_cmd_vel_consumer: true
      chassis_cmd_vel_topic: "cmd_vel"
      chassis_target_send_rate_hz: 50
      chassis_cmd_vel_timeout_ms: 200
      chassis_v_max_mps: 2.0
      chassis_w_max_radps: 2.0
      chassis_stop_repeat_n: 10

  decision:
    ros__parameters:
      tick_rate_ms: 100             # 行为树 tick 周期，单位毫秒；数值越小调度越频繁
      team: "blue"                  # 红蓝方场地镜像选择：blue 使用红方基准值，并由 rc26_decision 自动镜像 Y/yaw
      # ======================================================================
      # 可选的完整导航链启动 odom gate —— 默认关闭；开启时在决策树 tick 前等待 /odom 新鲜且低速稳定
      # ======================================================================
      startup_wait_for_odom: false  # start_r2_auto 默认不等待全局 odom gate；各 OdomDrive 动作仍自行等待新鲜 odom
      startup_odom_topic: "odom"     # 完整导航链启动前等待的 odom 话题
      startup_odom_timeout_s: 0.5    # 启动 gate 接受的 odom 最大年龄，单位秒
      startup_odom_wait_timeout_s: 18000.0 # 等待 /odom 稳定的最长时间，单位秒
      startup_odom_min_wait_s: 1.0   # 收到 /odom 后至少等待多久才允许启动行为树，单位秒
      startup_odom_stable_samples: 5 # 连续多少帧低速 /odom 才认为稳定
      startup_odom_max_linear_speed_mps: 0.20 # 启动稳定判定允许的最大线速度
      startup_odom_max_angular_speed_radps: 0.20 # 启动稳定判定允许的最大角速度

      # ======================================================================
      # 通用 odom 相对闭环导航参数 —— OdomDriveX/OdomDriveY/OdomTurnToYaw/OdomDriveXTurnX 直接发布 /cmd_vel
      # ======================================================================
      odom_relative_nav_cmd_vel_topic: "cmd_vel"      # OdomDriveX/OdomDriveY/OdomTurnToYaw/OdomDriveXTurnX 发布的速度话题
      odom_relative_nav_odom_topic: "odom"            # OdomDriveX/OdomDriveY/OdomTurnToYaw/OdomDriveXTurnX 使用的 odom 话题
      odom_relative_nav_max_speed_mps: 0.60           # 平移速度上限，单位 m/s
      odom_relative_nav_min_speed_mps: 0.03           # 未进入位置容差时的最小平移速度，单位 m/s
      odom_relative_nav_xy_kp: 0.8                    # odom x/y 误差到车体系平移速度的比例系数
      odom_relative_nav_heading_kp: 1.2               # 平移段保持启动 yaw 的 P 增益
      odom_relative_nav_heading_max_speed_radps: 0.70  # 平移段 heading hold 最大角速度，单位 rad/s
      odom_relative_nav_xy_tolerance_m: 0.03          # 平移目标距离容差，单位米
      odom_relative_nav_yaw_tolerance_deg: 3.0        # 平移段 yaw 保持成功容差，单位度
      odom_relative_nav_stable_ticks: 3               # 平移和 yaw 同时进入容差后连续多少 tick 判定完成
      odom_relative_nav_odom_timeout_s: 0.5           # odom 超过该时间未更新时停车等待
      odom_relative_nav_timeout_s: 10.0               # 独立相对分段默认超时，单位秒

      # ======================================================================
      # 第二个预选赛参数 —— second managed 入口和 second_preselection_tree.xml 共用
      # ======================================================================
      second_preselect_send_command_service: "/mechanism/send_command" # rc26_mcu_transport 可靠命令服务
      second_preselect_feedback_topic: "/mechanism/command_feedback"   # MCU 上行业务反馈 topic
      second_preselect_command_timeout_s: 5.0       # 等待 0x11/0x12/0x13 service ACK 的最长时间
      second_preselect_done_timeout_s: 1800.0       # 等待 0x0D/0x11 同 seq 完成反馈的最长时间
      second_preselect_log_period_s: 1.0            # 机构等待日志节流周期
      second_preselect_start_command_id: 17         # 0x11 SECOND_PRESELECTION_START
      second_preselect_start_done_feedback_id: 13   # 0x0D SECOND_PRESELECTION_START_DONE
      second_preselect_pickup_command_id: 18        # 0x12 第二预选赛 KFS 夹取触发，ACK 后等待 0x11 再做视觉消失验证
      second_preselect_pickup_done_feedback_id: 17  # 0x11 SECOND_PRESELECTION_PICKUP_KFS_DONE，必须与 0x12 的 ACK seq 匹配
      second_preselect_pre_approach_lower_command_id: 20 # 0x14 视觉对齐后机械臂彻底放下
      second_preselect_pre_approach_lower_done_feedback_id: 18 # 0x12 机械臂放下完成反馈，必须与 0x14 的 ACK seq 匹配
      second_preselect_pre_approach_lower_settle_s: 0.5 # 收到 0x12 后继续停车等待，确认机械臂彻底放下再前进
      second_preselect_place_kfs_command_id: 19     # 下行 0x13 SECOND_PRESELECTION_PLACE_KFS，ACK 即发送完成；与上行人工触发外部限位 3 的 0x13 分属不同方向
      second_preselect_post_place_retreat_x_m: -1.5 # 放置 KFS 后沿车体系 X 后退距离
      second_preselect_post_place_front_pushrod_extend_command_id: 8 # 0x08 前置推杆伸出
      second_preselect_post_place_front_pushrod_extend_settle_s: 15.0 # 前置推杆伸出 ACK 后零速等待
      second_preselect_post_place_preload_pickup_command_id: 21 # 0x15 夹出预装 KFS
      second_preselect_post_place_preload_pickup_done_feedback_id: 20 # 0x14 预装 KFS 夹取完成
      second_preselect_post_place_manual_front_laser_feedback_id: 21 # 0x15 人工触发前轮激光成功
      second_preselect_post_place_manual_front_laser_timeout_s: 1800.0 # 等待人工触发 0x15 超时
      second_preselect_post_place_front_pushrod_retract_command_id: 9 # 0x09 前置推杆收回
      second_preselect_post_place_rear_pushrod_extend_command_id: 10 # 0x0A 后置推杆伸出
      second_preselect_post_place_rear_laser_feedback_id: 5 # 0x05 后轮激光高度突变，继续剩余上阶流程
      second_preselect_post_place_rear_pushrod_retract_command_id: 11 # 0x0B 后置推杆收回
      second_preselect_post_place_final_delay_s: 25.0 # 上阶完成后发送最终 0x13 前等待
      second_preselect_post_place_final_command_id: 19 # 0x13 最终放置
      # second_preselection_climb_place_tree.xml：可独立运行，也是 second managed 统一目标；树内不含 gate 或 0x11/0x0D 握手
      second_preselect_climb_place_forward_x_m: 1.5 # startup odom gate 后沿车体系 +X 前进
      second_preselect_climb_place_lateral_y_m: 0.3 # 保存红方基准 +Y；blue 运行时自动镜像为 -Y
      second_preselect_climb_place_pre_climb_delay_msec: 20000 # 横移完成后进入上阶前的非阻塞延时
      second_preselect_climb_place_front_pushrod_extend_command_id: 8 # 0x08 前推杆伸出
      second_preselect_climb_place_manual_front_laser_feedback_id: 21 # 上行 0x15，本轮前轮附近首个激光放行
      second_preselect_climb_place_front_pushrod_retract_command_id: 9 # 0x09 前推杆收回
      second_preselect_climb_place_rear_pushrod_extend_command_id: 10 # 0x0A 后推杆伸出
      second_preselect_climb_place_rear_forward_x_m: 0.6 # 前收后伸后按 odom 闭环继续 +X，不等待后轮 0x05
      second_preselect_climb_place_rear_max_speed_mps: 0.40 # 0.6m odom 段速度上限
      second_preselect_climb_place_rear_min_speed_mps: 0.10 # 0.6m odom 段容差外最小速度
      second_preselect_climb_place_rear_timeout_s: 5.0 # 0.6m odom 段超时
      second_preselect_climb_place_rear_pushrod_retract_command_id: 11 # 0x0B 后推杆收回
      second_preselect_climb_place_preload_pickup_command_id: 21 # 默认树首可靠 0x15；KFS 兼容树在 25s 后 fire-and-forget 使用同一命令
      second_preselect_climb_place_preload_pickup_done_feedback_id: 20 # 兼容保留；默认树首和兼容收尾都不消费同 seq 0x14
      second_preselect_climb_place_final_delay_s: 25.0 # 后轮上阶完成、进入收尾节点时开始计时
      second_preselect_climb_place_compat_pickup_to_final_delay_s: 10.0 # 兼容树 25s 后 fire-and-forget 0x15 到最终 0x13 的固定等待
      second_preselect_climb_place_final_command_id: 19 # 默认树 25s 后；兼容树 0x15 后再等 10s 下行 0x13
      second_preselect_cmd_vel_topic: "cmd_vel"     # KFS 搜索、视觉对齐和前向趋近发布的运动命令
      second_preselect_post_pickup_forward_x_m: 1.5 # 夹取成功后先沿车体系 +X 固定前进；计入总 X 投影
      second_preselect_nav_y1_m: 0.75               # 夹取完成后红方基准 +Y 横移；blue 启动时自动取反
      second_preselect_nav_max_speed_mps: 0.60      # second_preselection_tree.xml 内 OdomDriveX/Y 与总 X 补齐段平移速度上限
      second_preselect_nav_min_speed_mps: 0.60      # second_preselection_tree.xml 内 OdomDriveX/Y 与总 X 补齐段未进容差前最小速度
      second_preselect_total_x_target_m: 4.2        # 从初次搜索新鲜 odom 原点沿搜索 yaw 的总 X 净投影目标
      second_preselect_total_x_tolerance_m: 0.03    # 总 X 闭环到位容差；已超调时停车成功且不倒退
      second_preselect_nav_timeout_s: 180.0         # 第二预选赛每个 odom 单轴段超时
      second_preselect_place_fixed_forward_x_m: 1.8 # 放置准备完成后固定沿 +X 前进距离；不再由深度计算
      second_preselect_place_fixed_forward_timeout_s: 5.0 # 固定前进超时；超时停车后仍继续后续 0x13 放置
      second_preselect_place_observe_timeout_s: 5.0 # 放置前中/下层观察兜底超时；超时后固定前进放置
      second_preselect_place_occupied_center_x_min_ratio: 0.20 # 中/下层 KFS 中心带左边界
      second_preselect_place_occupied_center_x_max_ratio: 0.80 # 中/下层 KFS 中心带右边界
      second_preselect_place_occupied_middle_y_min_ratio: 0.12 # 中层 KFS 中心高度下界；只用于占据判断
      second_preselect_place_occupied_middle_y_max_ratio: 0.45 # 中层 KFS 中心高度上界
      second_preselect_place_occupied_lower_y_min_ratio: 0.45 # 下层 KFS 中心高度下界；用于横向中心对齐
      second_preselect_place_occupied_lower_y_max_ratio: 1.00 # 下层 KFS 中心高度上界
      second_preselect_place_occupied_stable_frames: 5 # 连续占据/清空确认帧数
      second_preselect_place_occupied_first_lateral_m: 0.56 # 首次占据红方 +Y 横移距离；blue 镜像
      second_preselect_place_occupied_second_reverse_m: 1.10 # 再次占据时反方向横移距离
      second_preselect_place_occupied_lateral_max_speed_mps: 0.15 # 占位避让横移最大速度
      second_preselect_place_occupied_lateral_min_speed_mps: 0.03 # 占位避让横移最小速度
      second_preselect_place_occupied_lateral_timeout_s: 15.0 # 单次占位避让横移超时
      second_preselect_search_forward_speed_mps: 0.30 # 0x11 后沿 +X 前进搜索 R2 KFS 的速度
      second_preselect_search_timeout_s: 20.0       # 前进搜索 R2 KFS 超时
      second_preselect_r2_target_label_prefixes: ["T_"] # R2 KFS 标签前缀
      second_preselect_r1_blocking_labels: ["R_R1", "B_R1", "R1_KFS"] # R1 KFS 标签集合；搜索阶段识别到后继续寻找 R2
      second_preselect_r1_kfs_min_score: 0.50       # R1_KFS 最低置信度
      second_preselect_kfs_depth_min_m: 0.2         # R2/R1 KFS 深度窗口下限
      second_preselect_kfs_depth_max_m: 1.2         # R2/R1 KFS 深度窗口上限
      second_preselect_kfs_align_tolerance_px: 10   # KFS 横移对齐像素容差；现场允许略宽，避免近距离框抖动反复清零
      second_preselect_kfs_align_target_line_offset_px: 10 # KFS 目标线相对图像中心偏置
      second_preselect_kfs_align_stable_frames: 3   # 对齐稳定新帧数
      second_preselect_kfs_align_max_jump_px: 120   # tip_alignment 目标锁定跳变阈值；近距离 bbox 抖动时保持同一目标锁定
      second_preselect_kfs_align_kp: 0.0012         # KFS offset 到 linear.y 的比例系数
      second_preselect_kfs_align_min_speed_mps: 0.035 # KFS 横移最小速度；降低近距离横移过冲
      second_preselect_kfs_align_max_speed_mps: 0.10 # KFS 横移最大速度；降低近距离横移过冲
      second_preselect_kfs_align_timeout_s: 1800.0    # KFS 横移视觉对齐超时
      second_preselect_kfs_align_timeout_pickup_tolerance_px: 65 # 超时补夹像素容差；方向正确时允许进入前向趋近
      second_preselect_kfs_align_heading_gate_deg: 3.0 # yaw gate，超出时只修正朝向
      second_preselect_kfs_lost_stop_frames: 10     # 横移中连续丢失后停车等待；给 D455 深度/检测短暂抖动留余量
      second_preselect_kfs_lost_servo_speed_scale: 0.45 # 短暂丢框时按最近 offset 低速继续伺服，避免识别闪烁打断闭环
      second_preselect_kfs_align_offset_filter_alpha: 0.45 # offset 低通滤波系数，抑制 bbox 横向抖动
      second_preselect_kfs_invert_lateral_direction: false # 当前安装下不反转横移方向
      second_preselect_kfs_odom_xy_kp: 0.8          # KFS 前向 odom 闭环 P 增益
      second_preselect_kfs_approach_odom_tolerance_m: 0.02 # 前向趋近距离容差
      second_preselect_kfs_odom_yaw_tolerance_deg: 5.0 # 前向趋近 yaw 容差
      second_preselect_kfs_odom_stable_ticks: 3     # 前向趋近稳定 tick
      second_preselect_kfs_approach_speed_mps: 0.20 # KFS 夹取前按锁定深度前向趋近最大速度；不控制总 X 补齐
      second_preselect_kfs_approach_min_speed_mps: 0.05 # KFS 夹取前按锁定深度前向趋近最小速度
      second_preselect_kfs_approach_x_sign: 1       # 前向趋近沿车体系 +X
      second_preselect_kfs_approach_timeout_s: 8.0  # 初次夹取前向 odom 闭环趋近超时；最终放置前进使用固定前进超时
      second_preselect_kfs_grab_distance_m: 0.45    # 机械臂可触达距离
      second_preselect_kfs_heading_kp: 1.2          # KFS 对齐/趋近 heading hold 增益
      second_preselect_kfs_heading_max_speed_radps: 0.30 # heading hold 最大角速度
      second_preselect_kfs_mono_distance_fallback_enable: true # 深度洞时允许尺寸估距
      second_preselect_kfs_mono_target_width_m: 0.35 # KFS 正面可见宽度
      second_preselect_kfs_mono_target_height_m: 0.35 # KFS 正面可见高度
      second_preselect_kfs_mono_fx_px: 385.83319091796875 # 尺寸估距 fx
      second_preselect_kfs_mono_fy_px: 385.83319091796875 # 尺寸估距 fy
      second_preselect_kfs_mono_min_bbox_px: 40     # 尺寸估距最小 bbox
      second_preselect_kfs_mono_max_delta_from_locked_m: 0.25 # 尺寸估距与锁定深度最大差
      second_preselect_kfs_depth_roi_size: 7        # 单点深度 ROI 边长
      second_preselect_kfs_depth_min_valid_count: 10 # 单 ROI 有效点阈值
      second_preselect_kfs_depth_bbox_sample_ratios: [0.25, 0.50, 0.75] # bbox 多点采样位置
      second_preselect_kfs_depth_bbox_min_success_count: 1 # 多点采样最少成功点
      second_preselect_grab_verify_timeout_s: 3.0   # 0x12 对应 0x11 完成反馈后视觉消失验证超时
      second_preselect_grab_verify_lost_stable_frames: 10 # 原目标连续消失帧数
      second_preselect_grab_verify_iou_threshold: 0.30 # 原目标匹配 IoU 阈值
      second_preselect_grab_settle_s: 0.5           # 夹取确认成功后停车稳定时间
      preselection_ramp_forward_x_m: 5.00       # second managed 入口合并斜坡前进距离；只沿 +X 前进，超调不反向拉回
      preselection_ramp_max_speed_mps: 1.00     # 斜坡段平移速度上限
      preselection_ramp_min_speed_mps: 1.00     # 斜坡段最小平移速度
      preselection_ramp_forward_timeout_s: 5.0  # 合并斜坡段独立超时；超时停车后继续后续 second 逻辑
      second_preselect_after_ramp_turn_delta_rad: 1.5708 # 红方基准斜坡后左转 90°；blue 启动时自动取反
      second_preselect_after_ramp_turn_timeout_s: 30.0 # 斜坡后 90° 转向超时
      second_preselect_vision_config_file: ""       # 空则回退 rc26_vision/config/vision_models.yaml
      second_preselect_model_id: "kfs_default"      # 用于 KFS 搜索/夹取、占位判断与任意 KFS 放置对齐
      second_preselect_odom_topic: "odom"           # KFS 对齐、总 X、占位避让与放置趋近读取的 odom topic
      second_preselect_odom_timeout_s: 0.5          # 第二预选赛各 odom 闭环的新鲜度超时
      second_preselect_dynamic_roi_ui_enable: false # 第二预选赛 OpenCV 调试窗口；贯穿夹取与任意 KFS 放置准备/对齐
      second_preselect_dynamic_roi_ui_window_name: "SecondPreselectionVision" # 第二预选赛视觉调试窗口标题

      # ======================================================================
      # 武馆区 (MC) 红方基准运行参数 —— blue 启动时自动镜像侧向 yaw 和原地旋转方向
      # ======================================================================
      # --- 红方基准 MC 复合 OdomDriveXTurnX 导航：按旧 +X -> 右转 90° -> -X 终点标定 ---
      mc_nav_forward_x_m: 1.05     # 蓝方现场标定保留值；除 team 外其余参数与红方同步，blue 不镜像 X
      mc_nav_right_turn_delta_rad: -1.5708 # 红方基准第一段后相对右转角度；blue 自动取反为左转
      mc_nav_reverse_x_m: -0.68     # 红方基准复合动作第二段目标 yaw 方向 x 负向位移；blue 不镜像 X
      mc_after_rotate_retreat_y_m: -0.2 # 蓝方夹取后旋转完成的 OdomDriveY 负向距离
      mc_nav_timeout_sec: 180.0     # MC 复合 OdomDriveXTurnX 动作总超时时间，单位秒

      # --- 相机 / 推理（内嵌直连相机，对齐 tip_vision_test_node）---
      mc_vision_config_file: ""     # 视觉模型配置文件；空则回退 rc26_vision/config/vision_models.yaml
      mc_model_id: "tip_default"    # 视觉模型 profile ID，用于加载端头检测模型
      mc_camera_index: 6            # 首选 USB 相机索引；FHD Webcam 当前 video-index0 枚举为 /dev/video6
      mc_camera_device: "/dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._FHD_Webcam_SN0001-video-index0" # 固定外接 FHD Webcam，避免误扫 RealSense
      mc_auto_scan_camera: false    # 固定相机不可用时直接失败，不再扫描其它 /dev/video*
      mc_width: 640                 # 相机采集宽度，单位像素
      mc_height: 480                # 相机采集高度，单位像素
      mc_fps: 30                    # 相机期望采集帧率
      mc_target_labels: ["JK"]      # 端头目标标签，必须能在 tip_default 标签表中找到

      # --- 视觉对齐（横移 P 控制，发布 cmd_vel.linear.y）---
      mc_align_cmd_vel_topic: "cmd_vel"      # 视觉横移对齐发布的速度话题；默认由 rc26_mcu_transport 消费
      mc_align_tolerance_px: 20              # 目标中心允许偏离画面中心的像素容差
      mc_align_stable_frames: 5              # 连续满足容差后触发夹取的稳定帧数
      mc_align_kp: 0.0010                    # 横移 P 控制比例增益，像素误差到 m/s
      mc_align_min_speed_mps: 0.010         # 横移控制最小速度，单位 m/s
      mc_align_max_speed_mps: 0.010           # 横移控制最大速度，单位 m/s
      mc_align_search_speed_mps: 0.020       # 无端头时固定沿车体系 +Y 低速横移搜寻，不随 red/blue 镜像
      mc_align_command_rate_hz: 20.0         # 横移速度指令最大发布频率，单位 Hz
      mc_align_lost_stop_frames: 3           # 锁定目标短暂丢失多少帧后才重新获锁
      mc_align_lost_servo_speed_scale: 0.45  # 短暂丢框时按最近 offset 低速继续伺服的速度缩放
      mc_align_lost_search_suppress_px: 70   # 最近端头仍在中心附近时，禁止切入固定方向搜索的 offset 阈值
      mc_align_lost_search_suppress_timeout_s: 1.0 # 近中心丢框保护最长持续时间，超时后才恢复固定方向搜索
      mc_align_near_center_lost_speed_scale: 0.20  # 近中心丢框保护内沿最近 offset 低速补偿的速度缩放
      mc_align_offset_filter_alpha: 0.45     # 重新识别后 offset 低通滤波系数，降低识别框抖动
      mc_align_target_lock_enable: true      # 是否锁定同一个端头，避免双框同屏时反复切换
      mc_align_target_lock_max_jump_px: 160  # 锁定目标允许的单次水平跳变像素
      mc_align_invert_direction: true        # 相机朝机器人后方；默认反转横移方向
      mc_align_heading_hold_enable: true     # 是否订阅 mc_odom_topic 并发布 angular.z 保持车身朝向
      # mc_align_target_yaw_rad 可作为视觉阶段静态兜底；mc_tree.xml 默认传入右转后的动态 odom yaw
      mc_align_heading_kp: 1.2               # yaw 误差到 angular.z 的比例系数
      mc_align_heading_max_speed_radps: 0.40 # 视觉伺服 heading hold 最大角速度，单位 rad/s
      mc_align_heading_tolerance_deg: 3.0    # yaw 误差进入该容差后才允许稳定计数
      mc_align_heading_gate_deg: 8.0         # yaw 误差超过该 gate 时暂停横移/前探，只先修正朝向
      mc_align_odom_timeout_s: 0.5           # odom 超过该时间未更新时停车等待，单位秒

      # --- 夹取（对齐后 x 负向前探等待前方限位 0x06，再下发 GRAB_TIP=0x01）---
      mc_grab_command_id: 1                  # 夹取端头命令 ID；1 对应 GRAB_TIP(0x01)
      # mc_grab_payload 默认空（GRAB_TIP 无 payload）；如需下发字节，填如 [1, 2]。
      # 注意：ROS2 不支持 YAML 空数组参数，留空请勿写 []，直接省略该项即可。
      mc_grab_service_name: "/mechanism/send_command"  # rc26_mcu_transport 提供的机构命令服务名
      mc_grab_limit_switch_feedback_topic: "/mechanism/command_feedback"  # rc26_mcu_transport 发布的 MCU 上行业务反馈话题
      mc_grab_limit_switch_feedback_id: 6    # 前方限位开关触发反馈 ID；6 对应 0x06
      mc_grab_approach_speed_mps: 0.05      # 对齐后 x 负方向前探速度幅值，单位 m/s
      mc_grab_approach_timeout_s: 10.0        # 前探等待 0x06 的安全超时，单位秒
      mc_grab_done_lost_time_s: 1.0   # 夹取后端头持续消失多久判定完成，单位秒
      mc_servo_timeout_s: 60.0         # 视觉伺服整体安全超时，单位秒

      # --- 原地旋转（发布 cmd_vel.angular.z，odom yaw 闭环）---
      mc_rotate_angle_deg: 175.0       # 原地旋转目标角度，单位度
      mc_rotate_speed_radps: 0.6       # 原地旋转最大角速度，单位 rad/s
      mc_rotate_min_speed_radps: 0.12  # 原地旋转末段最小角速度，单位 rad/s
      mc_rotate_slowdown_angle_deg: 30.0 # 剩余角度小于该值时线性减速，单位度
      mc_rotate_direction: 1           # 原地旋转方向；+1 逆时针，-1 顺时针
      mc_rotate_yaw_tolerance_deg: 3.0 # 旋转完成角度容差，单位度
      mc_rotate_cmd_vel_topic: "cmd_vel"  # 原地旋转发布的速度话题；默认由 rc26_mcu_transport 消费
      mc_odom_topic: "odom"            # 视觉 heading hold 和原地旋转闭环使用的雷达标准里程计话题
      mc_rotate_odom_timeout_s: 0.5    # 旋转阶段 odom 超过该时间未更新时停车等待，单位秒
      mc_rotate_timeout_s: 15.0        # 原地旋转安全超时，单位秒

      # --- managed 预选入口 branch gate：first 用 0x10/0x0C，second 用 0x11/0x0D ---
      mc_mf_start_signal_feedback_topic: "/mechanism/command_feedback" # 人工触发外部限位分支事件来源
      mc_mf_start_signal_feedback_id: 6    # MANUAL_LIMIT_SWITCH_1_TRIGGERED(0x06)，人工触发外部限位 1 分支事件
      mc_mf_start_signal_timeout_s: 0.0    # 0 表示无限等待人工触发外部限位 1 分支事件
      mc_mf_start_command_service: "/mechanism/send_command" # rc26_mcu_transport 可靠命令服务
      mc_mf_start_command_id: 16           # COMPETITION_START(0x10)，通知下位机比赛开始
      mc_mf_start_command_timeout_s: 5.0   # 等待 0x10 可靠 ACK 的最长时间，单位秒
      mc_mf_start_done_feedback_id: 12     # COMPETITION_START_DONE(0x0C)，必须与 0x10 的 ACK seq 匹配
      mc_mf_start_done_timeout_s: 1800.0      # 等待 0x0C 比赛开始完成反馈的最长时间，单位秒
      mc_mf_start_log_period_s: 1.0        # 等待人工触发外部限位 1 分支事件期间 INFO 日志节流周期，单位秒
      preselection_entry_continue_delay_msec: 500 # first 入口 0x06 握手完成后进入 MC 前延时
      preselection_after_mc_continue_delay_msec: 5000 # 旧 MC+MF 组合树 MC 末尾 0x06 触发后、下发 0x10 前延时；first 默认重复树不使用

      # ======================================================================
      # 梅林区预选赛红方基准链路参数 —— blue 启动时自动镜像入口 Y、左右探测和 yaw
      # ======================================================================
      mf_preselect_entry2_nav_enable: true      # 2号入口导航点未标定前关闭；关闭时默认机器人已在2号入口
      mf_preselect_entry2_nav_segment1_x_m: 2.1 # 红方基准 2号入口 OdomDriveX 车体系 x 正向位移；blue 不镜像 X
      mf_preselect_entry2_nav_segment1_y_m: -1.6 # 红方基准 2号入口 OdomDriveY 车体系 y 负向位移；blue 自动取反
      mf_preselect_entry2_nav_timeout_sec: 180.0 # 入口单个 x/y 动作超时，单位秒

      # --- MC 后置 MF 预选组合树入口导航；只由 mf_preselection_after_mc_tree.xml 使用 ---
      mc_to_mf_preselect_nav_enable: true       # 组合树中 MC 完成后是否执行到 MF 预选的专用入口导航
      mc_to_mf_preselect_nav_segment1_x_m: -2.1 # MC 后置入口第一段 OdomDriveX 车体系 x 负向位移；blue 不镜像 X
      mc_to_mf_preselect_nav_turn_delta_rad: -1.5708 # 第一段后右转 90°；blue 自动取反为左转
      mc_to_mf_preselect_nav_segment2_x_m: 1.3 # 转向后第二段 OdomDriveX 车体系 x 正向位移；blue 不镜像 X
      mc_to_mf_preselect_nav_timeout_sec: 180.0 # MC 后置入口单个 x/turn 动作超时，单位秒

      mf_preselect_vision_config_file: ""        # KFS 视觉模型配置；空则回退 rc26_vision/config/vision_models.yaml
      mf_preselect_model_id: "kfs_default"       # KFS 模型 profile ID
      mf_preselect_r2_target_label_prefixes: ["T_"] # R2 可夹取 KFS 标签前缀
      mf_preselect_r2_target_labels: ["__none__"]    # 精确 R2 标签占位；无精确过滤时保留不可匹配占位
      mf_preselect_r1_blocking_labels: ["R_R1", "B_R1", "R1_KFS"] # R1 干扰/阻挡目标标签
      mf_preselect_r1_blocking_label_prefixes: ["__none__"] # R1 标签前缀占位
      mf_preselect_r1_kfs_min_score: 0.50      # R1_KFS 低置信度过滤阈值，低于该值不作为R1阻挡
      mf_preselect_fake_label_prefixes: ["F_"]   # 假 KFS 标签前缀
      mf_preselect_fake_labels: ["__none__"]     # 精确假 KFS 标签占位
      mf_preselect_depth_min_m: 0.35              # 梅林内部/旁列/直出 KFS 锁定深度有效下限，单位 m
      mf_preselect_depth_max_m: 1.0             # 梅林内部/旁列/直出 KFS 锁定深度有效上限，单位 m
      mf_preselect_entry_depth_min_m: 0.35       # 入口2/1/3定点与入口横移中断 KFS 锁定深度下限，单位 m
      mf_preselect_entry_depth_max_m: 1.4        # 入口2/1/3定点与入口横移中断 KFS 锁定深度上限，单位 m
      mf_preselect_detect_seen_stable_frames: 1  # 连续看到目标多少帧后确认
      mf_preselect_detect_lost_stable_frames: 5  # 连续未看到目标多少帧后确认无目标
      mf_preselect_entry_detect_timeout_s: 1.0   # 入口单点检测最长等待，单位秒
      mf_preselect_scan_detect_timeout_s: 1.0    # 行内/阶梯扫描检测最长等待，单位秒
      mf_preselect_entry_interrupt_max_offset_px: 165 # 入口横移中 KFS 偏离中心超过该值时继续扫线，不立即停车夹取
      mf_preselect_entry_interrupt_dynamic_comp_enable: true # 入口横移按 MCU 半余弦减速模型动态放大中断窗口
      mf_preselect_entry_interrupt_latency_s: 0.15 # 入口横移中断补偿的视觉/BT/下发延迟估计，单位秒
      mf_preselect_entry_interrupt_fx_px: 385.83319091796875 # 当前 D455 640x480 彩色流 CameraInfo.K[0] 实测 fx，单位 px
      mf_preselect_entry_interrupt_extra_px_min: 10 # 动态提前中断像素补偿下限，单位 px
      mf_preselect_entry_interrupt_extra_px_max: 50 # 动态提前中断像素补偿上限，单位 px
      mf_preselect_entry_mcu_stop_settle_enable: true # 入口横移中断后先持续零速等待 MCU 收完速度规划
      mf_preselect_entry_mcu_vy_acc_mps2: 1.0     # MCU Chassis_driver.h 中 CHASSIS_MAX_VY_ACC 对应值
      mf_preselect_entry_mcu_stop_margin_s: 0.08  # MCU 理论减速时间外的保守余量，单位秒
      mf_preselect_entry_mcu_stop_max_wait_s: 0.40 # 入口横移中断后零速等待上限，单位秒
      mf_preselect_kfs_align_tolerance_px: 15    # KFS 锁定帧像素偏差容差；容差内跳过视觉横移对齐
      mf_preselect_kfs_align_target_line_offset_px: 10 # KFS 识别框中线目标相对图像中心线的偏置，单位 px；负值表示目标线向图像左侧移动
      mf_preselect_kfs_align_stable_frames: 3    # KFS 横移视觉闭环/复核前要求同一目标连续稳定新帧数
      mf_preselect_kfs_align_max_jump_px: 70     # KFS tip_alignment 目标锁定允许的单帧中心跳变阈值，单位 px
      mf_preselect_kfs_align_kp: 0.0015         # KFS 视觉横移 offset 到 linear.y 的比例系数
      mf_preselect_kfs_align_min_speed_mps: 0.06 # KFS 视觉横移最小速度幅值
      mf_preselect_kfs_align_max_speed_mps: 0.14 # KFS 视觉横移最大速度幅值
      mf_preselect_kfs_align_timeout_s: 20.0      # KFS 横移视觉闭环总安全超时
      mf_preselect_kfs_align_timeout_pickup_tolerance_px: 40 # 超时但仍在该偏差内且深度有效时继续趋近夹取
      mf_preselect_kfs_align_heading_gate_deg: 3.0 # KFS tip_alignment yaw gate；超过该偏差时暂停横移只修正朝向
      mf_preselect_kfs_lost_stop_frames: 6       # KFS 视觉横移中连续多少帧未锁定目标后停车等待新稳定帧
      mf_preselect_kfs_lost_servo_speed_scale: 0.45 # 短暂丢框时沿用最近 offset 低速继续伺服，抑制识别闪烁导致的停走
      mf_preselect_kfs_align_offset_filter_alpha: 0.45 # offset 低通滤波系数，抑制 bbox 横向抖动
      mf_preselect_kfs_invert_lateral_direction: false # 当前相机/底盘安装下需反转 KFS 横移方向
      mf_preselect_kfs_odom_xy_kp: 0.8           # KFS 前向 odom 闭环距离误差 P 增益
      mf_preselect_kfs_approach_odom_tolerance_m: 0.02 # KFS 前向趋近 odom 闭环距离容差，单位 m
      mf_preselect_kfs_odom_yaw_tolerance_deg: 5.0 # KFS 前向 odom 闭环 heading hold 完成 yaw 容差
      mf_preselect_kfs_odom_stable_ticks: 3      # KFS 前向 odom 闭环完成前要求连续稳定 tick 数
      mf_preselect_kfs_approach_speed_mps: 0.20  # KFS 前向 odom 闭环 x 方向最大速度幅值，单位 m/s
      mf_preselect_kfs_approach_min_speed_mps: 0.03 # KFS 前向 odom 闭环 x 方向最小速度幅值，单位 m/s
      mf_preselect_kfs_approach_x_sign: 1        # KFS 趋近方向符号；1 为 linear.x 正向，-1 为负向
      mf_preselect_kfs_approach_timeout_s: 8.0   # KFS 前向 odom 闭环趋近安全超时；计划时长超出会失败停车
      mf_preselect_kfs_grab_distance_m: 0.45     # KFS 机械臂可触达距离/停止目标距离，前进距离=max(0,锁定深度-该值)
      mf_preselect_kfs_mono_distance_fallback_enable: true # 横移对齐阶段真实深度洞时，允许用已锁定 KFS 的 350mm 尺寸估距兜底
      mf_preselect_kfs_mono_target_width_m: 0.35  # KFS 正面可见宽度，单位 m
      mf_preselect_kfs_mono_target_height_m: 0.35 # KFS 正面可见高度，单位 m
      mf_preselect_kfs_mono_fx_px: 385.83319091796875 # 当前 D455 640x480 彩色流 CameraInfo.K[0] 实测 fx，单位 px
      mf_preselect_kfs_mono_fy_px: 385.83319091796875 # 当前 D455 640x480 彩色流 CameraInfo.K[4] 兜底 fy，单位 px
      mf_preselect_kfs_mono_min_bbox_px: 40       # 尺寸估距要求 bbox 宽高至少达到该像素，避免小框误估距
      mf_preselect_kfs_mono_max_delta_from_locked_m: 0.25 # 尺寸估距与最近真实锁定深度允许的最大差值，单位 m
      mf_preselect_kfs_depth_roi_size: 7          # KFS 深度单点 ROI 边长，单位 px
      mf_preselect_kfs_depth_min_valid_count: 10  # 单个 ROI 内判定有效深度所需最少点数
      mf_preselect_kfs_depth_bbox_sample_ratios: [0.25, 0.50, 0.75] # bbox 内横纵采样比例，组合成 NxN 个候选深度点
      mf_preselect_kfs_depth_bbox_min_success_count: 1 # bbox 多点采样中至少多少个候选点有效，才认为该 KFS 深度有效
      mf_preselect_max_pickup_count: 2           # 单局预选赛最多夹取 R2 KFS 数量
      mf_preselect_grab_settle_s: 0.5            # KFS 视觉确认夹取成功后零速稳定等待，单位秒
      mf_preselect_grab_verify_timeout_s: 3.0    # KFS 夹取 ACK 后等待原目标消失的最长视觉验证时间
      mf_preselect_grab_verify_lost_stable_frames: 3 # 连续多少个新推理帧未匹配原目标才确认夹取成功
      mf_preselect_grab_verify_iou_threshold: 0.30 # 同 label 且 bbox IoU 达到该值才认为仍是夹取前目标
      mf_preselect_grab_kfs_up_command_id: 3     # 0x03 GRAB_KFS_UP，用于高侧/抬升场景
      mf_preselect_grab_kfs_down_command_id: 2   # 0x02 GRAB_KFS_DOWN，用于低侧/下降场景
      mf_preselect_entry_grab_kfs_up_command_id: 15 # 0x0F ENTRY_GRAB_KFS_UP，入口高夹取专用
      mf_preselect_entry_grab_kfs_up_done_feedback_id: 11 # 0x0B ENTRY_GRAB_KFS_UP_DONE，必须与 0x0F 的 ACK seq 匹配

      mf_preselect_cmd_vel_topic: "cmd_vel"      # 预选赛链路发布底盘速度话题
      mf_preselect_odom_topic: "odom"            # 相对移动/转向闭环 odom 话题
      mf_preselect_send_command_service: "/mechanism/send_command" # 机构 raw transport service
      mf_preselect_feedback_topic: "/mechanism/command_feedback"   # 机构/台阶反馈 topic
      mf_preselect_command_timeout_s: 180.0        # 机构命令 ACK/完成反馈超时，单位秒
      mf_preselect_arm_high_raise_command_id: 13 # 0x0D ARM_HIGH_RAISE，入口1/3阶梯高抬升
      mf_preselect_arm_high_raise_done_feedback_id: 9 # 0x09 ARM_HIGH_RAISE_DONE
      mf_preselect_arm_raise_command_id: 4       # 0x04 ARM_RAISE，低到高阶梯预调
      mf_preselect_arm_lower_command_id: 5       # 0x05 ARM_LOWER，高到低阶梯预调
      mf_preselect_arm_raise_done_feedback_id: 2 # 0x02 ARM_RAISE_DONE
      mf_preselect_arm_lower_done_feedback_id: 3 # 0x03 ARM_LOWER_DONE
      mf_preselect_second_arm_lower_command_id: 14 # 0x0E ARM_SECOND_LOWER，向下夹取 odom 闭环趋近前放下第二节机械臂
      mf_preselect_second_arm_lower_done_feedback_id: 10 # 0x0A ARM_SECOND_LOWER_DONE，必须与 0x0E 的 ACK seq 匹配

      mf_preselect_entry_probe_left_distance_m: 1.2     # 2号入口向1号阶梯横移探测距离
      mf_preselect_entry_probe_right_sweep_distance_m: 2.4 # 从1号阶梯扫到3号阶梯横移距离
      mf_preselect_entry_probe_return_distance_m: 1.1   # 从1/3号阶梯返回2号入口横移距离
      mf_preselect_lateral_probe_speed_mps: 0.30        # 入口 Y 向平移探测速度绝对值
      mf_preselect_move_tolerance_m: 0.03               # 相对移动完成距离容差
      mf_preselect_move_timeout_s: 12.0                 # 单段相对移动超时，单位秒
      mf_preselect_direct_exit_drive_distance_m: 4.8    # 直出梅林相对前进距离，占位可现场调
      mf_preselect_direct_exit_drive_speed_mps: 0.25    # 直出梅林速度绝对值
      mf_preselect_exit_yaw_rad: 0.0                    # 红方基准梅林出口方向 yaw；blue 自动取反
      mf_preselect_stair1_direction_yaw_rad: 1.5708     # 红方基准假KFS避障朝1号阶梯方向 yaw；blue 自动取反
      mf_preselect_stair3_direction_yaw_rad: -1.5708    # 红方基准假KFS避障朝3号阶梯方向 yaw；blue 自动取反
      mf_preselect_row_scan_left_yaw_delta_rad: 1.5708  # 红方基准第2/3行周身探测左转角度；blue 自动取反
      mf_preselect_row_scan_back_yaw_delta_rad: 3.1416  # 红方基准第2/3行周身探测背向转角；blue 自动取反
      mf_preselect_row4_exit_turn_yaw_rad: -1.5708      # 红方基准第二列第四行强制出口转向 yaw；blue 自动取反
      mf_preselect_turn_kp: 1.2                         # 转向 yaw P 增益
      mf_preselect_turn_max_speed_radps: 0.80           # 转向最大角速度
      mf_preselect_turn_tolerance_deg: 5.0              # 转向完成角度容差
      mf_preselect_turn_stable_ticks: 3                 # 转向稳定 tick 数
      mf_preselect_turn_timeout_s: 16.0                 # 单次转向超时，单位秒
      mf_preselect_odom_timeout_s: 0.5                  # odom 新鲜度超时，单位秒
      mf_preselect_heading_kp: 1.2                      # 相对移动 heading hold P 增益
      mf_preselect_heading_max_speed_radps: 0.30        # 相对移动 heading hold 最大角速度
      mf_preselect_path_r1_lost_wait_timeout_s: 0.0     # R1路径等待超时；0表示无限等待
      mf_preselect_final_exit_center_offset_m: 1.2      # 最终下阶离开梅林后，虚拟外侧归位目标相对最后格中心的外推距离

      # ======================================================================
      # Grid heading 正式转向/对齐参数 —— 供独立 grid_heading 入口和 MF 格间动作复用
      # ======================================================================
      grid_heading_direction: "forward"                # 独立 grid_heading_tree 和 MF预选赛入口导航后选择的方向: forward | left | right | backward
      grid_heading_forward_yaw_rad: 0.0             # 正前方向目标 yaw，单位 rad
      grid_heading_left_yaw_rad: 1.5708             # 左 90° 目标 yaw，单位 rad
      grid_heading_right_yaw_rad: -1.5708           # 右 90° 目标 yaw，单位 rad
      grid_heading_backward_yaw_rad: 3.1416         # 向后目标 yaw，单位 rad
      grid_heading_cmd_vel_topic: "cmd_vel"         # GridTurn/GridHeadingAlign 发布的速度话题
      grid_heading_odom_topic: "odom"               # GridTurn/GridHeadingAlign 使用的 odom yaw 话题
      grid_heading_kp: 1.2                          # yaw 误差到 angular.z 的比例系数
      grid_heading_turn_max_speed_radps: 0.6        # GridTurn 粗转向最大角速度，单位 rad/s
      grid_heading_align_max_speed_radps: 0.30      # GridHeadingAlign 精对齐最大角速度，单位 rad/s
      grid_heading_turn_gate_deg: 8.0               # GridTurn 进入粗对准的角度 gate，单位度
      grid_heading_align_tolerance_deg: 3.0         # GridHeadingAlign 成功容差，单位度
      grid_heading_align_stable_ticks: 3            # 连续多少个 tick 满足容差后确认对齐
      grid_heading_odom_timeout_s: 0.5              # odom yaw 超过该时间未更新时停车等待/失败
      grid_heading_turn_timeout_s: 16.0              # GridTurn 最大运行时间，单位秒
      grid_heading_align_timeout_s: 5.0             # GridHeadingAlign 最大运行时间，单位秒

      # ======================================================================
      # MF 格中心归位参数 —— 台阶动作完成后用麦克纳姆横移/前后平移回二维格中心
      # ======================================================================
      mf_center_cmd_vel_topic: "cmd_vel"             # MFEntryCenterAdvance/GridCenterAlign 发布的速度话题
      mf_center_odom_topic: "odom"                   # 二维格中心归位使用的 odom 位姿话题
      mf_center_grid_step_m: 1.2                     # MF 离散格中心间距，单位米
      mf_center_entry_forward_offset_m: 0.25         # 首次上到 grid2 后继续前进到格中心的距离，单位米
      mf_center_entry_forward_speed_mps: 0.06        # 首次前进到 grid2 中心的线速度上限，单位 m/s
      mf_center_xy_kp: 0.8                           # odom x/y 误差到车体平移速度的比例系数
      mf_center_min_speed_mps: 0.05                 # 未进入位置容差时的最小平移速度，单位 m/s
      mf_center_max_speed_mps: 0.10                 # 二维格中心归位平移速度上限，单位 m/s
      mf_center_xy_tolerance_m: 0.1                # x/y 到格中心距离进入该容差后才累计稳定，单位米
      mf_center_yaw_kp: 1.2                          # yaw 误差到 angular.z 的比例系数
      mf_center_yaw_max_speed_radps: 0.30            # 格中心归位 yaw 修正最大角速度，单位 rad/s
      mf_center_yaw_tolerance_deg: 3.0               # yaw 误差进入该容差后才累计稳定，单位度
      mf_center_stable_ticks: 5                      # 连续多少个 tick 同时满足 xy/yaw 容差后确认归位成功
      mf_center_odom_timeout_s: 0.5                  # odom 位姿超过该时间未更新时停车等待/失败
      mf_center_align_timeout_s: 12.0                 # 单次格中心归位最大运行时间，单位秒

      # ======================================================================
      # 台阶动作参数 —— 供独立 stair_* 测试树和 MF GridTransition 离散格间动作复用
      # ======================================================================
      stair_cmd_vel_topic: "cmd_vel"                 # 台阶动作直接发布的速度话题；默认由 rc26_mcu_transport 消费
      stair_send_command_service: "/mechanism/send_command"  # rc26_mcu_transport 提供的推杆命令服务
      stair_feedback_topic: "/mechanism/command_feedback"    # rc26_mcu_transport 发布的 MCU 上行激光突变事件话题
      stair_climb_front_drive_fast_speed_mps: 0.40   # 上台阶前轮 0x04 段线性降速起始速度绝对值，单位 m/s
      stair_climb_front_drive_slow_speed_mps: 0.20   # 上台阶前轮 0x04 段线性降速目标速度绝对值，单位 m/s
      stair_climb_front_drive_slowdown_duration_s: 2.0 # 上台阶前轮 0x04 段从 fast 降到 slow 的时长，单位秒
      stair_climb_rear_drive_fast_speed_mps: 0.40    # 上台阶后轮 0x05 段线性降速起始速度绝对值，单位 m/s
      stair_climb_rear_drive_slow_speed_mps: 0.10    # 上台阶后轮 0x05 段线性降速目标速度绝对值，单位 m/s
      stair_climb_rear_drive_slowdown_duration_s: 2.5 # 上台阶后轮 0x05 段从 fast 降到 slow 的时长，单位秒
      stair_descend_rear_drive_speed_mps: 0.15       # 下台阶后轮 0x05 段固定速度绝对值，单位 m/s
      stair_descend_front_second_drive_fast_speed_mps: 0.40 # 下台阶前轮第二激光 0x07 段线性降速起始速度绝对值，单位 m/s
      stair_descend_front_second_drive_slow_speed_mps: 0.05 # 下台阶前轮第二激光 0x07 段线性降速目标速度绝对值，单位 m/s
      stair_descend_front_second_drive_slowdown_duration_s: 2.0 # 下台阶前轮第二激光 0x07 段从 fast 降到 slow 的时长，单位秒
      mf_preselect_descend_direct_rush_enable: true  # MF内部下阶梯直冲开关；false回退当前推杆+激光事件下阶实现
      mf_preselect_descend_direct_rush_speed_mps: 0.45 # MF内部下阶梯直冲 x 正向速度绝对值，单位 m/s
      mf_preselect_descend_direct_rush_duration_s: 2.0 # MF内部下阶梯直冲定时时长，期间忽略0x05/0x07激光突变
      stair_command_rate_hz: 20.0                    # 台阶动作速度发布频率，单位 Hz
      stair_command_timeout_s: 3.0                   # 每条推杆命令 accepted 等待超时，单位秒
      stair_front_event_timeout_s: 20.0              # 前轮激光高度突变等待超时，单位秒
      stair_rear_event_timeout_s: 20.0               # 后轮激光高度突变等待超时，单位秒
      stair_climb_front_extend_delay_s: 3.2          # 上台阶前推杆伸出 accepted 后零速等待时间，单位秒
      stair_climb_retract_rear_extend_delay_s: 2.7   # 上台阶前收+后伸 accepted 后零速等待时间，单位秒
      stair_climb_rear_retract_delay_s: 3.1          # 上台阶后推杆收回 accepted 后零速等待时间，单位秒
      stair_descend_rear_extend_delay_s: 3.1         # 下台阶后推杆伸出 accepted 后零速等待时间，单位秒
      stair_descend_retract_front_extend_delay_s: 2.7 # 下台阶后收+前伸 accepted 后零速等待时间，单位秒
      stair_descend_front_retract_timed_drive_speed_mps: 0.10 # 下台阶前推杆收回前 x 负向定时固定速度绝对值，单位 m/s
      stair_descend_front_retract_drive_duration_s: 3.0  # 下台阶前推杆收回前 x 负向定时行驶时间，单位秒
      stair_descend_front_retract_delay_s: 1.8       # 下台阶前推杆收回 accepted 后零速等待时间，单位秒
      stair_odom_topic: "odom"                       # 台阶姿态微调用 odom 话题，yaw 由四元数解算
      stair_heading_hold_enable: true                # 上/下台阶前对齐 yaw，直行期间叠加 angular.z 保持方向
      stair_heading_kp: 1.2                          # yaw 误差到 angular.z 的比例系数
      stair_heading_max_speed_radps: 0.30            # heading hold 最大角速度，单位 rad/s
      stair_heading_tolerance_deg: 3.0               # yaw 误差进入该容差并稳定后才开始跨阶梯
      stair_heading_gate_deg: 8.0                    # 调参 gate，必须不小于 tolerance
      stair_heading_stable_ticks: 3                  # 连续多少个 tick 满足 yaw 容差后确认姿态就绪
      stair_heading_odom_timeout_s: 0.5              # odom yaw 超过该时间未更新时停车等待/失败
      stair_heading_align_timeout_s: 8.0             # 进入台阶动作前原地对齐 yaw 的安全超时
