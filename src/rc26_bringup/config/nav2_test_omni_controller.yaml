controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 30.0
    odom_topic: control_state
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["NMPCFollowPath", "FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    NMPCFollowPath:
      plugin: "rc26_nmpc_controller::NmpcController"
      solver_time_limit_ms: 3.0
      solver_timeout_cycles: 2
      fallback_recover_cycles: 6
      fallback_min_hold_sec: 0.5
      use_osqp: true
      fallback_controller_id: "FollowPath"
      w_ref_vx: 8.0
      w_ref_vy: 8.0
      w_ref_wz: 6.0
      w_smooth_vx: 2.0
      w_smooth_vy: 2.0
      w_smooth_wz: 1.5
      vx_min: -2.5
      vx_max: 2.5
      vy_min: -2.5
      vy_max: 2.5
      wz_min: -3.0
      wz_max: 3.0
      ax_max: 3.0
      ay_max: 3.0
      aw_max: 6.0
      lhi_yellow_scale: 0.8
      lhi_orange_scale: 0.5
      degraded_scale: 0.3
      backend_not_ready_scale: 0.7
      backend_stale_scale: 0.7
      backend_graph_health_ref: 0.7
      backend_graph_health_min_scale: 0.4
      jump_suppressed_scale: 0.6
      imu_spike_scale: 0.6
      min_quality_scale: 0.08
      health_timeout_sec: 0.25
      backend_timeout_sec: 0.5
      control_state_timeout_sec: 0.25
      handover_a_lin: 2.2
      handover_a_ang: 4.0
      profile_orange: "loc_orange"
      profile_red: "loc_red_hold"

    FollowPath:
      plugin: "rc26_omni_controller::OmniPidPursuitController"
      translation_kp: 3.0
      translation_ki: 0.1
      translation_kd: 0.3
      enable_rotation: true
      rotation_kp: 3.0
      rotation_ki: 0.1
      rotation_kd: 0.3
      transform_tolerance: 0.1
      min_max_sum_error: 1.0
      lookahead_dist: 0.8
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.5
      use_interpolation: false
      use_rotate_to_heading: true
      use_rotate_to_heading_threshold: 0.1
      min_approach_linear_velocity: 0.5
      approach_velocity_scaling_dist: 1.0
      v_linear_min: -2.5
      v_linear_max: 2.5
      v_angular_min: -3.0
      v_angular_max: 3.0
      a_linear_max: 3.0
      a_angular_max: 6.0
      brake_margin: 0.15
      brake_accel: 0.8
      lateral_error_gain: 1.5
      lateral_error_max: 0.3
      enable_curvature_ff: false
      a_lim_x: 1.0
      a_lim_y: 0.6
      a_lateral_max: 3.0
      curvature_forward_dist: 0.7
      curvature_backward_dist: 0.3
      max_velocity_scaling_factor_rate: 0.9
      kv_ff: 0.4
      goal_dist_scale: 1.0
      wheel_base: 0.62326
      track_width: 0.7
      wheel_speed_max: -1.0
      loc_uncertainty_enable: true
      loc_timeout_sec: 0.2
      loc_k_v: 50.0
      loc_k_w: 20.0
      loc_v_scale_min: 0.2
      loc_w_scale_min: 0.3
      lhi_yellow_v_scale: 0.8
      lhi_yellow_w_scale: 0.8
      lhi_orange_v_scale: 0.5
      lhi_orange_w_scale: 0.6
      lhi_orange_vy_scale: 0.5
      lhi_red_stop_enable: true
      degraded_v_scale: 0.3
      degraded_w_scale: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 20.0
      publish_frequency: 10.0
      global_frame: test_odom
      robot_base_frame: test_base_link
      rolling_window: true
      width: 7
      height: 7
      resolution: 0.1
      footprint: "[[0.4, 0.4], [0.4, -0.4], [-0.4, -0.4], [-0.4, 0.4]]"
      plugins: ["inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.55
