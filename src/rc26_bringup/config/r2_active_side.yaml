# R2 当前比赛方配置选择文件。
# active_side 控制 bringup 默认加载 r2_red.yaml 或 r2_blue.yaml。
# 如需临时调试其它完整配置，仍可通过 runtime_config_file:=/abs/path.yaml 覆盖。
active_side: red
preselection_mode: first
first_preselection_mc_repeat_enable: true
first_preselection_mc_repeat_max_count: 2
first_preselection_mc_repeat_forward_x_step_m:
  red: 0.2
  blue: -0.2
runtime_configs:
  red: "r2_red.yaml"
  blue: "r2_blue.yaml"
