# src Nav2 参数配置

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: control_state
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 30.0
    odom_topic: control_state
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["NMPCFollowPath", "FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # 定位感知 NMPC 控制器（P3）
    NMPCFollowPath:
      plugin: "rc26_nmpc_controller::NmpcController"
      solver_time_limit_ms: 3.0
      solver_timeout_cycles: 2
      fallback_recover_cycles: 6
      fallback_min_hold_sec: 0.5
      use_osqp: true
      fallback_controller_id: "FollowPath"
      w_ref_vx: 8.0
      w_ref_vy: 8.0
      w_ref_wz: 6.0
      w_smooth_vx: 2.0
      w_smooth_vy: 2.0
      w_smooth_wz: 1.5
      vx_min: -2.5
      vx_max: 2.5
      vy_min: -2.5
      vy_max: 2.5
      wz_min: -3.0
      wz_max: 3.0
      ax_max: 3.0
      ay_max: 3.0
      aw_max: 6.0
      lhi_yellow_scale: 0.8
      lhi_orange_scale: 0.5
      degraded_scale: 0.3
      backend_not_ready_scale: 0.7
      backend_stale_scale: 0.7
      backend_graph_health_ref: 0.7
      backend_graph_health_min_scale: 0.4
      jump_suppressed_scale: 0.6
      imu_spike_scale: 0.6
      min_quality_scale: 0.08
      health_timeout_sec: 0.25
      backend_timeout_sec: 0.5
      control_state_timeout_sec: 0.25
      handover_a_lin: 2.2
      handover_a_ang: 4.0
      profile_orange: "loc_orange"
      profile_red: "loc_red_hold"

    # 使用自定义全向 PID 控制器 (移植自 pb2025)，作为 NMPC 回退目标保留
    FollowPath:
      plugin: "rc26_omni_controller::OmniPidPursuitController"
      translation_kp: 3.0
      translation_ki: 0.1
      translation_kd: 0.3
      enable_rotation: true
      rotation_kp: 3.0
      rotation_ki: 0.1
      rotation_kd: 0.3
      transform_tolerance: 0.1
      min_max_sum_error: 1.0
      lookahead_dist: 0.8
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.5
      use_interpolation: false
      use_rotate_to_heading: true
      use_rotate_to_heading_threshold: 0.1
      min_approach_linear_velocity: 0.5
      approach_velocity_scaling_dist: 1.0
      v_linear_min: -2.5
      v_linear_max: 2.5
      v_angular_min: -3.0
      v_angular_max: 3.0
      a_linear_max: 3.0
      a_angular_max: 6.0
      brake_margin: 0.15
      brake_accel: 0.8
      lateral_error_gain: 1.5
      lateral_error_max: 0.3
      enable_curvature_ff: false
      a_lim_x: 1.0
      a_lim_y: 0.6
      a_lateral_max: 3.0
      curvature_forward_dist: 0.7
      curvature_backward_dist: 0.3
      max_velocity_scaling_factor_rate: 0.9
      kv_ff: 0.4
      goal_dist_scale: 1.0
      wheel_base: 0.62326
      track_width: 0.7
      wheel_speed_max: -1.0
      loc_uncertainty_enable: true
      loc_timeout_sec: 0.2
      loc_k_v: 50.0
      loc_k_w: 20.0
      loc_v_scale_min: 0.2
      loc_w_scale_min: 0.3
      lhi_yellow_v_scale: 0.8
      lhi_yellow_w_scale: 0.8
      lhi_orange_v_scale: 0.5
      lhi_orange_w_scale: 0.6
      lhi_orange_vy_scale: 0.5
      lhi_red_stop_enable: true
      degraded_v_scale: 0.3
      degraded_w_scale: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 20.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 7
      height: 7
      resolution: 0.1
      footprint: "[[0.4, 0.4], [0.4, -0.4], [-0.4, -0.4], [-0.4, 0.4]]"
      plugins: ["obstacle_layer", "drop_layer", "inflation_layer"]
      filters: ["keepout_filter"]

      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: terrain_obs
        terrain_obs:
          topic: terrain_obstacles
          data_type: "PointCloud2"
          marking: true
          clearing: false
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0

      drop_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: terrain_drop
        terrain_drop:
          topic: terrain_drop
          data_type: "PointCloud2"
          marking: true
          clearing: false
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.4, 0.4], [0.4, -0.4], [-0.4, -0.4], [-0.4, 0.4]]"
      resolution: 0.1
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      filters: ["keepout_filter"]

      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: control_state
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
