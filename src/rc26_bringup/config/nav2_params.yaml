# R2 当前 Nav2 最小导航闭环配置
# 口径说明：
# - map -> odom 继续由 rc26_localization 负责，Nav2 不接管定位权威
# - 当前 local/global costmap 加载 obstacle_layer 与 inflation_layer；sensor_scan 进入 Nav2 costmap
# - /cmd_vel 由 Nav2 controller + velocity_smoother 输出；默认由 rc26_mcu_transport 消费并下发 POSE_TARGET

# BT 导航器：负责调 planner / controller / recovery 等动作节点
bt_navigator: # BT 导航器节点参数组
  ros__parameters: # BT 导航器 ROS 参数集合
    # Nav2 全局工作坐标系；应与 rc26_localization 的 map TF 一致
    use_sim_time: false # 是否使用仿真时间；实车使用系统时间
    global_frame: map # Nav2 全局参考坐标系
    robot_base_frame: base_footprint # Nav2 使用的机器人 2D 基座坐标系
    # BT 导航器内部用于监听当前机体速度与位姿的 odom 话题
    odom_topic: /odom # BT 导航器读取里程计的话题
    # 行为树 tick 周期（毫秒）
    bt_loop_duration: 10 # Nav2 行为树循环周期，单位毫秒
    # 单次 action/service 默认等待时间（秒）
    default_server_timeout: 20 # BT 节点等待 action/service 的默认超时，单位秒
    # 等待下游服务就绪的超时时间（毫秒）
    wait_for_service_timeout: 1000 # BT 插件等待服务可用的超时，单位毫秒
    # 当前启用的 BT 插件全集；保持 Nav2 Humble 默认主链即可
    plugin_lib_names: # bt_navigator 可加载的 BehaviorTree.CPP 插件库列表
      - nav2_compute_path_to_pose_action_bt_node # 单目标全局路径规划 BT action 节点
      - nav2_compute_path_through_poses_action_bt_node # 多目标全局路径规划 BT action 节点
      - nav2_smooth_path_action_bt_node # 路径平滑 BT action 节点
      - nav2_follow_path_action_bt_node # 局部控制跟随路径 BT action 节点
      - nav2_spin_action_bt_node # 原地旋转恢复 BT action 节点
      - nav2_wait_action_bt_node # 等待恢复 BT action 节点
      - nav2_assisted_teleop_action_bt_node # 辅助遥控 BT action 节点
      - nav2_back_up_action_bt_node # 后退恢复 BT action 节点
      - nav2_drive_on_heading_bt_node # 指定朝向直行 BT action 节点
      - nav2_clear_costmap_service_bt_node # 清空代价地图 BT service 节点
      - nav2_is_stuck_condition_bt_node # 卡住状态判断 BT condition 节点
      - nav2_goal_reached_condition_bt_node # 到达目标判断 BT condition 节点
      - nav2_goal_updated_condition_bt_node # 目标更新判断 BT condition 节点
      - nav2_globally_updated_goal_condition_bt_node # 全局目标更新判断 BT condition 节点
      - nav2_is_path_valid_condition_bt_node # 路径有效性判断 BT condition 节点
      - nav2_initial_pose_received_condition_bt_node # 初始位姿已接收判断 BT condition 节点
      - nav2_reinitialize_global_localization_service_bt_node # 重新初始化全局定位 BT service 节点
      - nav2_rate_controller_bt_node # 行为树频率控制 decorator 节点
      - nav2_distance_controller_bt_node # 行为树距离触发 decorator 节点
      - nav2_speed_controller_bt_node # 行为树速度触发 decorator 节点
      - nav2_truncate_path_action_bt_node # 路径截断 BT action 节点
      - nav2_truncate_path_local_action_bt_node # 局部路径截断 BT action 节点
      - nav2_goal_updater_node_bt_node # 目标动态更新 BT 节点
      - nav2_recovery_node_bt_node # 恢复控制 BT control 节点
      - nav2_pipeline_sequence_bt_node # 流水线顺序 BT control 节点
      - nav2_round_robin_node_bt_node # 轮询恢复 BT control 节点
      - nav2_transform_available_condition_bt_node # TF 可用性判断 BT condition 节点
      - nav2_time_expired_condition_bt_node # 时间过期判断 BT condition 节点
      - nav2_path_expiring_timer_condition # 路径即将过期判断 BT condition 节点
      - nav2_distance_traveled_condition_bt_node # 已行驶距离判断 BT condition 节点
      - nav2_single_trigger_bt_node # 单次触发 decorator 节点
      - nav2_goal_updated_controller_bt_node # 目标更新控制 decorator 节点
      - nav2_is_battery_low_condition_bt_node # 低电量判断 BT condition 节点
      - nav2_navigate_through_poses_action_bt_node # 多目标导航 BT action 节点
      - nav2_navigate_to_pose_action_bt_node # 单目标导航 BT action 节点
      - nav2_remove_passed_goals_action_bt_node # 移除已通过目标 BT action 节点
      - nav2_planner_selector_bt_node # planner 选择 BT 节点
      - nav2_controller_selector_bt_node # controller 选择 BT 节点
      - nav2_goal_checker_selector_bt_node # goal checker 选择 BT 节点
      - nav2_controller_cancel_bt_node # 取消 controller BT 节点
      - nav2_path_longer_on_approach_bt_node # 接近目标时路径变长判断 BT condition 节点
      - nav2_wait_cancel_bt_node # 取消等待恢复 BT 节点
      - nav2_spin_cancel_bt_node # 取消原地旋转恢复 BT 节点
      - nav2_back_up_cancel_bt_node # 取消后退恢复 BT 节点
      - nav2_assisted_teleop_cancel_bt_node # 取消辅助遥控 BT 节点
      - nav2_drive_on_heading_cancel_bt_node # 取消指定朝向直行 BT 节点
      - nav2_is_battery_charging_condition_bt_node # 充电状态判断 BT condition 节点

bt_navigator_navigate_to_pose_rclcpp_node: # NavigateToPose BT action 客户端内部 rclcpp 节点参数组
  ros__parameters: # NavigateToPose 内部节点 ROS 参数集合
    use_sim_time: false # 是否使用仿真时间；实车使用系统时间

bt_navigator_navigate_through_poses_rclcpp_node: # NavigateThroughPoses BT action 客户端内部 rclcpp 节点参数组
  ros__parameters: # NavigateThroughPoses 内部节点 ROS 参数集合
    use_sim_time: false # 是否使用仿真时间；实车使用系统时间

# 局部控制器：默认 FollowPath 仍支持麦克纳姆全向速度；专项 Nav2 BT 可显式选择受限 controller
controller_server: # Nav2 局部控制器服务器参数组
  ros__parameters: # controller_server ROS 参数集合
    use_sim_time: false # 是否使用仿真时间；实车使用系统时间
    # 控制循环频率（Hz）
    controller_frequency: 20.0 # 局部控制器主循环频率，单位 Hz
    # 低于阈值的速度分量会被当作 0，避免控制器抖动
    min_x_velocity_threshold: 0.001 # x 方向速度死区阈值，低于该值视为 0
    min_y_velocity_threshold: 0.001 # y 方向速度死区阈值，低于该值视为 0
    min_theta_velocity_threshold: 0.001 # 角速度死区阈值，低于该值视为 0
    # 允许短时间控制失败的容忍窗口（秒）
    failure_tolerance: 0.3 # controller 短暂失败容忍时间，单位秒
    # 进度检查器：防止机器人长时间原地不动
    progress_checker_plugin: progress_checker # Humble 口径的进度检查器插件 ID
    # 到点判定器：控制“算到达”的位置与朝向阈值
    goal_checker_plugins: [general_goal_checker, mc_xy_goal_checker] # 可用 goal checker 插件 ID 列表
    # 默认导航使用 FollowPath；MC / MF 入口等专项树显式选择受限 controller
    controller_plugins: [FollowPath, MCPositiveXYRed, MFPreselectEntryXPositiveYNegative] # 可用局部控制器插件 ID 列表
    progress_checker: # SimpleProgressChecker 插件参数组
      plugin: nav2_controller::SimpleProgressChecker # 使用 Nav2 简单进度检查器插件
      # 指定时间内至少移动这么远，否则判定为无进展
      required_movement_radius: 0.05 # 进度检查要求的最小移动距离，单位米
      movement_time_allowance: 20.0 # 允许无足够进展的最长时间，单位秒
    general_goal_checker: # SimpleGoalChecker 插件参数组
      plugin: nav2_controller::SimpleGoalChecker # 使用 Nav2 简单到点判定插件
      stateful: true # 是否启用有状态到点判定，进入 xy 容差后保持状态
      # 到点位置 / 朝向容差
      xy_goal_tolerance: 0.18 # 目标位置 xy 容差，单位米
      yaw_goal_tolerance: 0.20 # 目标朝向 yaw 容差，单位弧度
    mc_xy_goal_checker: # MC 去程 xy-only 到点判定器
      plugin: nav2_controller::SimpleGoalChecker # 使用 Nav2 简单到点判定插件
      stateful: true # 进入 xy 容差后保持到点状态，由 MC 行为树后续单独转向
      xy_goal_tolerance: 0.18 # 目标位置 xy 容差，单位米
      yaw_goal_tolerance: 6.283185 # 第一阶段忽略 yaw，转向交给后续 RotateInPlace
    FollowPath: # 默认 DWB 局部控制器参数组
      # DWB：当前主运行时的局部速度控制器
      plugin: dwb_core::DWBLocalPlanner # 使用 DWB 局部规划器插件
      debug_trajectory_details: false # 是否输出 DWB 轨迹评分调试细节
      # 麦克纳姆底盘速度边界：x 前后，y 横移，theta 自转
      min_vel_x: -0.25 # x 方向最小采样速度，单位 m/s
      max_vel_x: 0.25 # x 方向最大采样速度，单位 m/s
      min_vel_y: -0.25 # y 方向最小采样速度，单位 m/s
      max_vel_y: 0.25 # y 方向最大采样速度，单位 m/s
      max_vel_theta: 0.5 # 最大角速度采样值，单位 rad/s
      # 速度与加速度上限；velocity_smoother 也会继续做一层平滑
      min_speed_xy: 0.0 # 平面合速度最小值，单位 m/s
      max_speed_xy: 0.50 # 平面合速度最大值，单位 m/s
      min_speed_theta: 0.0 # 角速度绝对值最小值，单位 rad/s
      acc_lim_x: 0.8 # x 方向加速度上限，单位 m/s^2
      acc_lim_y: 0.8 # y 方向加速度上限，单位 m/s^2
      acc_lim_theta: 1.8 # 角加速度上限，单位 rad/s^2
      decel_lim_x: -0.8 # x 方向减速度下限，单位 m/s^2
      decel_lim_y: -0.8 # y 方向减速度下限，单位 m/s^2
      decel_lim_theta: -1.8 # 角减速度下限，单位 rad/s^2
      # 轨迹采样密度：分别在 vx / vy / wz 上离散取样
      vx_samples: 20 # x 方向速度采样数量
      vy_samples: 15 # y 方向速度采样数量
      vtheta_samples: 20 # 角速度采样数量
      # 前向仿真时间越大，绕障更积极，但也更容易保守
      sim_time: 1.7 # DWB 前向轨迹仿真时长，单位秒
      linear_granularity: 0.05 # 轨迹线性采样粒度，单位米
      angular_granularity: 0.025 # 轨迹角度采样粒度，单位弧度
      # TF 允许滞后窗口；过小会更容易报 transform timeout
      transform_tolerance: 0.2 # 控制器 TF 查询容忍时间，单位秒
      xy_goal_tolerance: 0.18 # DWB 到点 xy 容差，单位米
      trans_stopped_velocity: 0.05 # 判定平移已停止的速度阈值，单位 m/s
      short_circuit_trajectory_evaluation: true # 是否在已知不优时提前停止轨迹评分
      stateful: true # DWB 是否启用有状态到点逻辑
      # DWB 评分器：当前以避障、贴路与到点权重为主
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist] # DWB 轨迹评分器列表
      BaseObstacle.scale: 0.02 # 障碍代价评分权重
      PathAlign.scale: 20.0 # 路径朝向对齐评分权重
      PathAlign.forward_point_distance: 0.1 # 路径对齐前视点距离，单位米
      GoalAlign.scale: 16.0 # 目标朝向对齐评分权重
      GoalAlign.forward_point_distance: 0.1 # 目标对齐前视点距离，单位米
      PathDist.scale: 20.0 # 偏离全局路径距离评分权重
      GoalDist.scale: 16.0 # 距离目标评分权重
      RotateToGoal.scale: 24.0 # 到点旋转评分权重
      RotateToGoal.slowing_factor: 5.0 # 到点旋转减速系数
      RotateToGoal.lookahead_time: -1.0 # 到点旋转前视时间；负值表示使用默认/禁用前视
    MCPositiveXYRed: # 红方 MC 正向 xy-only DWB 控制器参数组
      # 红方武馆区 NavToPose 第一阶段专用 DWB：只采样车体系 x/y 正向，角速度保持 0。
      plugin: dwb_core::DWBLocalPlanner # 使用 DWB 局部规划器插件
      debug_trajectory_details: false # 是否输出 DWB 轨迹评分调试细节
      min_vel_x: 0.0 # x 方向最小采样速度，单位 m/s
      max_vel_x: 0.25 # x 方向最大采样速度，单位 m/s
      min_vel_y: 0.0 # y 方向最小采样速度，单位 m/s
      max_vel_y: 0.25 # y 方向最大采样速度，单位 m/s
      max_vel_theta: 0.0 # 第一阶段禁止角速度输出，单位 rad/s
      min_speed_xy: 0.0 # 平面合速度最小值，单位 m/s
      max_speed_xy: 0.50 # 平面合速度最大值，单位 m/s
      min_speed_theta: 0.0 # 角速度绝对值最小值，单位 rad/s
      acc_lim_x: 0.8 # x 方向加速度上限，单位 m/s^2
      acc_lim_y: 0.8 # y 方向加速度上限，单位 m/s^2
      acc_lim_theta: 1.8 # 角加速度上限，单位 rad/s^2
      decel_lim_x: -0.8 # x 方向减速度下限，单位 m/s^2
      decel_lim_y: -0.8 # y 方向减速度下限，单位 m/s^2
      decel_lim_theta: -1.8 # 角减速度下限，单位 rad/s^2
      vx_samples: 20 # x 方向速度采样数量
      vy_samples: 15 # y 方向速度采样数量
      vtheta_samples: 1 # 角速度只采样 0，转向由 MC 行为树下一步完成
      sim_time: 1.7 # DWB 前向轨迹仿真时长，单位秒
      linear_granularity: 0.05 # 轨迹线性采样粒度，单位米
      angular_granularity: 0.025 # 轨迹角度采样粒度，单位弧度
      transform_tolerance: 0.2 # 控制器 TF 查询容忍时间，单位秒
      xy_goal_tolerance: 0.18 # DWB 到点 xy 容差，单位米
      trans_stopped_velocity: 0.05 # 判定平移已停止的速度阈值，单位 m/s
      short_circuit_trajectory_evaluation: true # 是否在已知不优时提前停止轨迹评分
      stateful: true # DWB 是否启用有状态到点逻辑
      critics: [Oscillation, BaseObstacle, PathDist, GoalDist] # xy-only 阶段只评价避障、贴路与到点
      BaseObstacle.scale: 0.02 # 障碍代价评分权重
      PathDist.scale: 20.0 # 偏离全局路径距离评分权重
      GoalDist.scale: 16.0 # 距离目标评分权重
    MFPreselectEntryXPositiveYNegative: # 梅林预选入口 x 正 y 负受限 DWB 控制器参数组
      # 梅林预选 2 号入口 NavToPose 专用 DWB：只采样车体系 x 正向、y 负向和很小角速度。
      plugin: dwb_core::DWBLocalPlanner # 使用 DWB 局部规划器插件
      debug_trajectory_details: false # 是否输出 DWB 轨迹评分调试细节
      min_vel_x: 0.0 # x 方向最小采样速度，单位 m/s
      max_vel_x: 0.25 # x 方向最大采样速度，单位 m/s
      min_vel_y: -0.25 # y 方向最小采样速度，单位 m/s
      max_vel_y: 0.0 # y 方向最大采样速度，单位 m/s
      max_vel_theta: 0.10 # 最大角速度采样值，单位 rad/s
      min_speed_xy: 0.0 # 平面合速度最小值，单位 m/s
      max_speed_xy: 0.35 # 平面合速度最大值，单位 m/s
      min_speed_theta: 0.0 # 角速度绝对值最小值，单位 rad/s
      acc_lim_x: 0.8 # x 方向加速度上限，单位 m/s^2
      acc_lim_y: 0.8 # y 方向加速度上限，单位 m/s^2
      acc_lim_theta: 0.25 # 角加速度上限，单位 rad/s^2
      decel_lim_x: -0.8 # x 方向减速度下限，单位 m/s^2
      decel_lim_y: -0.8 # y 方向减速度下限，单位 m/s^2
      decel_lim_theta: -0.25 # 角减速度下限，单位 rad/s^2
      vx_samples: 20 # x 方向速度采样数量
      vy_samples: 15 # y 方向速度采样数量
      vtheta_samples: 7 # 角速度采样数量
      sim_time: 1.7 # DWB 前向轨迹仿真时长，单位秒
      linear_granularity: 0.05 # 轨迹线性采样粒度，单位米
      angular_granularity: 0.025 # 轨迹角度采样粒度，单位弧度
      transform_tolerance: 0.2 # 控制器 TF 查询容忍时间，单位秒
      xy_goal_tolerance: 0.18 # DWB 到点 xy 容差，单位米
      trans_stopped_velocity: 0.05 # 判定平移已停止的速度阈值，单位 m/s
      short_circuit_trajectory_evaluation: true # 是否在已知不优时提前停止轨迹评分
      stateful: true # DWB 是否启用有状态到点逻辑
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist] # DWB 轨迹评分器列表
      BaseObstacle.scale: 0.02 # 障碍代价评分权重
      PathAlign.scale: 20.0 # 路径朝向对齐评分权重
      PathAlign.forward_point_distance: 0.1 # 路径对齐前视点距离，单位米
      GoalAlign.scale: 16.0 # 目标朝向对齐评分权重
      GoalAlign.forward_point_distance: 0.1 # 目标对齐前视点距离，单位米
      PathDist.scale: 20.0 # 偏离全局路径距离评分权重
      GoalDist.scale: 16.0 # 距离目标评分权重
      RotateToGoal.scale: 24.0 # 到点旋转评分权重
      RotateToGoal.slowing_factor: 5.0 # 到点旋转减速系数
      RotateToGoal.lookahead_time: -1.0 # 到点旋转前视时间；负值表示使用默认/禁用前视

# 局部代价地图：在 odom 坐标系下滚动更新；当前启用动态障碍层和膨胀层
local_costmap: # 局部代价地图顶层参数组
  local_costmap: # local_costmap 生命周期节点参数组
    ros__parameters: # 局部代价地图 ROS 参数集合
      use_sim_time: false # 是否使用仿真时间；实车使用系统时间
      # 局部代价地图固定在 odom；不依赖全局 map 精度
      global_frame: odom # 局部代价地图参考坐标系
      robot_base_frame: base_footprint # 代价地图使用的机器人基座坐标系
      # 更新频率要高于全局图，保证近场避障及时
      update_frequency: 5.0 # 局部代价地图更新频率，单位 Hz
      publish_frequency: 2.0 # 局部代价地图发布频率，单位 Hz
      rolling_window: true # 是否启用随机器人移动的滚动窗口
      # 当前局部窗口大小（米）
      width: 4 # 局部代价地图宽度，单位米
      height: 4 # 局部代价地图高度，单位米
      resolution: 0.05 # 代价地图分辨率，单位米/栅格
      # 当前按圆形机器人近似；若未来切 footprint，再统一调整
      robot_radius: 0.42 # 圆形机器人半径近似，单位米
      plugins: [obstacle_layer, inflation_layer] # 局部代价地图启用的图层插件列表；障碍层后接膨胀层
      obstacle_layer: # 局部障碍层参数组
        plugin: nav2_costmap_2d::ObstacleLayer # 使用 Nav2 2D 障碍层插件
        enabled: true # 是否启用局部障碍层
        # 当前只接一条障碍输入：sensor_scan(PointCloud2)
        observation_sources: sensor_scan # 障碍层观测源名称列表
        sensor_scan: # sensor_scan 点云观测源参数组
          # 相对话题名；会跟随 namespace 进入对应机器人命名空间
          topic: sensor_scan # 障碍输入 PointCloud2 话题名
          # 高于这个高度的点不参与 2D 障碍投影
          max_obstacle_height: 2.0 # 参与障碍投影的最大高度，单位米
          # marking=标记障碍，clearing=按射线清空自由空间
          clearing: true # 是否用该观测源清空自由空间
          marking: true # 是否用该观测源标记障碍
          data_type: PointCloud2 # 观测源消息类型
          # 射线清空范围与障碍标记范围
          raytrace_max_range: 3.0 # 射线清空最大距离，单位米
          raytrace_min_range: 0.0 # 射线清空最小距离，单位米
          obstacle_max_range: 2.5 # 障碍标记最大距离，单位米
          obstacle_min_range: 0.0 # 障碍标记最小距离，单位米
      inflation_layer: # 局部膨胀层参数组
        plugin: nav2_costmap_2d::InflationLayer # 使用 Nav2 2D 膨胀层插件
        enabled: true # 是否启用局部膨胀层
        inflation_radius: 0.55 # 障碍物膨胀半径，单位米
        cost_scaling_factor: 3.0 # 膨胀代价随距离衰减的系数
      always_send_full_costmap: true # 是否每次发布完整代价地图

# 全局代价地图：在 map 坐标系下维护静态地图；当前启用动态障碍层和膨胀层
global_costmap: # 全局代价地图顶层参数组
  global_costmap: # global_costmap 生命周期节点参数组
    ros__parameters: # 全局代价地图 ROS 参数集合
      use_sim_time: false # 是否使用仿真时间；实车使用系统时间
      global_frame: map # 全局代价地图参考坐标系
      robot_base_frame: base_footprint # 代价地图使用的机器人基座坐标系
      # 全局图更新较慢，重点服务 planner
      update_frequency: 1.0 # 全局代价地图更新频率，单位 Hz
      publish_frequency: 1.0 # 全局代价地图发布频率，单位 Hz
      resolution: 0.05 # 全局代价地图分辨率，单位米/栅格
      robot_radius: 0.42 # 圆形机器人半径近似，单位米
      # 当前允许未知区，避免占位图把规划直接锁死
      track_unknown_space: true # 是否保留并追踪 unknown 区域
      plugins: [static_layer, obstacle_layer, inflation_layer] # 全局代价地图启用的图层插件列表；静态/障碍层后接膨胀层
      static_layer: # 静态地图层参数组
        plugin: nav2_costmap_2d::StaticLayer # 使用 Nav2 2D 静态地图层插件
        # 使用 map_server 的静态地图；需订阅保留最后一帧
        map_subscribe_transient_local: true # 是否用 transient local QoS 订阅静态地图
      obstacle_layer: # 全局障碍层参数组
        plugin: nav2_costmap_2d::ObstacleLayer # 使用 Nav2 2D 障碍层插件
        enabled: true # 是否启用全局障碍层
        observation_sources: sensor_scan # 障碍层观测源名称列表
        sensor_scan: # sensor_scan 点云观测源参数组
          topic: sensor_scan # 障碍输入 PointCloud2 话题名
          max_obstacle_height: 2.0 # 参与障碍投影的最大高度，单位米
          clearing: true # 是否用该观测源清空自由空间
          marking: true # 是否用该观测源标记障碍
          data_type: PointCloud2 # 观测源消息类型
          raytrace_max_range: 3.0 # 射线清空最大距离，单位米
          raytrace_min_range: 0.0 # 射线清空最小距离，单位米
          obstacle_max_range: 2.5 # 障碍标记最大距离，单位米
          obstacle_min_range: 0.0 # 障碍标记最小距离，单位米
      inflation_layer: # 全局膨胀层参数组
        plugin: nav2_costmap_2d::InflationLayer # 使用 Nav2 2D 膨胀层插件
        enabled: true # 是否启用全局膨胀层
        inflation_radius: 0.55 # 障碍物膨胀半径，单位米
        cost_scaling_factor: 3.0 # 膨胀代价随距离衰减的系数
      always_send_full_costmap: true # 是否每次发布完整代价地图

# 地图服务：当前可接受占位地图，只用于拉起 Nav2 生命周期与 costmap 链路
map_server: # Nav2 map_server 参数组
  ros__parameters: # map_server ROS 参数集合
    use_sim_time: false # 是否使用仿真时间；实车使用系统时间
    yaml_filename: "" # 静态地图 YAML 路径；由 launch/r2_runtime 注入

# 全局规划器：当前使用 NavFn，输出从当前位置到目标位姿的全局路径
planner_server: # Nav2 全局规划器服务器参数组
  ros__parameters: # planner_server ROS 参数集合
    use_sim_time: false # 是否使用仿真时间；实车使用系统时间
    # 期望规划频率（Hz）
    expected_planner_frequency: 10.0 # planner 期望运行频率，单位 Hz
    planner_plugins: [GridBased] # 可用全局规划器插件 ID 列表
    GridBased: # NavFn 全局规划器参数组
      plugin: nav2_navfn_planner/NavfnPlanner # 使用 NavFn 全局规划器插件
      # 距目标附近允许的终点松弛半径
      tolerance: 0.05 # 目标附近可接受的规划终点松弛距离，单位米
      # 当前继续用 Dijkstra；若要更激进可改 A*
      use_astar: false # 是否使用 A*；false 表示使用 Dijkstra
      # 允许穿过 unknown 区做规划，便于占位图和局部障碍链联调
      allow_unknown: true # 是否允许在 unknown 栅格中规划

# 路径平滑器：对 planner 原始路径做轻量后处理
smoother_server: # Nav2 路径平滑器服务器参数组
  ros__parameters: # smoother_server ROS 参数集合
    use_sim_time: false # 是否使用仿真时间；实车使用系统时间
    smoother_plugins: [simple_smoother] # 可用路径平滑器插件 ID 列表
    simple_smoother: # SimpleSmoother 参数组
      plugin: nav2_smoother::SimpleSmoother # 使用 Nav2 简单路径平滑器插件
      tolerance: 1.0e-10 # 平滑迭代收敛容差
      max_its: 1000 # 平滑最大迭代次数
      do_refinement: true # 是否执行额外路径细化

# 恢复行为服务器：局部控制失败时的原地转、后退、等待等动作
behavior_server: # Nav2 恢复行为服务器参数组
  ros__parameters: # behavior_server ROS 参数集合
    use_sim_time: false # 是否使用仿真时间；实车使用系统时间
    costmap_topic: local_costmap/costmap_raw # 恢复行为读取的局部代价地图话题
    footprint_topic: local_costmap/published_footprint # 恢复行为读取的机器人 footprint 话题
    cycle_frequency: 10.0 # 恢复行为服务器循环频率，单位 Hz
    behavior_plugins: [spin, backup, drive_on_heading, wait] # 可用恢复行为插件 ID 列表
    spin: # 原地旋转恢复行为参数组
      plugin: nav2_behaviors/Spin # 使用 Nav2 原地旋转恢复插件
    backup: # 后退恢复行为参数组
      plugin: nav2_behaviors/BackUp # 使用 Nav2 后退恢复插件
    drive_on_heading: # 指定朝向直行恢复行为参数组
      plugin: nav2_behaviors/DriveOnHeading # 使用 Nav2 指定朝向直行恢复插件
    wait: # 等待恢复行为参数组
      plugin: nav2_behaviors/Wait # 使用 Nav2 等待恢复插件
    global_frame: odom # 恢复行为使用的全局参考坐标系
    robot_base_frame: base_footprint # 恢复行为使用的机器人基座坐标系
    transform_tolerance: 0.1 # 恢复行为 TF 查询容忍时间，单位秒
    simulate_ahead_time: 2.0 # 恢复行为碰撞前向仿真时间，单位秒
    max_rotational_vel: 1.0 # 恢复行为最大旋转角速度，单位 rad/s
    min_rotational_vel: 0.25 # 恢复行为最小旋转角速度，单位 rad/s
    rotational_acc_lim: 1.8 # 恢复行为旋转角加速度上限，单位 rad/s^2

# 路点跟随：当前保留默认 wait_at_waypoint，用于多点任务扩展
waypoint_follower: # Nav2 路点跟随服务器参数组
  ros__parameters: # waypoint_follower ROS 参数集合
    use_sim_time: false # 是否使用仿真时间；实车使用系统时间
    loop_rate: 20 # 路点跟随循环频率，单位 Hz
    stop_on_failure: false # 单个路点失败时是否停止整个路点任务
    waypoint_task_executor_plugin: wait_at_waypoint # 路点到达后执行的任务插件 ID
    wait_at_waypoint: # 路点等待任务插件参数组
      plugin: nav2_waypoint_follower::WaitAtWaypoint # 使用到点等待插件
      enabled: true # 是否启用到点等待任务
      waypoint_pause_duration: 200 # 每个路点等待时长，单位毫秒

# 速度平滑器：在 controller_server 输出之后再做一层限速 / 限加速度
velocity_smoother: # Nav2 速度平滑器参数组
  ros__parameters: # velocity_smoother ROS 参数集合
    use_sim_time: false # 是否使用仿真时间；实车使用系统时间
    # 平滑频率要与 controller 频率接近，避免输出台阶感过重
    smoothing_frequency: 20.0 # 速度平滑输出频率，单位 Hz
    scale_velocities: false # 是否按比例缩放各速度分量以满足限制
    # 当前按开环模式工作，依赖 odom 仅做时间窗口观测
    feedback: OPEN_LOOP # 速度平滑反馈模式；OPEN_LOOP 表示不闭环追踪实际速度
    # 与 DWB 速度边界保持兼容，避免前后两级限幅打架
    max_velocity: [0.45, 0.25, 0.5] # 平滑器最大速度 [vx, vy, wz]
    min_velocity: [-0.25, -0.25, -0.5] # 平滑器最小速度 [vx, vy, wz]
    max_accel: [0.8, 0.35, 0.8] # 平滑器最大加速度 [ax, ay, aw]
    max_decel: [-0.8, -0.35, -0.8] # 平滑器最大减速度 [ax, ay, aw]
    odom_topic: odom # 速度平滑器读取里程计的话题
    odom_duration: 0.1 # 里程计速度观测时间窗口，单位秒
    deadband_velocity: [0.0, 0.0, 0.0] # 速度死区 [vx, vy, wz]
    # 超时后输出归零，避免 controller 掉线后继续沿用旧命令
    velocity_timeout: 1.0 # 未收到新速度命令后的归零超时，单位秒
