# 定位验证 overlay（S3/S4）
# 仅覆盖验证阶段参数，不改比赛默认 localization.yaml
localization:
  ros__parameters:
    # 参数说明：enable_graph_backend - 布尔开关；控制对应能力是否启用。
    enable_graph_backend: true
    # 参数说明：sc_max_radius - 几何距离参数，单位通常为米。
    sc_max_radius: 15.0
    # 参数说明：sc_submap_radius - 几何距离参数，单位通常为米。
    sc_submap_radius: 8.0
    sc_grid_resolution: 0.75
    sc_topk: 8
    # 参数说明：sc_sim_threshold - 阈值；用于判断状态切换、风险等级或过滤条件。
    sc_sim_threshold: 0.15
    sc_min_points_per_submap: 60
