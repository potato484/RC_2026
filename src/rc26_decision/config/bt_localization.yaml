version: "2026-03-15"
locale: "zh-CN"

node_types:
  ACTION:
    summary: "动作节点会真正下发一个操作，比如导航、抓取、切换模式。"
    scenario: "适合查看机器人当前正在做什么具体动作。"
    attention: "动作节点长时间停在运行中，通常要结合事件时间线和黑板键一起看。"
  CONDITION:
    summary: "条件节点只负责判断当前条件是否成立，不直接驱动机器人运动。"
    scenario: "常用于判断定位是否健康、目标是否可见、是否到达退出条件。"
    attention: "条件失败不一定是故障，也可能只是流程在等待前置条件满足。"
  CONTROL:
    summary: "控制节点负责组织执行顺序，比如顺序执行、择优选择、循环重试。"
    scenario: "当运维想知道流程为什么跳转时，先看控制节点。"
    attention: "控制节点本身通常不执行底层动作，重点看它当前选中了哪个子节点。"
  DECORATOR:
    summary: "装饰器节点会包住一个子节点，对其结果做限制、反转或重复。"
    scenario: "适合解释为什么同一个动作会被重试、反转，或被强制改写返回值。"
    attention: "装饰器看起来像动作，但它真正改变的是执行规则。"
  SUBTREE:
    summary: "子树节点用于切换到另一段流程，相当于进入一个独立任务模块。"
    scenario: "主树切到某个区域任务时，通常会先经过子树节点。"
    attention: "看到子树切换时，要同时关注当前活跃子树和子树内部首个运行节点。"

registrations:
  Sequence:
    display_name: "顺序执行"
    tooltip: "按顺序逐个执行，前一个成功才会继续下一个。"
    summary: "这类节点要求子节点按固定顺序完成。"
    scenario: "例如先取矛头，再等待手动机器人，再组装武器。"
    attention: "前面任一节点失败，后面的节点都不会启动。"
  ReactiveFallback:
    display_name: "抢占回退"
    tooltip: "优先检查前面的保护分支，失败时再执行主任务。"
    summary: "常用于守护逻辑，保护分支一旦满足就能立即打断主任务。"
    scenario: "定位守护树会先判断是否需要恢复，再决定是否放行区域任务。"
    attention: "如果这个节点频繁切换，通常说明守护条件在反复波动。"
  Fallback:
    display_name: "备选分支"
    tooltip: "从前往后尝试，直到某个分支成功。"
    summary: "用于提供多个备选方案。"
    scenario: "例如先尝试继续跟随 R1，不行再退回备用动作。"
    attention: "要重点看第一个失败分支的原因，不要只看最终成功分支。"
  RetryUntilSuccessful:
    display_name: "重试直到成功"
    tooltip: "同一段流程会重复尝试，直到成功或次数耗尽。"
    summary: "用于处理短时等待、瞬时失败、对方尚未就位等情况。"
    scenario: "等待手动机器人让路、等待状态就绪时常见。"
    attention: "如果一直重试，通常要检查被重试节点关联的黑板键是否长期不变。"
  KeepRunningUntilFailure:
    display_name: "持续运行直到失败"
    tooltip: "循环执行主体，直到退出条件触发。"
    summary: "适合扫描-决策-执行的循环任务。"
    scenario: "梅林区域会持续扫描并决定下一步抓取或移动。"
    attention: "如果迟迟不退出，优先检查退出条件和当前决策输出。"
  Inverter:
    display_name: "结果反转"
    tooltip: "把成功变失败，把失败变成功。"
    summary: "常用于把“阻塞”为真改成“可继续”为真。"
    scenario: "例如检测 R1 是否挡路时，会先判断阻塞，再反转含义。"
    attention: "看结果时要记住这是反转后的语义。"
  ForceFailure:
    display_name: "强制失败"
    tooltip: "不管子节点结果如何，最终都按失败返回。"
    summary: "用于让上层继续尝试下一条分支。"
    scenario: "定位档位切换完成后，仍让主任务继续往下走。"
    attention: "看到失败不一定是真失败，可能只是流程设计如此。"
  Delay:
    display_name: "延时等待"
    tooltip: "暂停一小段时间，再继续执行。"
    summary: "用于给下游模块留出缓冲时间。"
    scenario: "切换导航模式或退后避让后，经常会加一个短延时。"
    attention: "延时过长会拉高任务耗时，延时过短则可能等不到状态稳定。"
  Script:
    display_name: "脚本赋值"
    tooltip: "直接读写黑板键，用于快速设置流程变量。"
    summary: "常见于初始化默认值、同步上一轮决策结果。"
    scenario: "进入梅林任务前一次性初始化格子编号和目标数量。"
    attention: "脚本节点修改的是黑板值，不会直接显示成动作结果。"
  ScriptCondition:
    display_name: "脚本条件"
    tooltip: "通过简单表达式判断是否进入某条分支。"
    summary: "常用于根据黑板变量选择下一步。"
    scenario: "例如判断 next_action 是 GRAB 还是 MOVE。"
    attention: "表达式依赖的黑板值一旦写错，分支就会一直走偏。"
  AlwaysSuccess:
    display_name: "恒成功"
    tooltip: "无论内部如何，最终都按成功返回。"
    summary: "主要用来占位或配合装饰器控制流程。"
    scenario: "在强制失败或兜底分支中经常会看到。"
    attention: "它本身不代表任务真的完成了，只是流程控制工具。"
  SubTree:
    display_name: "子树调用"
    tooltip: "切换进入另一棵任务树执行。"
    summary: "是主树切换区域任务的入口。"
    scenario: "主流程依次进入武馆、梅林和对抗区域任务。"
    attention: "子树节点常常只是入口，真正卡点要看子树内部运行节点。"

custom_types:
  GrabTip:
    display_name: "抓取矛头"
    tooltip: "控制机构去抓取武馆区的矛头。"
    summary: "这是武馆阶段的第一步，用来把矛头取到机构上。"
    scenario: "开局进入武馆区后，通常会先执行这个动作。"
    attention: "如果反复失败，先检查机构通信、矛头状态和 `mechanism_tip_state`。"
    related_blackboard_keys: ["mechanism_tip_state", "mechanism_comm_health_level", "last_action_error_code"]
  AssembleWeapon:
    display_name: "组装武器"
    tooltip: "在手动机器人到位后执行组装动作。"
    summary: "武馆阶段的核心动作，需要配合手动机器人完成组装。"
    scenario: "当 `CheckManualRobot` 判断对方已经稳定就位后触发。"
    attention: "该动作前如果等待过久，要看手动机器人是否真的静止。"
    related_blackboard_keys: ["mechanism_tip_state", "last_action_error_code"]
  CheckManualRobot:
    display_name: "检查手动机器人"
    tooltip: "判断手动机器人是否已经靠近并稳定停住。"
    summary: "用来避免手动机器人尚未就位时就开始组装。"
    scenario: "常出现在组装动作之前。"
    attention: "如果长期失败，先检查里程计和距离阈值是否合理。"
  StairClimb:
    display_name: "上楼梯"
    tooltip: "执行上台阶动作。"
    summary: "用于机器人从平地进入更高的平台。"
    scenario: "梅林区域入口或转场时可能会用到。"
    attention: "要同时观察 `current_level`、`stair_delta` 和底盘稳定状态。"
    related_blackboard_keys: ["current_level", "stair_delta", "base_ground_stable", "stair_climb_done"]
  StairDescend:
    display_name: "下楼梯"
    tooltip: "执行下台阶动作。"
    summary: "用于机器人从高平台回到地面。"
    scenario: "梅林区域离场时会执行这个动作。"
    attention: "下楼梯后要确认 `stair_descend_done` 和地面稳定状态。"
    related_blackboard_keys: ["current_level", "stair_delta", "base_ground_stable", "stair_descend_done"]
  GrabKFS:
    display_name: "抓取 KFS"
    tooltip: "控制机构抓取当前目标格中的 KFS。"
    summary: "梅林循环中的关键动作，直接影响任务收益。"
    scenario: "当 `SelectNextGrid` 选择 GRAB 时进入。"
    attention: "若连续失败，要检查当前格子、机构状态和地图更新结果。"
    related_blackboard_keys: ["current_grid", "target_grid", "kfs_on_board", "last_action_error_code"]
  SetNavMode:
    display_name: "切换导航档位"
    tooltip: "切换当前导航策略档位，例如安全、穿越或红档停车。"
    summary: "用于在不同风险环境下切换底盘运动策略。"
    scenario: "进入狭窄区域、定位退化、准备离场时都会切档。"
    attention: "档位频繁来回切，通常要看 `loc_recommended_profile` 是否抖动。"
    related_blackboard_keys: ["loc_recommended_profile", "loc_last_profile", "loc_guard_required"]
  ScanSurroundings:
    display_name: "扫描周围环境"
    tooltip: "更新周围格子和目标信息。"
    summary: "梅林循环中的信息刷新动作。"
    scenario: "每次决定下一步前，都会先扫描一轮。"
    attention: "如果扫描后的决策总是不合理，要检查感知输入是否过旧。"
    related_blackboard_keys: ["current_grid", "merlin_last_transition_reason"]
  SelectNextGrid:
    display_name: "选择下一格动作"
    tooltip: "根据当前地图状态决定下一步去抓还是移动。"
    summary: "这是梅林任务的决策节点，会产出 `next_action` 和 `target_grid`。"
    scenario: "扫描完成后，系统会根据当前格子和目标数量算出下一步。"
    attention: "看这个节点时，不要只看状态，还要看输出黑板值是否符合预期。"
    related_blackboard_keys: ["current_grid", "next_action", "target_grid", "target_kfs_count", "kfs_on_board"]
  CheckExitCondition:
    display_name: "检查退出条件"
    tooltip: "判断梅林循环是否该结束。"
    summary: "用于决定当前是否应从循环切到离场阶段。"
    scenario: "达到目标数量、没有收益或时间不够时会退出。"
    attention: "如果一直不退出，优先核对 `target_kfs_count` 和当前进度。"
    related_blackboard_keys: ["target_kfs_count", "kfs_on_board", "exit_grid"]
  CheckR1Blocking:
    display_name: "检查 R1 是否挡路"
    tooltip: "判断前方是否被手动机器人占住。"
    summary: "用于进门阶段的让路判断。"
    scenario: "进入梅林区域前，经常要等 R1 先让出入口。"
    attention: "这里常与反转节点配合使用，注意结果语义已经被反转。"
  IncrementKFSCount:
    display_name: "累加 KFS 数量"
    tooltip: "抓取成功后，把车上 KFS 数量加一。"
    summary: "用于同步任务进度。"
    scenario: "抓取动作成功后立刻执行。"
    attention: "如果数量不涨，通常是前一步没有真的成功。"
    related_blackboard_keys: ["kfs_on_board", "target_kfs_count"]
  UpdateMapKFS:
    display_name: "更新地图中的 KFS 状态"
    tooltip: "把当前目标格子的 KFS 状态写回地图。"
    summary: "避免后续决策再次去同一个已经抓空的格子。"
    scenario: "每次抓取或确认空格后都应该更新。"
    attention: "地图没更新会导致后续决策重复绕圈。"
    related_blackboard_keys: ["target_grid", "merlin_last_transition_reason"]
  NavToMerlinGrid:
    display_name: "导航到梅林格子"
    tooltip: "把机器人导航到目标格子中心。"
    summary: "这是梅林区域的标准移动动作。"
    scenario: "当系统决定去新格子抓取或转移时执行。"
    attention: "长时间运行中，要同时看导航档位、定位等级和目标格编号。"
    related_blackboard_keys: ["target_grid", "current_grid", "loc_recommended_profile"]
  FollowManualRobot:
    display_name: "跟随手动机器人"
    tooltip: "对抗区跟随 R1 保持编队距离。"
    summary: "用于对抗区的跟随动作。"
    scenario: "进入对抗区后，先跟随 R1 接近目标区域。"
    attention: "如果突然失败，要同时检查丢失超时和导航状态。"
  MechUpDuel:
    display_name: "机构抬起到对抗位"
    tooltip: "把机构切换到对抗放置姿态。"
    summary: "放置 KFS 前的准备动作。"
    scenario: "进入放置序列后先执行。"
    attention: "若失败要看机构通信和错误码。"
    related_blackboard_keys: ["mechanism_comm_health_level", "last_action_error_code"]
  PlaceKFSGrid:
    display_name: "放置 KFS 到格点"
    tooltip: "把携带的 KFS 放到目标格点。"
    summary: "对抗区的关键收益动作。"
    scenario: "机构抬起后执行放置。"
    attention: "放置失败时优先检查格点参数、机构状态和误差。"
    related_blackboard_keys: ["kfs_on_board", "last_action_error_code"]
  NavToSmartPoint:
    display_name: "导航到语义点"
    tooltip: "按语义点名称找到预设点位并导航过去。"
    summary: "用于入口点、退后点、离场点等固定关键位置。"
    scenario: "进门、退避和离场时都会用这个动作。"
    attention: "如果失败，先检查点位名是否存在、导航器是否就绪。"
    related_blackboard_keys: ["loc_recommended_profile", "loc_level"]
  CheckLocalizationHealth:
    display_name: "检查定位健康"
    tooltip: "根据定位等级和风险决定是否进入守护恢复。"
    summary: "定位守护的入口判断节点。"
    scenario: "定位变差、图优化掉线、风险增大时会触发。"
    attention: "这个节点成功不代表任务完成，而是表示要进入守护恢复。"
    related_blackboard_keys: ["loc_level", "loc_reason", "loc_recommended_profile", "loc_guard_required", "loc_guard_reason"]
  LocalizationObserveSpin:
    display_name: "原地观测恢复"
    tooltip: "通过原地转动观察环境，尝试恢复定位。"
    summary: "这是定位守护里的第一步恢复动作。"
    scenario: "定位退化但还不至于完全失去参考时优先使用。"
    attention: "若多次无效，通常会继续尝试锚点恢复。"
    related_blackboard_keys: ["loc_level", "loc_reason", "loc_guard_reason"]
  LocalizationAnchorRecover:
    display_name: "锚点恢复定位"
    tooltip: "按预设恢复点依次尝试，帮助定位回稳。"
    summary: "当原地观测还不够时，会导航到恢复锚点。"
    scenario: "定位风险较高或持续不恢复时使用。"
    attention: "如果恢复点列表为空或点位失效，这个节点会直接失败。"
    related_blackboard_keys: ["loc_level", "loc_reason", "loc_guard_reason"]
  VisionStart:
    display_name: "启动视觉"
    tooltip: "打开视觉推理并可选切换模型。"
    summary: "用于需要识别目标前的视觉准备。"
    scenario: "任务切到感知阶段前先启动视觉。"
    attention: "启动失败通常与模型 ID、推理服务状态有关。"
    related_blackboard_keys: ["vision_running", "vision_ok", "vision_current_model"]
  VisionStop:
    display_name: "停止视觉"
    tooltip: "关闭视觉推理，释放算力。"
    summary: "用于结束感知任务或节省资源。"
    scenario: "一段识别任务结束后使用。"
    attention: "停止后相关目标状态会失效，不要继续依赖旧结果。"
    related_blackboard_keys: ["vision_running", "vision_ok"]
  VisionSetModel:
    display_name: "切换视觉模型"
    tooltip: "切换当前使用的识别模型。"
    summary: "适用于不同目标或不同场景切换模型。"
    scenario: "要识别新的目标类型时使用。"
    attention: "模型切换失败时，后续识别可能直接不可用。"
    related_blackboard_keys: ["vision_current_model", "vision_ok"]
  WaitVisionTarget:
    display_name: "等待视觉目标"
    tooltip: "持续等待目标出现，并检查距离和属性。"
    summary: "用于等待相机真正看到目标。"
    scenario: "识别对抗目标或特定标记时常见。"
    attention: "如果超时失败，先看视觉是否启动、模型是否正确、距离阈值是否过严。"
    related_blackboard_keys: ["vision_running", "vision_ok", "vision_has_target", "vision_distance_m", "vision_attr_kind"]

subtrees:
  MainTree:
    display_name: "主任务树"
    summary: "整场任务的总入口，顺序串联武馆、梅林和对抗三个阶段。"
    scenario: "想知道机器人整体处于哪个阶段时，先看这里。"
    attention: "主树只是外层流程，真正卡点要继续看内部活跃子树。"
  GuardedMCAreaTree:
    display_name: "武馆守护任务"
    summary: "武馆任务外面包了一层定位守护，保证定位异常时先恢复。"
    scenario: "武馆阶段如果突然切去恢复，通常就是这里触发。"
    attention: "不要只看武馆动作本身，还要看定位守护是否抢占。"
  MCAreaTree:
    display_name: "武馆主任务"
    summary: "负责取矛头、等待就位、组装武器。"
    scenario: "比赛开局通常先执行这一段。"
    attention: "这里动作不多，但机构和协同依赖强。"
  GuardedMFAreaTree:
    display_name: "梅林守护任务"
    summary: "梅林任务外层包定位守护，用于防止导航过程中定位失控。"
    scenario: "梅林循环中被打断，多半是这层守护触发。"
    attention: "看起来像“无故退出循环”时，优先检查定位守护分支。"
  MFAreaTree:
    display_name: "梅林主任务"
    summary: "负责进门、扫描决策、抓取 KFS、最终离场。"
    scenario: "这是当前项目里流程最长的一段任务树。"
    attention: "排障时要分清现在是在进门、循环还是离场。"
  MF_Entry:
    display_name: "梅林进门阶段"
    summary: "进入梅林区域并等待入口让路。"
    scenario: "起始几步导航都在这里。"
    attention: "入口堵塞通常与 R1 让路逻辑有关。"
  MF_Loop:
    display_name: "梅林循环阶段"
    summary: "持续扫描、决策、抓取或移动，直到满足退出条件。"
    scenario: "大部分梅林任务时间都消耗在这里。"
    attention: "循环异常通常要结合 `next_action`、`target_grid` 一起看。"
  GrabKFSSeq:
    display_name: "抓取 KFS 子流程"
    summary: "导航到目标格、抓取并更新地图。"
    scenario: "当决策结果是 GRAB 时进入。"
    attention: "动作链较长，失败时要看具体停在导航、抓取还是地图更新。"
  MoveToGridSeq:
    display_name: "移动到下一格子流程"
    summary: "只执行转移，不抓取。"
    scenario: "当当前格没有收益，但更优目标在别处时进入。"
    attention: "如果来回移动却不抓，通常是决策条件有问题。"
  MF_Exit:
    display_name: "梅林离场阶段"
    summary: "完成采集后退出梅林区域并下楼梯。"
    scenario: "达到目标数量或判断该离场时进入。"
    attention: "离场慢通常是导航档位或楼梯状态问题。"
  GuardedCombatAreaTree:
    display_name: "对抗守护任务"
    summary: "对抗区任务外层同样带定位守护。"
    scenario: "跟随或放置中出现定位风险时会切到守护恢复。"
    attention: "对抗区动作快，守护触发时要及时看事件时间线。"
  CombatAreaTree:
    display_name: "对抗主任务"
    summary: "负责跟随手动机器人并完成放置。"
    scenario: "比赛后段通常执行这一段。"
    attention: "对抗区节点少，但失败通常与协同和机构两侧同时相关。"
  LocalizationGuardTree:
    display_name: "定位守护树"
    summary: "专门负责在定位风险升高时做恢复或保守切档。"
    scenario: "活跃子树切到这里，说明主任务已被守护逻辑接管。"
    attention: "这里成功不等于主任务成功，只表示恢复动作已结束。"

instances:
  GuardedMCArea:
    display_name: "武馆守护入口"
    summary: "从主树切入武馆守护任务的入口节点。"
    scenario: "主流程切到武馆阶段时会先经过这里。"
    attention: "这里只是子树入口，真正执行点在内部。"
  GuardedMFArea:
    display_name: "梅林守护入口"
    summary: "从主树切入梅林守护任务的入口节点。"
    scenario: "主流程切到梅林阶段时会先经过这里。"
    attention: "这里只是子树入口，真正执行点在内部。"
  GuardedCombatArea:
    display_name: "对抗守护入口"
    summary: "从主树切入对抗守护任务的入口节点。"
    scenario: "主流程切到对抗阶段时会先经过这里。"
    attention: "这里只是子树入口，真正执行点在内部。"
  LocalizationGuard:
    display_name: "定位守护入口"
    summary: "进入定位守护子树的入口节点。"
    scenario: "武馆、梅林、对抗三段任务都可能通过它进入定位守护。"
    attention: "这里只表示进入守护，不代表恢复已经完成。"
  MCAreaTask:
    display_name: "武馆任务入口"
    summary: "通过守护检查后进入武馆主任务。"
    scenario: "定位守护放行后会切到这里。"
    attention: "这里只是入口，继续看内部节点才知道具体动作。"
  MCReactiveFallback:
    display_name: "武馆守护分流"
    summary: "优先判断定位守护，再决定是否放行武馆主任务。"
    scenario: "武馆阶段遇到定位风险时会在这里切走恢复。"
    attention: "这里频繁抖动通常说明定位风险在波动。"
  LocGuardFallback:
    display_name: "定位守护分流"
    summary: "定位守护树的顶层分流节点。"
    scenario: "决定恢复、切档还是直接放行主任务。"
    attention: "看结果时要结合分支语义，不要只看成功失败字面。"
  MFSequence:
    display_name: "梅林顺序流程"
    summary: "用于兼容旧实例名或演示数据里的梅林主链节点。"
    scenario: "若界面出现 MFSequence，会显示成中文。"
    attention: "实际运行中更建议使用具名实例名，例如 MF_Main。"
  CombatSequence:
    display_name: "对抗顺序流程"
    summary: "用于兼容旧实例名或演示数据里的对抗主链节点。"
    scenario: "若界面出现 CombatSequence，会显示成中文。"
    attention: "实际运行中更建议使用具名实例名，例如 Combat_Sequence。"
  MCSequence:
    display_name: "武馆顺序流程"
    summary: "用于兼容旧实例名或演示数据里的武馆主链节点。"
    scenario: "若界面出现 MCSequence，会显示成中文。"
    attention: "实际运行中更建议使用具名实例名，例如 MC_Sequence。"
  MC_Sequence:
    display_name: "武馆顺序流程"
    summary: "武馆任务的主流程骨架。"
    scenario: "取矛头和组装都挂在它下面。"
    attention: "只要它没成功，武馆阶段就不会结束。"
  grab_tip:
    display_name: "取矛头"
    summary: "这是 `GrabTip` 在武馆树里的实例名。"
    scenario: "画布上点到这个名字时，运维更容易一眼看懂。"
    attention: "实例名用于界面显示，不影响后端执行逻辑。"
  assemble:
    display_name: "执行组装"
    summary: "这是 `AssembleWeapon` 的实例名。"
    scenario: "与手动机器人协同成功后执行。"
    attention: "如果等待很久，多半是前面的检查未通过。"
  MF_Main:
    display_name: "梅林主流程"
    summary: "梅林任务顶层顺序流程。"
    scenario: "进门、循环、离场都从这里串起来。"
    attention: "它运行中并不代表异常，只是说明梅林阶段正在执行。"
  Entry_Seq:
    display_name: "进门顺序流程"
    summary: "负责切档、进门和让路检测。"
    scenario: "进入梅林初期使用。"
    attention: "入口卡住时优先检查这里。"
  Loop_Body:
    display_name: "循环主体"
    summary: "扫描、决策和执行的主体流程。"
    scenario: "梅林循环的核心骨架。"
    attention: "如果一直运行中，说明任务仍在循环内。"
  Exit_Seq:
    display_name: "离场顺序流程"
    summary: "负责切档、导航离场和下楼梯。"
    scenario: "梅林任务收尾时进入。"
    attention: "卡在这里通常与导航或楼梯动作有关。"
  Combat_Sequence:
    display_name: "对抗顺序流程"
    summary: "对抗区的跟随和放置主链。"
    scenario: "对抗阶段顶层骨架。"
    attention: "前半段是跟随，后半段是放置。"
  goto_combat:
    display_name: "前往对抗区"
    summary: "对抗区入口分支，优先尝试跟随。"
    scenario: "刚进入对抗阶段时运行。"
    attention: "这里失败常代表 R1 丢失或路径不可用。"
  place_sequence:
    display_name: "放置序列"
    summary: "抬机构后执行放置。"
    scenario: "抵达对抗放置点后进入。"
    attention: "要结合机构状态和 KFS 数量一起看。"
  loc_guard_fallback:
    display_name: "定位守护分流"
    summary: "定位守护树的顶层分流节点。"
    scenario: "决定恢复、切档还是直接放行。"
    attention: "这里结果变化快，建议配合事件时间线看。"
  loc_guard_recovery:
    display_name: "定位恢复流程"
    summary: "定位风险较高时进入的恢复链。"
    scenario: "包括观测恢复、锚点恢复和短延时。"
    attention: "如果经常进入，说明定位链路存在持续风险。"
  loc_recover_chain:
    display_name: "恢复动作链"
    summary: "按顺序尝试观测恢复、锚点恢复和缓冲等待。"
    scenario: "定位守护真正执行恢复动作的地方。"
    attention: "要看是卡在原地观测还是卡在锚点恢复。"
  loc_profile_switch:
    display_name: "定位档位切换"
    summary: "定位尚可但风险升高时，仅做保守切档。"
    scenario: "黄色或橙色风险但还没到必须抢占恢复时使用。"
    attention: "这个分支结束后通常会让主任务继续。"

blackboard_keys:
  loc_level:
    display_name: "定位健康等级"
    tooltip: "定位链路当前风险等级，数值越大风险越高。"
    summary: "这是判断是否进入定位守护的核心指标。"
    scenario: "想知道机器人为什么突然变慢或切到恢复，先看它。"
    attention: "只看等级不够，要同时看 `loc_reason` 和推荐档位。"
    related_blackboard_keys: ["loc_reason", "loc_recommended_profile", "loc_guard_required"]
    values:
      "0":
        display_name: "绿色"
        explanation: "定位正常，可以按常规策略运行。"
      "1":
        display_name: "黄色"
        explanation: "定位有轻微风险，通常会切到更保守的导航档位。"
      "2":
        display_name: "橙色"
        explanation: "定位风险较高，需要明显保守，部分情况下会进入恢复。"
      "3":
        display_name: "红色"
        explanation: "定位风险很高，通常需要立即进入恢复或停车保守。"
  loc_reason:
    display_name: "定位原因说明"
    tooltip: "定位模块给出的当前异常原因。"
    summary: "这是对 `loc_level` 的文字解释。"
    scenario: "适合直接给运维同学看，用来快速判断是图优化掉线还是观测不足。"
    attention: "这是来源模块的原始文本，必要时要结合英文原文一起判断。"
  loc_recommended_profile:
    display_name: "推荐导航档位"
    tooltip: "定位守护建议当前使用的导航策略档位。"
    summary: "它会直接影响 `SetNavMode` 节点切到哪个档位。"
    scenario: "定位变差时，这个值常从 `normal` 切到 `loc_yellow` 或更保守档位。"
    attention: "如果这个值频繁变化，说明定位风险在抖动。"
    related_blackboard_keys: ["loc_level", "loc_last_profile", "loc_guard_required"]
    values:
      "normal":
        display_name: "常规档"
        explanation: "按默认速度和默认约束运行。"
      "loc_yellow":
        display_name: "黄色保守档"
        explanation: "轻度保守，主要用来降低风险。"
      "loc_orange":
        display_name: "橙色保守档"
        explanation: "明显保守，通常会降低速度并提高稳定性。"
      "loc_red_hold":
        display_name: "红色保持档"
        explanation: "极度保守，通常用于等待或恢复。"
  loc_guard_required:
    display_name: "是否需要定位守护"
    tooltip: "当前是否已经满足进入定位恢复的条件。"
    summary: "为真时，定位守护分支会抢占主任务。"
    scenario: "主任务被突然打断时，先看这个值是不是变成了 true。"
    attention: "为假不代表定位完全正常，只表示还没到必须抢占。"
    related_blackboard_keys: ["loc_level", "loc_guard_reason"]
    values:
      "true":
        display_name: "需要"
        explanation: "说明当前风险足以触发守护恢复。"
      "false":
        display_name: "暂不需要"
        explanation: "说明当前风险还未达到抢占阈值。"
  loc_guard_reason:
    display_name: "定位守护原因"
    tooltip: "进入守护或仅切档的直接原因。"
    summary: "帮助运维理解为什么当前走了恢复链。"
    scenario: "定位树切换时，用它判断是 profile_only 还是更严重的异常。"
    attention: "如果这里长期为空，通常说明还没触发守护。"
  vision_running:
    display_name: "视觉是否运行"
    tooltip: "视觉推理线程当前是否在运行。"
    summary: "用来判断视觉链路是否真的启动。"
    scenario: "等待视觉目标之前，先确认这个值。"
    attention: "为 true 只代表线程在跑，不代表一定有有效结果。"
    values:
      "true":
        display_name: "运行中"
        explanation: "视觉线程已启动。"
      "false":
        display_name: "未运行"
        explanation: "视觉线程未启动或已经停止。"
  vision_has_target:
    display_name: "视觉是否看到目标"
    tooltip: "当前最新一帧是否已经识别到目标。"
    summary: "是视觉等待节点最常看的结果键。"
    scenario: "想知道识别失败是没开视觉还是没看到目标，就看它。"
    attention: "为 false 可能是目标不存在，也可能是模型或阈值不合适。"
    related_blackboard_keys: ["vision_running", "vision_ok", "vision_distance_m", "vision_attr_kind"]
    values:
      "true":
        display_name: "已看到"
        explanation: "当前帧已经识别到目标。"
      "false":
        display_name: "未看到"
        explanation: "当前帧还没有识别到目标。"
  vision_distance_m:
    display_name: "视觉目标距离"
    tooltip: "目标离机器人估计还有多少米。"
    summary: "用于判断目标是否已经进入可操作范围。"
    scenario: "等待视觉目标时，距离是否过远会直接影响判断结果。"
    attention: "数值异常时，既要看感知质量，也要看标定。"
  vision_current_model:
    display_name: "当前视觉模型"
    tooltip: "视觉模块当前使用的模型配置。"
    summary: "帮助运维确认是否切到了正确模型。"
    scenario: "识别错目标时，先看是不是模型切错了。"
    attention: "模型为空通常意味着切换失败或还没初始化。"
  mechanism_tip_state:
    display_name: "矛头机构状态"
    tooltip: "机构当前对矛头的持有或姿态状态。"
    summary: "武馆取矛头和组装最关键的机构状态键。"
    scenario: "抓取或组装失败时先看它是否符合预期。"
    attention: "具体编码意义仍要结合机构协议，但运维层可先看是否变化。"
    related_blackboard_keys: ["mechanism_comm_health_level", "last_action_error_code"]
  mechanism_comm_health_level:
    display_name: "机构通信健康等级"
    tooltip: "机构控制链路当前的通信健康状态。"
    summary: "用来区分动作失败是逻辑原因还是通信问题。"
    scenario: "动作节点失败且错误码不稳定时优先看它。"
    attention: "通信差时，不要只盯 BT，要同时看机构节点日志。"
    values:
      "0":
        display_name: "正常"
        explanation: "通信状态正常。"
      "1":
        display_name: "轻微异常"
        explanation: "有轻微通信波动，建议持续观察。"
      "2":
        display_name: "明显异常"
        explanation: "通信质量较差，动作成功率可能下降。"
      "3":
        display_name: "严重异常"
        explanation: "通信问题明显，动作可能直接失败。"
  last_action_error_code:
    display_name: "最近动作错误码"
    tooltip: "最近一次机构动作返回的错误码。"
    summary: "排查抓取、组装、放置失败时最有价值的编码键之一。"
    scenario: "动作失败后可先记下这个码，再查日志或协议表。"
    attention: "错误码含义要结合机构协议解释，界面只做引导说明。"
  current_grid:
    display_name: "当前所在格子"
    tooltip: "机器人当前认为自己位于哪个梅林格子。"
    summary: "是梅林任务最核心的位置上下文。"
    scenario: "决策异常、来回绕圈、抓错格子时先看它。"
    attention: "如果和实际位置明显不符，后续决策大概率都会偏。"
    related_blackboard_keys: ["target_grid", "next_action", "merlin_last_transition_reason"]
  next_action:
    display_name: "下一步决策"
    tooltip: "梅林决策节点给出的下一步动作类型。"
    summary: "它直接决定后续走抓取分支、移动分支还是等待。"
    scenario: "运维要判断系统“接下来想干什么”时，看这个最直观。"
    attention: "要结合 `target_grid` 看，不要只看动作名。"
    related_blackboard_keys: ["current_grid", "target_grid"]
    values:
      "GRAB":
        display_name: "抓取"
        explanation: "说明当前应去目标格抓取 KFS。"
      "MOVE":
        display_name: "移动"
        explanation: "说明当前应先转移到更优格子。"
      "WAIT":
        display_name: "等待"
        explanation: "说明当前没有更好动作，先短暂等待。"
  target_grid:
    display_name: "目标格子"
    tooltip: "下一步准备前往或操作的格子编号。"
    summary: "和 `next_action` 一起构成梅林任务的决策结果。"
    scenario: "导航错格或抓错格时最需要核对。"
    attention: "这个值不更新时，机器人可能会重复执行旧决策。"
    related_blackboard_keys: ["current_grid", "next_action"]
  exit_grid:
    display_name: "离场目标格"
    tooltip: "梅林任务离场时参考的出口格子编号。"
    summary: "帮助判断离场逻辑是否按预期执行。"
    scenario: "到达采集目标后准备离场时关注。"
    attention: "如果出口编号配置错，离场路线会整体跑偏。"
  kfs_on_board:
    display_name: "车上 KFS 数量"
    tooltip: "当前已经抓到并带在车上的 KFS 数量。"
    summary: "反映任务当前收益进度。"
    scenario: "判断是否该离场、是否真的抓取成功时非常关键。"
    attention: "数量不变通常意味着前面的抓取或计数节点没有成功。"
  team:
    display_name: "当前队伍颜色"
    tooltip: "当前机器人所属队伍。"
    summary: "用于决定地图或目标语义的上下文。"
    scenario: "调试不同场次配置时有用。"
    attention: "这个值错了，后续很多策略都会一起错。"
    values:
      "blue":
        display_name: "蓝方"
        explanation: "当前按蓝方任务配置运行。"
      "red":
        display_name: "红方"
        explanation: "当前按红方任务配置运行。"
  merlin_last_transition_reason:
    display_name: "梅林最近转移原因"
    tooltip: "最近一次格子切换或决策变化的原因。"
    summary: "适合解释为什么系统突然改走另一条路径。"
    scenario: "感觉系统“莫名其妙换目标”时先看它。"
    attention: "这是调试友好键，内容可能更偏工程内部表述。"
  current_level:
    display_name: "当前楼层"
    tooltip: "机器人当前处于哪个高度层。"
    summary: "上下楼梯相关动作都依赖这个状态。"
    scenario: "判断楼梯动作是否真正完成时有帮助。"
    attention: "如果楼层状态不更新，楼梯逻辑可能一直不收敛。"

services:
  "/localization/health":
    display_name: "定位健康输入"
    summary: "向行为树提供定位等级、原因和控制退化状态。"
    scenario: "定位守护判断是否需要恢复时会依赖它。"
    attention: "这个条目当前主要用于目录说明，前端暂不直接展示。"
  "/localization/backend_status":
    display_name: "定位后端状态输入"
    summary: "提供图优化健康度和优化器是否就绪。"
    scenario: "定位等级突然恶化时要一起看。"
    attention: "后端状态差时，定位守护通常会更积极地介入。"
  "/localization/route_observability":
    display_name: "路径可观测性输入"
    summary: "提供路线观测质量和推荐导航档位。"
    scenario: "推荐档位变化时来源常常在这里。"
    attention: "这类输入变化快，建议配合时间线观察。"
  "/mechanism/state":
    display_name: "机构状态输入"
    summary: "提供机构持有状态、错误码和通信健康度。"
    scenario: "所有机构动作失败都应该先看它。"
    attention: "它属于底层状态，不是行为树内部自己算出来的。"

events:
  BT_NODE_RUNNING:
    display_name: "行为树节点运行中"
    summary: "表示某个关键节点开始持续运行。"
    scenario: "适合提示当前任务卡在哪个动作上。"
    attention: "运行中不等于异常，要看是否超出合理时长。"
  BT_NODE_FAILURE:
    display_name: "行为树节点失败"
    summary: "表示某个关键节点返回失败。"
    scenario: "适合定位最近的失败点。"
    attention: "失败也可能是流程设计中的正常分支，需结合上下文判断。"
  LOCALIZATION_DEGRADED:
    display_name: "定位退化"
    summary: "定位链路风险升高。"
    scenario: "通常会伴随导航档位切换或守护恢复。"
    attention: "不要只盯告警标题，要继续看定位原因和推荐档位。"
  VISION_TARGET_ACQUIRED:
    display_name: "视觉已锁定目标"
    summary: "视觉链路已经看到目标。"
    scenario: "等待视觉目标成功后可作为运维提示。"
    attention: "当前项目里该事件还未单独发布，先作为预留目录项。"
