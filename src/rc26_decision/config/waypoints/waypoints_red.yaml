header:
  version: "1.3"
  team: "red"
  frame_id: "map"

# ==============================================================================
# 静态导航点配置
# ==============================================================================
static_points:
  start_pose:
    x: 0.0
    y: 0.0
    theta: 0.0
    strategy_tag: "TAG_INIT"
    nav_profile: "normal"
    speed_profile: "FAST"
    tolerance: {xy: 0.10, yaw: 0.15}
    timeout_sec: 10.0

  # --------------------------------------------------------------------------
  # 定位守护恢复点（P2）
  # 注意：以下坐标为默认安全占位，联调前请按实测地图标定并覆盖。
  # --------------------------------------------------------------------------
  loc_retry_zone_1:
    x: 0.50
    y: 0.00
    theta: 0.0
    strategy_tag: "TAG_LOC_RETRY_ZONE_1"
    nav_profile: "loc_orange"
    speed_profile: "CREEP"
    tolerance: {xy: 0.10, yaw: 0.20}
    timeout_sec: 8.0

  loc_anchor_1:
    x: 1.00
    y: 0.30
    theta: 0.0
    strategy_tag: "TAG_LOC_ANCHOR_1"
    nav_profile: "loc_orange"
    speed_profile: "CREEP"
    tolerance: {xy: 0.10, yaw: 0.20}
    timeout_sec: 10.0

  loc_anchor_2:
    x: 1.00
    y: -0.30
    theta: 0.0
    strategy_tag: "TAG_LOC_ANCHOR_2"
    nav_profile: "loc_orange"
    speed_profile: "CREEP"
    tolerance: {xy: 0.10, yaw: 0.20}
    timeout_sec: 10.0

  # --------------------------------------------------------------------------
  # 梅林区入口点 (2号格前方100mm)
  # --------------------------------------------------------------------------
  mf_entry:
    x: 0.0      # TODO: 根据实际地图测量填充
    y: 0.0      # TODO: 根据实际地图测量填充
    theta: 0.0  # 朝向梅林区
    strategy_tag: "TAG_MF_ENTRY"
    nav_profile: "mf_safe"
    speed_profile: "SLOW"
    tolerance: {xy: 0.05, yaw: 0.10}
    timeout_sec: 15.0

  # --------------------------------------------------------------------------
  # 梅林区入口后退点 (等待R1让路时后退1500mm)
  # --------------------------------------------------------------------------
  mf_entry_back:
    x: 0.0      # TODO: mf_entry.x - 1.5 * cos(theta)
    y: 0.0      # TODO: mf_entry.y - 1.5 * sin(theta)
    theta: 0.0
    strategy_tag: "TAG_MF_ENTRY_BACK"
    nav_profile: "normal"
    speed_profile: "MEDIUM"
    tolerance: {xy: 0.10, yaw: 0.15}
    timeout_sec: 10.0

  # --------------------------------------------------------------------------
  # 梅林区出口点 (10号格前方1000mm)
  # --------------------------------------------------------------------------
  mf_exit:
    x: 0.0      # TODO: 根据实际地图测量填充
    y: 0.0      # TODO: 根据实际地图测量填充
    theta: 0.0  # 朝向对抗区
    strategy_tag: "TAG_MF_EXIT"
    nav_profile: "mf_exit"
    speed_profile: "SLOW"
    tolerance: {xy: 0.10, yaw: 0.15}
    timeout_sec: 20.0

# ==============================================================================
# 梅林区格子配置 (红方)
# ==============================================================================
# 格子编号布局:
#   10  11  12   (出口行, 高度: 200/400/200mm)
#    7   8   9   (高度: 400/600/400mm)
#    4   5   6   (高度: 600/400/200mm)
#    1   2   3   (入口行, 高度: 400/200/400mm)
#
# 每格尺寸: 1200mm x 1200mm
# ==============================================================================
merlin_config:
  # 统一静态真值文件。为空时 WaypointManager 会使用 rc26_kfs_keepout 默认布局文件。
  world_layout_file: ""

  # 兼容回退：仅当 world_layout_file 无法加载时才使用 anchors 推导点位。
  # 锚点坐标 (用于计算其他格子位置)
  anchors:
    block_1: {x: 0.0, y: 0.0}   # TODO: 1号格中心坐标
    block_2: {x: 0.0, y: 0.0}   # TODO: 2号格中心坐标 (入口格)
    block_4: {x: 0.0, y: 0.0}   # TODO: 4号格中心坐标

  # 格子间距参数
  params:
    grid_size: 1.2              # 格子边长 (米)
    safe_offset: 0.20           # 安全偏移量
    jump_margin: 0.20           # 跨越余量
