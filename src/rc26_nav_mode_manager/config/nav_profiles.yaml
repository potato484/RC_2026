profiles:
  plane_move:
    fallback_profile: hold
    watchdog:
      timeout_sec: 0
      stop_required_on_timeout: false
    precheck:
      require_stopped: false
    controller:
      v_linear_max: 0.8
      v_angular_max: 1.0
      acc_linear: 0.6
      acc_angular: 0.8

  mf_traverse:
    fallback_profile: hold
    watchdog:
      timeout_sec: 10.0
      stop_required_on_timeout: false
    precheck:
      require_stopped: true
    controller:
      v_linear_max: 0.5
      v_angular_max: 0.5
      acc_linear: 0.5
      acc_angular: 0.5

  mf_exit:
    fallback_profile: hold
    watchdog:
      timeout_sec: 10.0
      stop_required_on_timeout: true
    precheck:
      require_stopped: true
    controller:
      v_linear_max: 0.5
      v_angular_max: 0.5
      acc_linear: 0.4
      acc_angular: 0.4

  ramp_up:
    fallback_profile: hold
    watchdog:
      timeout_sec: 30.0
      stop_required_on_timeout: false
    precheck:
      require_stopped: true
    controller:
      v_linear_max: 0.3
      v_angular_max: 0.35
      acc_linear: 0.3
      acc_angular: 0.3

  ramp_down:
    fallback_profile: hold
    watchdog:
      timeout_sec: 30.0
      stop_required_on_timeout: false
    precheck:
      require_stopped: true
    controller:
      v_linear_max: 0.3
      v_angular_max: 0.35
      acc_linear: 0.25
      acc_angular: 0.3

  hold:
    fallback_profile: hold
    watchdog:
      timeout_sec: 0
      stop_required_on_timeout: true
    precheck:
      require_stopped: true
    controller:
      v_linear_max: 0.0
      v_angular_max: 0.0
      acc_linear: 0.2
      acc_angular: 0.2
