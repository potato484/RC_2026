meta:
  schema_version: "1.0"
  coordinate_frame: "map"

mf_block_node:
  type: "mf_edge_pose"
  level: 1
  phase_mask: 255
  operation_tag: "grab"
  yaw: 1.5708
  z_from_expected_height_scale: 0.5
  base_cost_default: 1.0

node_overrides:
  - id: "mf_b2"
    base_cost: 0.5

  - id: "mf_b6"
    base_cost: 1.5

  - id: "mf_b8"
    base_cost: 1.5

mf_grid_edge:
  motion_type: "plane_move"
  required_mode: "mf_traverse"
  requires_confirmation: false
  can_block: true
  phase_mask: 255
  base_cost: 1.0

nodes_prepend:
  - id: "mf_entry_staging"
    type: "staging"
    pose: {x: 1.2, y: -0.6, z: 0.0, yaw: 1.5708}
    level: 0
    phase_mask: 255
    block_id: 0
    base_cost: 0.0
    operation_tag: ""

nodes_append:
  - id: "mf_exit_staging"
    type: "staging"
    pose: {x: 1.2, y: 4.2, z: 0.0, yaw: 1.5708}
    level: 0
    phase_mask: 255
    block_id: 0
    base_cost: 0.0
    operation_tag: ""

  - id: "ramp_entry_south"
    type: "ramp_entry"
    pose: {x: 1.2, y: -0.3, z: 0.0, yaw: 1.5708}
    level: 0
    phase_mask: 255
    block_id: 0
    base_cost: 2.0
    operation_tag: ""

  - id: "ramp_exit_north"
    type: "ramp_exit"
    pose: {x: 1.2, y: 3.9, z: 0.0, yaw: 1.5708}
    level: 0
    phase_mask: 255
    block_id: 0
    base_cost: 2.0
    operation_tag: ""

edge_overrides:
  - id: "e_b3_b6"
    base_cost: 1.5
    height_change: 0.2

  - id: "e_b6_b3"
    base_cost: 1.5
    height_change: 0.2

edges_prepend:
  - id: "e_staging_b2"
    from: "mf_entry_staging"
    to: "mf_b2"
    motion_type: "plane_move"
    height_change: 0.1
    required_mode: "mf_traverse"
    requires_confirmation: true
    can_block: false
    phase_mask: 255
    base_cost: 2.0

edges_append:
  - id: "e_b10_exit"
    from: "mf_b10"
    to: "mf_exit_staging"
    motion_type: "plane_move"
    height_change: 0.1
    required_mode: "mf_exit"
    requires_confirmation: false
    can_block: false
    phase_mask: 255
    base_cost: 2.0

  - id: "e_b11_exit"
    from: "mf_b11"
    to: "mf_exit_staging"
    motion_type: "plane_move"
    height_change: 0.2
    required_mode: "mf_exit"
    requires_confirmation: false
    can_block: false
    phase_mask: 255
    base_cost: 2.0

  - id: "e_b12_exit"
    from: "mf_b12"
    to: "mf_exit_staging"
    motion_type: "plane_move"
    height_change: 0.1
    required_mode: "mf_exit"
    requires_confirmation: false
    can_block: false
    phase_mask: 255
    base_cost: 2.0

  - id: "e_ramp_up_south"
    from: "ramp_entry_south"
    to: "mf_entry_staging"
    motion_type: "ramp_up"
    height_change: 0.2
    required_mode: "ramp_up"
    requires_confirmation: true
    can_block: false
    phase_mask: 255
    base_cost: 5.0
    control_points:
      - {x: 1.2, y: -0.45, z: 0.05, yaw: 1.5708}

  - id: "e_ramp_down_north"
    from: "mf_exit_staging"
    to: "ramp_exit_north"
    motion_type: "ramp_down"
    height_change: 0.2
    required_mode: "ramp_down"
    requires_confirmation: true
    can_block: false
    phase_mask: 255
    base_cost: 5.0
    control_points:
      - {x: 1.2, y: 4.05, z: 0.05, yaw: 1.5708}

tasks:
  - task_tag: "mf_grab"
    candidate_nodes:
      - "mf_b1"
      - "mf_b2"
      - "mf_b3"
      - "mf_b4"
      - "mf_b5"
      - "mf_b6"
      - "mf_b7"
      - "mf_b8"
      - "mf_b9"
      - "mf_b10"
      - "mf_b11"
      - "mf_b12"
    selection_policy: "min_total_cost"

  - task_tag: "mf_exit"
    candidate_nodes:
      - "mf_exit_staging"
    selection_policy: "min_total_cost"

  - task_tag: "mf_entry"
    candidate_nodes:
      - "mf_entry_staging"
    selection_policy: "min_total_cost"

routes:
  - route_tag: "mf_entry_default"
    nodes:
      - "ramp_entry_south"
      - "mf_entry_staging"
      - "mf_b2"

  - route_tag: "mf_exit_default"
    nodes:
      - "mf_exit_staging"
      - "ramp_exit_north"
